apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def packageJsonFile = file('../../package.json')
if (!packageJsonFile.exists()) {
    throw new GradleException("Could not find package.json at ${packageJsonFile.canonicalPath}")
}
def packageJson = new JsonSlurper().parseText(packageJsonFile.text)
def appVersionName = packageJson.version
if (!appVersionName) {
    throw new GradleException("Could not read 'version' from package.json at ${packageJsonFile.canonicalPath}")
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('../release-signing.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    def environmentValue = System.getenv(environmentName)
    return environmentValue?.trim() ? environmentValue.trim() : releaseSigningProperties.getProperty(propertyName)?.trim()
}

def releaseStoreFile = signingValue('storeFile', 'FITDEX_KEYSTORE_PATH')
def releaseStorePassword = signingValue('storePassword', 'FITDEX_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'FITDEX_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'FITDEX_KEY_PASSWORD')
def releaseSigningReady = releaseStoreFile && new File(releaseStoreFile).isFile() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any { task ->
        task.path.startsWith(':app:') && task.name.toLowerCase().contains('release')
    }
    if (releaseRequested && !releaseSigningReady) {
        throw new GradleException('Release signing credentials are required. Add ignored release-signing.properties or set FITDEX_KEYSTORE_PATH, FITDEX_KEYSTORE_PASSWORD, FITDEX_KEY_ALIAS, and FITDEX_KEY_PASSWORD. Release builds never use debug signing.')
    }
}

android {
    namespace = "com.fitdex.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fitdex.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
