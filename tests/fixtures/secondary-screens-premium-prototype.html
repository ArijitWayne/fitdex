    .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }.proto-picker-item:active { transform: scale(0.97); }.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }.proto-picker-item[data-active] { color: #fff; }

<body>
  <header class="proto-controls"><div class="proto-controls-inner"><label>Screen<select id="screen"></select></label><label>Theme<select id="theme"><option value="spartans:dark">Spartan dark</option><option value="spartans:light">Spartan light</option><option value="amazonians:dark">Amazonian dark</option><option value="amazonians:light">Amazonian light</option></select></label></div></header>
  <main id="stage"></main>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Gallery</button>
    <button class="proto-picker-item">Pedestal</button>
    <button class="proto-picker-item">Roster</button>
  </nav>
  <script>
    const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)]
    const screens=[['home','Home refinement'],['routine','Create Routine'],['dex','Exercise Dex Index'],['favorites','Exercise Dex Favorites'],['consistency','Consistency Deck'],['meal','Meal Detail'],['rank','Level & Rank'],['achievements','Achievements'],['identity','Settings Identity'],['appearance','Settings Appearance'],['champion','Choose Champion']]
    const screen=$('#screen');screen.innerHTML=screens.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');screen.value='champion'
    const ranks=[['recruit','Recruit','Levels 1–4'],['regular','Regular','Levels 5–9'],['hardened','Hardened','Levels 10–19'],['warrior','Warrior','Levels 20–34'],['veteran','Veteran','Levels 35–49']]
    const achievement=[['streak-7','Seven-Day Fire','Consistency','12 Sep'],['first-pr','First Record','Performance','04 Sep'],['protein-target-7','Protein Seven','Nutrition','5 / 7'],['workouts-50','Fifty Workouts','Training','Locked']]
    const champions=[
      ['aster','Aster','The Athlete','Move fast. Train hard. Stay versatile.','/avatars/spartans/aster.png'],
      ['leonidas','Leonidas','The Leader','Lead with discipline. Finish what you start.','/avatars/spartans/leonidas.png'],
      ['brasidas','Brasidas','The Competitor','Chase the next challenge. Beat yesterday.','/avatars/spartans/brasidas.png'],
      ['artemis','Artemis','The Explorer','Keep moving. Try more. Find what drives you.','/avatars/amazonians/artemis.png'],
      ['athena','Athena','The Strategist','Train with purpose. Track every move.','/avatars/amazonians/athena.png'],
      ['hippolyta','Hippolyta','The Powerhouse','Build strength. Own the challenge.','/avatars/amazonians/hippolyta.png']
    ];let selectedChampion='leonidas';let selectedMeal='breakfast';let championVariant=0
    const module=(title,body,primary=false,wide=false)=>`<section class="proto-module ${primary?'is-primary':''} ${wide?'is-wide':''}"><header class="proto-module-head"><h2>${title}</h2></header><div class="proto-module-body">${body}</div></section>`
    const header=(back,title,description='')=>`<header class="proto-subhead"><button class="proto-back" type="button">‹ ${back}</button><h1>${title}</h1>${description?`<p>${description}</p>`:''}</header>`
    const row=(icon,title,description,meta='›')=>`<button class="proto-row" type="button"><span class="proto-row-icon">${icon}</span><span class="proto-row-copy"><b>${title}</b><small>${description}</small></span><span class="proto-row-meta">${meta}</span></button>`
    const card=(icon,title,description,meta='›')=>`<button class="proto-record-card" type="button"><span class="proto-row-icon">${icon}</span><span class="proto-row-copy"><b>${title}</b><small>${description}</small></span><span class="proto-row-meta">${meta}</span></button>`
    const nav=current=>`<nav class="proto-bottom-nav">${['Home','Workout','Food','Progress','Settings'].map(x=>`<span class="${x===current?'is-current':''}">${x.toUpperCase()}</span>`).join('')}</nav>`
    const shell=(title,meta,content,current)=>`<section class="fitdex-command-frame proto-frame"><header class="fitdex-command-status"><span class="fitdex-command-title"><i class="status-terminal-dot"></i>${title}</span><span class="fitdex-command-status-right"><span class="fitdex-command-meta">${meta}</span><button class="proto-help" aria-label="Help">?</button></span></header><div class="fitdex-command-stack proto-content">${content}${nav(current)}</div></section>`
    const sprite=(category)=>`/exercise-categories/${document.documentElement.dataset.themeFamily==='amazonians'?'amazonian':'spartan'}/${document.documentElement.dataset.brightness==='light'?'light':'dark'}/${category}.png`
    const tile=(name,count,art='',selected=false)=>`<button class="proto-tile ${selected?'is-selected':''}" type="button"><b>${name}</b><small>${count}</small>${art?`<img src="${art}" alt="">`:''}</button>`
    function home(){return shell('FITDEX // HOME TERMINAL','THU 01 OCT',`<section class="proto-home-command is-wide"><section class="proto-home-hero"><div class="proto-home-hero-main"><img class="proto-home-avatar" src="/avatars/spartans/leonidas.png" alt="Leonidas"><div class="proto-home-copy"><p>Player 01 · Good evening</p><h1>Ash</h1><small>LV 16 · Hardened</small></div><div class="proto-home-rank"><img src="/gamification/ranks/hardened.webp" alt="Hardened rank emblem"><small>Hardened</small></div></div><div class="proto-home-xp"><span>XP</span><div class="proto-progress"><i style="width:63%"></i></div><strong>6,000</strong></div><div class="proto-home-stats"><div class="proto-home-stat"><b>1 DAY</b><small>PLAN STREAK</small></div><div class="proto-home-stat"><b class="proto-home-freeze-value"><svg class="proto-home-freeze-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/><path d="m4.93 4.93 14.14 14.14"/><path d="m19.07 4.93-14.14 14.14"/><path d="m9 3 3 3 3-3"/><path d="m9 21 3-3 3 3"/><path d="m3 9 3 3-3 3"/><path d="m21 9-3 3 3 3"/></svg><span>0</span></b><small>FREEZES</small></div><div class="proto-home-stat"><b>19 DAYS</b><small>BEST</small></div><span class="proto-home-stat-nav">›</span></div></section><section class="proto-home-active"><p class="proto-home-label">Active command</p><div class="proto-home-active-top"><span class="proto-home-caret">▶</span><div class="proto-home-active-copy"><p>Workout paused</p><h2>Leg Day</h2><small>0 min active · timer paused · 5 exercises</small></div><strong class="proto-home-recover">RECOVER</strong></div><button class="proto-home-cta">Open paused workout</button></section></section>${module("Today's mission",`<div class="proto-card-stack">${card('01','Today’s mission','Leg Day ready','START')}${card('02','Nutrition','1,240 / 2,450 kcal','51%')}${card('03','Progress','+45 XP today','›')}${card('04','Achievements','18 unlocked','›')}${card('05','Journal','1 workout · 2 food items','›')}${card('06','Battle music','Arena I','▶')}</div>`,false,true)}`,'Home')}
    function routine(){return shell('FITDEX // WORKOUT','LV 16',`${header('WORKOUT HUB','Create Routine','Reusable workout template.')}${module('Routine details',`<form class="proto-field" onsubmit="event.preventDefault();this.querySelector('button').textContent='ROUTINE CREATED'"><label>Routine name<input placeholder="Push Day" maxlength="80"></label><button class="proto-primary">Create routine</button><button class="proto-text" type="button">Cancel</button></form>`,true,true)}`,'Workout')}
    function dex(favorites=false){let body=favorites?`${row('☆','Barbell Bench Press','Chest · Barbell','3×8')}${row('☆','Cable Row','Back · Cable','3×10')}${row('☆','Goblet Squat','Legs · Dumbbell','3×12')}`:`<div class="proto-tiles">${tile('Chest','12 exercises',sprite('chest'))}${tile('Back','18 exercises',sprite('back'))}${tile('Legs','21 exercises',sprite('legs'))}${tile('Shoulders','14 exercises',sprite('shoulders'))}${tile('Biceps','15 exercises',sprite('biceps'))}${tile('Abs','10 exercises',sprite('abs'))}</div>`;return shell('FITDEX // EXERCISE CODEX','ARCHIVE',`${header('WORKOUT','Exercise Dex','Movement archive and routine tools.')}${module('FitDex field archive',`<div class="proto-cover"><img class="proto-cover-art" src="/avatars/spartans/leonidas.png" alt=""><div><p class="eyebrow">FitDex field archive</p><h3>Exercise Codex</h3><p>Browse 804 verified records. Find movement. Study form. Carry it into training.</p></div></div><label class="proto-field">Search exercises<input placeholder="Search exercises…"></label><div class="proto-tabs"><button class="proto-tab ${favorites?'':'is-selected'}" data-dex="dex">INDEX</button><button class="proto-tab ${favorites?'is-selected':''}" data-dex="favorites">☆ FAVORITES</button></div>`,true,true)}${module(favorites?'Saved movements':'Browse categories',body,false,true)}`,'Workout')}
    function consistency(){return shell('FITDEX // CONSISTENCY','DAY 18',`${header('HOME','Consistency Deck','Plan protection and recovery.')}${module('Current plan streak',`<div class="proto-status"><strong>18 days</strong><small>BEST · 31 DAYS</small></div>`,true,true)}${module('Freeze protection',`<div class="proto-card-stack">${card('❄','2 freezes available','Applied after missed planned day','READY')}${card('◒','Next freeze','4 / 7 successful days','57%')}<div class="proto-progress"><i style="width:57%"></i></div></div>`)}${module('Travel / sickness pause',`<div class="proto-card-stack">${card('◌','Pause allowance','2 of 3 yearly pauses remain')}<button class="proto-secondary">Plan a pause</button></div>`)}`,'Home')}
    const meals={breakfast:{name:'Breakfast',art:'meal-breakfast',total:'105 kcal',protein:'1.3G PROTEIN',carbs:'27g',fat:'.3g',fiber:'3g',entries:[['Banana','Fruits','105 kcal · 1.3g protein','fruits'],['Eggs','Eggs','155 kcal · 13g protein','eggs'],['Oats','Grains & Rice','150 kcal · 5g protein','grains-rice']]},lunch:{name:'Lunch',art:'meal-lunch',total:'618 kcal',protein:'54G PROTEIN',carbs:'64g',fat:'15g',fiber:'9g',entries:[['Chicken breast','Chicken','248 kcal · 46g protein','chicken'],['Brown rice','Grains & Rice','216 kcal · 5g protein','grains-rice'],['Roasted vegetables','Vegetables','154 kcal · 3g protein','vegetables']]},dinner:{name:'Dinner',art:'meal-dinner',total:'522 kcal',protein:'41G PROTEIN',carbs:'49g',fat:'18g',fiber:'8g',entries:[['Chicken stir-fry','Chicken','286 kcal · 37g protein','chicken'],['Rice noodles','Grains & Rice','176 kcal · 4g protein','grains-rice'],['Mixed vegetables','Vegetables','60 kcal · 2g protein','vegetables']]},supper:{name:'Supper',art:'meal-supper',total:'284 kcal',protein:'23G PROTEIN',carbs:'26g',fat:'10g',fiber:'5g',entries:[['Greek yogurt','Dairy','130 kcal · 16g protein','dairy'],['Mixed berries','Fruits','84 kcal · 1g protein','fruits'],['Almonds','Nuts & Seeds','70 kcal · 6g protein','nuts-seeds']]}}
    const mealEntryCard=([name,category,meta,art])=>`<button class="proto-record-card proto-food-entry-card" type="button"><img class="proto-food-icon" src="/food/categories/category-${art}.webp" alt=""><span class="proto-row-copy"><b>${name}</b><small>${category} · ${meta}</small></span><span class="proto-row-meta">EDIT</span></button>`
    function meal(){const current=meals[selectedMeal];const tabs=Object.entries(meals).map(([id,{name}])=>`<button class="proto-tab ${id===selectedMeal?'is-selected':''}" data-meal="${id}">${name.toUpperCase()}</button>`).join('');return shell('FITDEX // FOOD LOG','THU 01 OCT',`${header('FOOD',current.name,'Thu, 1 Oct')}${module('Meal totals',`<div class="proto-meal-head"><img class="proto-meal-art" src="/food/meals/${current.art}.webp" alt=""><div class="proto-status"><strong>${current.total}</strong><small>${current.protein}</small></div></div><div class="proto-data"><div><b>${current.carbs}</b><small>CARBS</small></div><div><b>${current.fat}</b><small>FAT</small></div><div><b>${current.fiber}</b><small>FIBER</small></div></div><small>Sugar — · Sat fat — · Sodium —</small>`,true,true)}${module(`${current.name} entries`,`<div class="proto-tabs" role="group" aria-label="Meal">${tabs}</div><div class="proto-card-stack">${current.entries.map(mealEntryCard).join('')}</div>`)}${module('Log food',`<button class="proto-primary">+ Add food</button>`)}`,'Food')}
    function rank(){let nodes=ranks.map(([id,name,levels])=>`<div class="proto-rank ${id==='hardened'?'is-current':''}"><img src="/gamification/ranks/${id}.webp" alt=""><span class="proto-row-copy"><b>${name}</b><small>${levels}</small></span><span class="proto-row-meta">${id==='hardened'?'CURRENT':''}</span></div>`).join('');return shell('FITDEX // GAMIFICATION','LV 16',`${header('PROGRESS','Level & Rank','Level 16 · Hardened')}${module('Current rank',`<div class="proto-status"><strong>Hardened · Level 16</strong><small>6,440 XP · 630 / 1,000 TO NEXT LEVEL</small><div class="proto-progress"><i style="width:63%"></i></div></div>`,true,true)}${module('Rank journey',nodes,false,true)}`,'Progress')}
    function achievements(){let rows=achievement.map(([id,name,cat,meta],i)=>`<article class="proto-record-card proto-achievement ${i===3?'is-locked':''}"><img src="/gamification/achievements/${id}.webp" alt=""><span class="proto-row-copy"><b>${name}</b><small>${cat} · ${i===3?'Train 50 sessions':'Record earned'}</small></span><span class="proto-row-meta">${meta}</span></article>`).join('');return shell('FITDEX // GAMIFICATION','18 / 52',`${header('PROGRESS','Achievements','18 unlocked · 35% complete.')}${module('Archive progress',`<div class="proto-status"><strong>18 / 52</strong><small>KEEP BUILDING YOUR RECORD</small><div class="proto-progress"><i style="width:35%"></i></div></div><div class="proto-chips"><button class="proto-chip is-selected" data-filter>ALL</button><button class="proto-chip" data-filter>TRAINING</button><button class="proto-chip" data-filter>NUTRITION</button><button class="proto-chip" data-filter>PROGRESS</button></div>`,true,true)}${module('Achievement archive',`<div class="proto-card-stack">${rows}</div>`,false,true)}`,'Progress')}
    function identity(){return shell('FITDEX // SYSTEM','LOCAL',`${header('SETTINGS','Identity','Display name & avatar.')}${module('Display name',`<form class="proto-field" onsubmit="event.preventDefault();this.querySelector('button').textContent='IDENTITY SAVED'"><div class="proto-record-card"><span class="proto-row-icon">ID</span><label class="proto-row-copy">Display name<input value="ASH" maxlength="24"></label><span class="proto-row-meta">3 / 24</span></div><button class="proto-primary">Save identity</button></form>`,true)}${module('Current champion',`<div class="proto-card-stack"><button class="proto-record-card" type="button"><img class="proto-food-icon" src="/avatars/spartans/leonidas.png" alt=""><span class="proto-row-copy"><b>Leonidas</b><small>The Leader · Spartan</small></span><span class="proto-row-meta">CHANGE</span></button></div>`)}`,'Settings')}
    function appearance(){return shell('FITDEX // SYSTEM','SYSTEM',`${header('SETTINGS','Appearance','Faction & brightness.')}${module('Faction',`<div class="proto-tabs"><button class="proto-tab is-selected" data-family="spartans">SPARTAN</button><button class="proto-tab" data-family="amazonians">AMAZONIAN</button></div>`,true)}${module('Brightness',`<div class="proto-tabs"><button class="proto-tab" data-brightness="system">SYSTEM</button><button class="proto-tab" data-brightness="light">LIGHT</button><button class="proto-tab is-selected" data-brightness="dark">DARK</button></div><small>Faction changes device visual identity. Champion stays independent.</small>`)}`,'Settings')}
    function champion(){const direction=['gallery','pedestal','roster'][championVariant];const tiles=list=>list.map(([id,name,role,tagline,art])=>{const selected=id===selectedChampion;return `<button class="proto-champion-tile ${selected?'is-selected':''}" type="button" data-avatar="${id}" aria-pressed="${selected}" aria-label="Select ${name}, ${role}">${selected?'<span class="proto-check" aria-hidden="true">✓</span>':''}<img src="${art}" alt="" aria-hidden="true"><span class="proto-champion-copy"><b>${name}</b><small>${role}</small></span></button>`}).join('');const [,name,role,tagline,art]=champions.find(([id])=>id===selectedChampion);const section=(label,list)=>{const faction=label.toLowerCase();const banner=direction==='pedestal'?`<header class="proto-faction-banner is-${faction}"><img src="/branding/fitdex-icon-${faction.slice(0,-1)}.png" alt="" aria-hidden="true"><h2 id="champion-${faction}">${label}</h2></header>`:`<header><h2 id="champion-${faction}">${label}</h2></header>`;return `<section class="proto-champion-section" aria-labelledby="champion-${faction}">${banner}<div class="proto-champion-grid">${tiles(list)}</div></section>`};return shell('FITDEX // SYSTEM','PROFILE',`${header('IDENTITY','Choose Champion','Cosmetic. Change any time.')}<div class="proto-champion-flow proto-champion-${direction}"><aside class="proto-champion-preview" aria-live="polite" aria-label="Selected champion: ${name}"><img src="${art}" alt=""><div class="proto-champion-preview-copy"><small>Selected champion</small><strong>${name}</strong><span>${role}</span></div><blockquote>“${tagline}”</blockquote></aside>${section('Spartans',champions.slice(0,3))}${section('Amazonians',champions.slice(3))}</div>`,'Settings')}
    const render={home,routine,dex:()=>dex(),favorites:()=>dex(true),consistency,meal,rank,achievements,identity,appearance,champion},stage=$('#stage')
    function mount(){stage.innerHTML=render[screen.value]();wire()}function wire(){$$('[data-dex]').forEach(x=>x.onclick=()=>{screen.value=x.dataset.dex;mount()});$$('[data-filter]').forEach(x=>x.onclick=()=>{$$('[data-filter]').forEach(y=>y.classList.remove('is-selected'));x.classList.add('is-selected')});$$('[data-meal]').forEach(x=>x.onclick=()=>{selectedMeal=x.dataset.meal;mount()});$$('[data-avatar]').forEach(x=>x.onclick=()=>{selectedChampion=x.dataset.avatar;mount()});$$('[data-family]').forEach(x=>x.onclick=()=>{document.documentElement.dataset.themeFamily=x.dataset.family;mount()});$$('[data-brightness]').forEach(x=>x.onclick=()=>{document.documentElement.dataset.brightness=x.dataset.brightness;mount()})}
    const variants=[()=>{championVariant=0;screen.value='champion';return champion()},()=>{championVariant=1;screen.value='champion';return champion()},()=>{championVariant=2;screen.value='champion';return champion()}];const picker=document.querySelector('.proto-picker');const highlight=picker.querySelector('.proto-picker-highlight');const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];let current=0;function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}function mountVariant(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();wire()})}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mountVariant(i)}items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mountVariant(current)});
    screen.onchange=mount;$('#theme').onchange=e=>{const [family,brightness]=e.target.value.split(':');document.documentElement.dataset.themeFamily=family;document.documentElement.dataset.brightness=brightness;mount()};setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||2)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')))
  </script>
</body>
