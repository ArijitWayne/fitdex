<!doctype html>
<html lang="en" data-theme-family="spartans" data-brightness="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FitDex Home Prototype Comparison</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="prototype-toolbar">
      <div>
        <span>Isolated prototype</span>
        <strong>FitDex Home</strong>
      </div>
      <div class="preview-controls" aria-label="Theme preview controls">
        <label>
          <span>Faction</span>
          <select id="family-preview" aria-label="Preview theme family">
            <option value="spartans">Spartans</option>
            <option value="amazonians">Amazonians</option>
          </select>
        </label>
        <label>
          <span>Light</span>
          <input id="brightness-preview" type="checkbox" aria-label="Use light preview" />
        </label>
      </div>
    </header>

    <main id="stage" aria-live="polite"></main>
    <div class="prototype-toast" id="prototype-toast" role="status" aria-live="polite" hidden></div>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">Daily Quest</button>
      <button class="proto-picker-item">Handheld Command</button>
      <button class="proto-picker-item">Adventurer Camp</button>
    </nav>

    <script type="module" src="./app.js"></script>
  </body>
</html>
