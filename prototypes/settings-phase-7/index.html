<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitDex Settings — Phase 7 Directions</title>
  <style>
    :root,
    html[data-family="spartans"] {
      color-scheme: dark;
      --bg: #121616;
      --app-surface: #181d1d;
      --surface: #1f2524;
      --raised: #282f2e;
      --soft: #303635;
      --line: #606a66;
      --strong: #7e8984;
      --text: #e8e8e2;
      --muted: #a7aeaa;
      --accent: #2e9895;
      --accent-strong: #14706f;
      --accent-text: #58b4af;
      --accent-soft: #213331;
      --on-accent: #101716;
      --secondary: #6e8561;
      --warm-accent: #b77f2f;
      --metal: #737d79;
      --xp: #cb9435;
      --success: #6f9565;
      --warning: #c28a47;
      --danger: #d66a66;
      --shadow: rgba(0, 0, 0, .24);
      --rpg-accent: #b77f2f;
      --display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      --body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html[data-family="amazonians"] {
      color-scheme: dark;
      --bg: #1f171e;
      --app-surface: #281c27;
      --surface: #31232f;
      --raised: #3a2937;
      --soft: #44323f;
      --line: #79616f;
      --strong: #967887;
      --text: #eee5df;
      --muted: #b2a3aa;
      --accent: #906390;
      --accent-strong: #71446f;
      --accent-text: #bd91b7;
      --accent-soft: #493246;
      --on-accent: #21151f;
      --secondary: #9a4964;
      --warm-accent: #bc7247;
      --metal: #85777e;
      --xp: #d0a03f;
      --success: #7d936d;
      --warning: #c58d4f;
      --danger: #d86f74;
      --shadow: rgba(0, 0, 0, .25);
      --rpg-accent: #bc7247;
    }
    html[data-light="true"],
    html[data-family="spartans"][data-light="true"] {
      color-scheme: light;
      --bg: #f0e6d6;
      --app-surface: #f4ebdd;
      --surface: #eae2d5;
      --raised: #f8efe2;
      --soft: #ddd9ce;
      --line: #979b92;
      --strong: #6f7771;
      --text: #2e3230;
      --muted: #656b67;
      --accent: #1f8582;
      --accent-strong: #176864;
      --accent-text: #176864;
      --accent-soft: #d1ded9;
      --on-accent: #ffffff;
      --secondary: #7b8d6a;
      --warm-accent: #b67e26;
      --metal: #7e8680;
      --xp: #bd862c;
      --success: #53794f;
      --warning: #a96626;
      --danger: #a74343;
      --shadow: rgba(47, 51, 48, .16);
      --rpg-accent: #b67e26;
    }
    html[data-family="amazonians"][data-light="true"] {
      color-scheme: light;
      --bg: #f0e4d4;
      --app-surface: #f4e9db;
      --surface: #ebe1d8;
      --raised: #f7ede0;
      --soft: #ddd0d1;
      --line: #9f898e;
      --strong: #806c73;
      --text: #352b31;
      --muted: #746a6e;
      --accent: #785178;
      --accent-strong: #654061;
      --accent-text: #654061;
      --accent-soft: #e2d3dc;
      --on-accent: #ffffff;
      --secondary: #98485f;
      --warm-accent: #b96f49;
      --metal: #85777d;
      --xp: #c99032;
      --success: #647b58;
      --warning: #ad672d;
      --danger: #a44449;
      --shadow: rgba(62, 45, 54, .16);
      --rpg-accent: #b96f49;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--body); }
    button,input,select { font:inherit; }
    button { color:inherit; }
    button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    #stage { min-height:100dvh; }
    .shell { width:min(100%,760px); min-height:100dvh; margin:auto; padding:76px 16px 108px; }
    .appbar { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .appbar button,.icon-button { display:grid; width:44px; min-width:44px; height:44px; place-items:center; border:1px solid var(--line); background:var(--surface); cursor:pointer; }
    .appbar-copy { min-width:0; }
    .appbar h1 { margin:0; font:900 clamp(1.8rem,8vw,3rem)/.95 var(--display); letter-spacing:.02em; text-transform:uppercase; }
    .eyebrow { margin:0 0 4px; color:var(--accent-text); font-size:.67rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    .muted { color:var(--muted); }
    .stack { display:grid; gap:16px; }
    .section { display:grid; gap:8px; }
    .section-title { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:0; color:var(--accent-text); font-size:.67rem; font-weight:900; letter-spacing:.13em; text-transform:uppercase; }
    .section-title small { color:var(--muted); font-size:.62rem; letter-spacing:.04em; text-transform:none; }
    .panel { border:1px solid var(--line); background:var(--surface); }
    .panel-accent { border-left:4px solid var(--accent); }
    .row { display:grid; width:100%; min-height:62px; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:10px 12px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; cursor:pointer; }
    .row:last-child { border-bottom:0; }
    .row:hover { background:var(--soft); }
    .row-copy { display:grid; min-width:0; gap:3px; }
    .row strong { font:900 .92rem/1.05 var(--display); letter-spacing:.03em; text-transform:uppercase; }
    .row small { color:var(--muted); font-size:.71rem; line-height:1.35; }
    .value { max-width:145px; color:var(--accent-text); font-size:.7rem; font-weight:850; text-align:right; overflow-wrap:anywhere; }
    .chev { margin-left:5px; }
    .seg { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
    .seg.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .seg button,.chip { min-height:44px; padding:7px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:.72rem; font-weight:850; cursor:pointer; }
    .seg button[aria-pressed="true"],.chip[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-text); box-shadow:inset 0 -3px 0 var(--accent); }
    .quick { display:grid; gap:14px; padding:15px; border-left:4px solid var(--accent); background:var(--raised); }
    .quick label,.field { display:grid; min-width:0; gap:6px; color:var(--muted); font-size:.7rem; font-weight:850; letter-spacing:.05em; text-transform:uppercase; }
    .switch { display:flex; min-height:48px; align-items:center; justify-content:space-between; gap:12px; color:var(--text); cursor:pointer; }
    .switch input { width:22px; height:22px; accent-color:var(--accent); }
    .hero { position:relative; display:grid; grid-template-columns:auto minmax(0,1fr); gap:15px; align-items:center; padding:16px; overflow:hidden; border:2px solid var(--strong); background:var(--raised); box-shadow:3px 3px 0 var(--shadow); }
    .hero:before { position:absolute; inset:0 0 auto; height:5px; background:var(--accent); content:""; }
    .avatar { width:82px; height:96px; object-fit:contain; border:2px solid var(--strong); background:var(--soft); image-rendering:pixelated; }
    .hero h2 { margin:0; font:900 clamp(1.45rem,7vw,2.4rem)/.95 var(--display); text-transform:uppercase; overflow-wrap:anywhere; }
    .hero p:last-child { margin:5px 0 0; color:var(--muted); font-size:.75rem; }
    .status-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
    .status-grid div { display:grid; gap:3px; padding:10px 8px; border:1px solid var(--line); background:var(--soft); }
    .status-grid strong { color:var(--accent-text); font:900 .9rem var(--display); text-transform:uppercase; }
    .status-grid small { color:var(--muted); font-size:.6rem; text-transform:uppercase; }
    .codex-heading { position:relative; padding:17px; border:2px solid var(--strong); background:linear-gradient(135deg,var(--raised),var(--surface)); }
    .codex-heading:after { position:absolute; right:9px; bottom:9px; width:18px; height:18px; border-right:3px solid var(--accent); border-bottom:3px solid var(--accent); content:""; }
    .codex-heading h2 { margin:0; font:900 1.55rem var(--display); text-transform:uppercase; }
    .codex-heading p:last-child { margin:5px 0 0; color:var(--muted); font-size:.78rem; }
    .detail { display:grid; gap:16px; }
    .card { display:grid; gap:14px; padding:15px; border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--raised); }
    .card h2,.card h3,.card p { margin:0; }
    .card h2,.card h3 { font-family:var(--display); text-transform:uppercase; }
    .field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .field input,.field select { width:100%; min-height:46px; padding:8px; border:2px solid var(--line); background:var(--surface); color:var(--text); text-transform:none; }
    .field.full { grid-column:1/-1; }
    .recommendation { display:grid; gap:8px; padding:12px; border-left:3px solid var(--accent); background:var(--accent-soft); }
    .recommendation strong { font:900 1.1rem var(--display); text-transform:uppercase; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .primary,.secondary,.danger { min-height:44px; padding:9px 13px; border:2px solid var(--accent); font-weight:900; cursor:pointer; }
    .primary { background:var(--accent); color:var(--on-accent); }
    .secondary { background:transparent; color:var(--accent-text); }
    .danger { border-color:var(--danger); background:transparent; color:var(--danger); }
    .wide { width:100%; }
    .notice { padding:10px 12px; border-left:3px solid var(--warning); background:color-mix(in srgb,var(--warning) 12%,transparent); font-size:.76rem; line-height:1.45; }
    .notice.error { border-color:var(--danger); color:var(--danger); }
    .notice.success { border-color:var(--success); color:var(--success); }
    .avatar-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .avatar-option { position:relative; display:grid; place-items:center; gap:6px; min-height:162px; padding:9px; border:2px solid var(--line); background:var(--surface); cursor:pointer; }
    .avatar-option[aria-pressed="true"] { border-color:var(--accent); box-shadow:2px 2px 0 var(--accent); }
    .avatar-option img { width:72px; height:88px; object-fit:contain; image-rendering:pixelated; }
    .avatar-option strong { font-family:var(--display); text-transform:uppercase; }
    .avatar-option small { color:var(--muted); }
    .radio-list { display:grid; border-block:1px solid var(--line); }
    .radio-list label { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; min-height:58px; gap:10px; border-bottom:1px solid var(--line); cursor:pointer; }
    .radio-list label:last-child { border-bottom:0; }
    .radio-list span { display:grid; gap:2px; }
    .radio-list small { color:var(--muted); }
    .radio-list input { width:20px; height:20px; accent-color:var(--accent); }
    .preview { display:grid; gap:1px; background:var(--line); }
    .preview div { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:10px; background:var(--soft); }
    .preview span { color:var(--muted); }
    .preview strong { text-align:right; overflow-wrap:anywhere; }
    .bottom-nav { position:fixed; z-index:20; bottom:0; left:50%; display:grid; width:min(100%,760px); grid-template-columns:repeat(5,1fr); padding:7px 8px calc(7px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:color-mix(in srgb,var(--surface) 94%,transparent); transform:translateX(-50%); backdrop-filter:blur(12px); }
    .bottom-nav button { display:grid; min-height:48px; place-items:center; gap:2px; border:0; background:transparent; color:var(--muted); font-size:.59rem; cursor:pointer; }
    .bottom-nav button.active { color:var(--accent-text); }
    .bottom-nav b { font-size:1rem; }
    .toast { position:fixed; z-index:40; right:14px; bottom:82px; max-width:min(340px,calc(100vw - 28px)); padding:11px 13px; border:1px solid var(--line); border-left:4px solid var(--success); background:var(--raised); box-shadow:3px 3px 0 var(--shadow); font-size:.76rem; }
    .modal-backdrop { position:fixed; z-index:50; inset:0; display:grid; align-items:end; padding-top:60px; background:rgba(0,0,0,.7); }
    .modal { display:grid; width:min(100%,660px); max-height:88dvh; gap:14px; margin:auto auto 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); overflow:auto; border:2px solid var(--strong); border-bottom:0; background:var(--raised); }
    .modal h2,.modal p { margin:0; }
    .modal h2 { font-family:var(--display); text-transform:uppercase; }
    .harness { display:grid; gap:8px; margin:0 0 14px; padding:10px; border:1px dashed var(--line); background:var(--surface); }
    .harness strong { font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; }
    .harness-controls { display:flex; flex-wrap:wrap; gap:6px; }
    .harness select,.harness input { min-height:36px; padding:5px 7px; border:1px solid var(--line); background:var(--raised); color:var(--text); font-size:.7rem; }
    .direction-note { margin:0 0 12px; color:var(--muted); font-size:.7rem; }
    .v1 .section { gap:5px; }
    .v1 .row { min-height:56px; }
    .v1 .settings-columns { display:grid; gap:16px; }
    .v2 .quick { border-left:0; border-top:4px solid var(--accent); }
    .v2 .row { padding:12px 14px; }
    .v3 .section-title { padding:7px 9px; border:1px solid var(--line); background:var(--soft); }
    .v3 .row { border-left:3px solid transparent; }
    .v3 .row:hover { border-left-color:var(--accent); }
    @media (min-width:700px) {
      .shell { padding-inline:24px; }
      .settings-columns { grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; }
      .field-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .field.full { grid-column:auto; }
      .avatar-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .modal { margin:auto; border-bottom:2px solid var(--strong); }
    }
    @media (max-width:374px) {
      .shell { padding-inline:12px; }
      .field-grid,.status-grid { grid-template-columns:1fr; }
      .avatar { width:68px; height:82px; }
      .preview div { grid-template-columns:1fr; gap:3px; }
      .preview strong { text-align:left; }
    }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight { position:absolute; top:4px; left:0; height:28px; border-radius:999px; background:rgba(255,255,255,.12); will-change:transform; }
    .proto-picker[data-ready] .proto-picker-highlight { transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1); }
    @media (prefers-reduced-motion:reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition:none; } }
    .proto-picker-item { position:relative; display:flex; align-items:center; height:28px; padding:0 12px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,.55); font:inherit; cursor:pointer; transition:color 150ms ease-out; }
    .proto-picker-item:hover { color:rgba(255,255,255,.85); }
    .proto-picker-item:active { transform:scale(.97); }
    .proto-picker-item:focus-visible { outline:2px solid rgba(255,255,255,.4); outline-offset:2px; }
    .proto-picker-item[data-active] { color:#fff; }
    .proto-picker-divider { width:1px; height:16px; margin:0 4px; background:rgba(255,255,255,.12); }
    .proto-picker-replay { padding:0 10px; font-size:14px; }
    .proto-picker[data-position="top"] { bottom:auto; top:24px; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">System</button>
    <button class="proto-picker-item">Profile</button>
    <button class="proto-picker-item">Codex</button>
  </nav>
  <script>
    const avatars = [
      ['aster','Aster','Athlete','spartans','/avatars/spartans/aster.png'],
      ['leonidas','Leonidas','Leader','spartans','/avatars/spartans/leonidas.png'],
      ['brasidas','Brasidas','Competitor','spartans','/avatars/spartans/brasidas.png'],
      ['artemis','Artemis','Explorer','amazonians','/avatars/amazonians/artemis.png'],
      ['athena','Athena','Strategist','amazonians','/avatars/amazonians/athena.png'],
      ['hippolyta','Hippolyta','Powerhouse','amazonians','/avatars/amazonians/hippolyta.png']
    ];
    const state = {
      view:'hub', family:'spartans', brightness:'system', light:false, name:'Arijit', avatar:'leonidas', units:'metric', sfx:true, bgm:'none',
      targets:{enabled:true,goal:'lose',age:'30',sex:'female',height:'165',weight:'65',activity:'moderate',calories:'1800',protein:'0',source:'calculated'},
      message:'', modal:'', width:'390'
    };
    const directions = [
      {klass:'v1', name:'System Panel', note:'Compact groups, explicit values, and Data & Offline kept separate.'},
      {klass:'v2', name:'Profile Loadout', note:'Identity and personalization lead; utilities remain one tap away.'},
      {klass:'v3', name:'RPG System Codex', note:'System-record framing with literal labels for consequential controls.'}
    ];
    let current = 0;
    const esc = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const avatar = () => avatars.find(a => a[0] === state.avatar) || avatars[1];
    const kcal = () => state.targets.enabled ? `${state.targets.calories || '—'} kcal · ${state.targets.protein || '0'} g protein` : 'Off';
    function recommendation() {
      const t=state.targets, age=+t.age, h=+t.height, w=+t.weight;
      if (!age || !h || !w) return null;
      const rmr=Math.round(10*w+6.25*h-5*age+(t.sex==='male'?5:-161));
      const factors={sedentary:1.2,light:1.375,moderate:1.55,very:1.725,extreme:1.9};
      const maintenance=Math.round(rmr*factors[t.activity]);
      const primary=t.goal==='lose'?Math.max(1000,maintenance-500):t.goal==='gain'?maintenance+250:maintenance;
      const higher=t.goal==='lose'?Math.max(1000,maintenance-750):null;
      return {rmr,maintenance,primary,higher};
    }
    const group = (title, rows, meta='') => `<section class="section"><h2 class="section-title">${title}${meta?`<small>${meta}</small>`:''}</h2><div class="panel">${rows}</div></section>`;
    const row = (view,title,desc,value) => `<button class="row" data-open="${view}"><span class="row-copy"><strong>${title}</strong><small>${desc}</small></span><span class="value">${value}<span class="chev">›</span></span></button>`;
    function harness() {
      return `<aside class="harness" aria-label="Prototype controls"><strong>Prototype harness</strong><div class="harness-controls">
        <select data-harness="theme" aria-label="Theme preview">
          <option value="spartans-dark" ${state.family==='spartans'&&!state.light?'selected':''}>Spartan · Dark</option>
          <option value="spartans-light" ${state.family==='spartans'&&state.light?'selected':''}>Spartan · Light</option>
          <option value="amazonians-dark" ${state.family==='amazonians'&&!state.light?'selected':''}>Amazonian · Dark</option>
          <option value="amazonians-light" ${state.family==='amazonians'&&state.light?'selected':''}>Amazonian · Light</option>
        </select>
        <select data-harness="width" aria-label="Preview width"><option value="320">320 px</option><option value="390" ${state.width==='390'?'selected':''}>390 px</option><option value="480" ${state.width==='480'?'selected':''}>480 px</option><option value="760" ${state.width==='760'?'selected':''}>760 px</option></select>
        <select data-harness="state" aria-label="Preview state"><option value="hub">Hub</option><option value="nutrition">Nutrition</option><option value="nutrition-invalid">Nutrition · invalid</option><option value="nutrition-zero">Nutrition · zero protein</option><option value="targets-off">Nutrition · off</option><option value="restore-preview">Restore preview</option><option value="restore-error">Restore error</option><option value="media-browser">Media · browser</option></select>
      </div></aside>`;
    }
    function quickAppearance() {
      return `<section class="quick"><header><p class="eyebrow">Appearance & feedback</p></header>
        <label>Theme family<div class="seg"><button data-set="family" data-value="spartans" aria-pressed="${state.family==='spartans'}">Spartans</button><button data-set="family" data-value="amazonians" aria-pressed="${state.family==='amazonians'}">Amazonians</button></div></label>
        <label>Brightness<div class="seg three"><button data-set="brightness" data-value="system" aria-pressed="${state.brightness==='system'}">System</button><button data-set="brightness" data-value="light" aria-pressed="${state.brightness==='light'}">Light</button><button data-set="brightness" data-value="dark" aria-pressed="${state.brightness==='dark'}">Dark</button></div></label>
        <label class="switch"><span>Sound Effects<br><small class="muted">Interface and achievement cues</small></span><input type="checkbox" data-toggle="sfx" ${state.sfx?'checked':''}></label>
      </section>`;
    }
    function hubSystem() {
      return `${quickAppearance()}<div class="settings-columns">
        <div class="stack">${group('Profile',row('profile','Display Name & Avatar','Local identity used across FitDex',`${esc(state.name)} · ${avatar()[1]}`))}${group('Preferences',row('nutrition','Nutrition Targets','Calories, protein, and calculation profile',kcal())+row('units','Units','Controls weight and distance display',state.units==='metric'?'Metric · kg / km':'Imperial · lb / mi')+row('audio','Battle Music','Background soundtrack',state.bgm==='none'?'None':state.bgm))}</div>
        <div class="stack">${group('Guides',row('gamification','Gamification Guide','How XP, streaks, and achievements work','Open')+row('tutorial','Field Guide','Replay the seven-topic product tour','Replay'))}${group('Data & Offline',row('media','Exercise Media','Manage Android offline downloads','Device only')+row('backup','Backup & Restore','Portable local .fitdex backup','Manage'))}${group('Support',row('about','About FitDex','Version, privacy, and creator','v0.5.0'))}</div>
      </div>`;
    }
    function hubProfile() {
      const a=avatar();
      return `<section class="hero"><img class="avatar" src="${a[4]}" alt="${a[1]}"><div><p class="eyebrow">Player profile</p><h2>${esc(state.name)}</h2><p>${a[1]} · ${a[2]} · local profile</p></div></section>
        <div class="status-grid"><div><small>Theme</small><strong>${state.family}</strong></div><div><small>Units</small><strong>${state.units}</strong></div><div><small>Targets</small><strong>${state.targets.enabled?'On':'Off'}</strong></div></div>
        ${group('Personalize',row('profile','Identity','Display name and six avatars',`${a[1]} ›`)+row('appearance','Appearance','Theme family and brightness',`${state.family} · ${state.brightness}`))}
        ${group('Your system',row('nutrition','Nutrition Targets','Calculation profile and daily targets',kcal())+row('units','Units','Weight and distance',state.units==='metric'?'kg / km':'lb / mi')+row('audio','Audio','Sound effects and battle music',`${state.sfx?'SFX on':'SFX off'} · ${state.bgm}`))}
        ${group('Data & help',row('backup','Backup & Restore','Export or replace local data','Local file')+row('media','Exercise Media','Android offline downloads','Device only')+row('tutorial','Field Guide','Replay the product tour','Replay')+row('gamification','Gamification Guide','XP rules and progress','Open')+row('about','About FitDex','Version and privacy','v0.5.0'))}`;
    }
    function hubCodex() {
      return `<section class="codex-heading"><p class="eyebrow">System record · FD-07</p><h2>Configuration Codex</h2><p>Local profile, targets, media, and backup controls. No account or cloud sync.</p></section>
        ${group('I · Identity',row('profile','Display Name & Avatar','Player identity record',`${esc(state.name)} · ${avatar()[1]}`))}
        ${group('II · Interface',row('appearance','Theme & Brightness','Spartan or Amazonian; system, light, or dark',`${state.family} · ${state.brightness}`)+row('units','Units','Metric or imperial presentation',state.units)+row('audio','Audio','Sound effects and battle music',`${state.sfx?'SFX on':'SFX off'} · ${state.bgm}`))}
        ${group('III · Nutrition',row('nutrition','Nutrition Targets','Daily targets and calculation inputs',kcal()),'current values')}
        ${group('IV · Knowledge',row('gamification','Gamification Guide','Literal XP and achievement rules','Open')+row('tutorial','Field Guide','Replay seven-topic guide','Replay'))}
        ${group('V · Data & Offline',row('media','Exercise Media','Android-only download storage','Device only')+row('backup','Backup & Restore','Export or replace local data','Manage'))}
        ${group('VI · Application',row('about','About FitDex','Version, privacy, and creator','v0.5.0'))}`;
    }
    function header(title) { return `<header class="appbar"><button data-back aria-label="Back">←</button><div class="appbar-copy"><p class="eyebrow">Settings</p><h1>${title}</h1></div></header>`; }
    function detailProfile() {
      if (state.view==='avatars') return `${header('Choose Avatar')}<section class="card"><p class="muted">Avatar choice is independent from theme family.</p><div class="avatar-grid">${avatars.map(a=>`<button class="avatar-option" data-avatar="${a[0]}" aria-pressed="${state.avatar===a[0]}"><img src="${a[4]}" alt=""><strong>${a[1]}</strong><small>${a[2]} · ${a[3]}</small></button>`).join('')}</div></section>`;
      return `${header('Profile')}<section class="card"><div class="hero"><img class="avatar" src="${avatar()[4]}" alt="${avatar()[1]}"><div><p class="eyebrow">Current identity</p><h2>${esc(state.name)}</h2><p>${avatar()[1]} · ${avatar()[2]}</p></div></div><label class="field">Display name<input data-name maxlength="24" value="${esc(state.name)}" aria-describedby="name-help"></label><p id="name-help" class="muted">1–24 characters · ${[...state.name].length}/24</p><div class="actions"><button class="secondary" data-save-name>Save name</button><button class="secondary" data-open="avatars">Change avatar</button></div></section>`;
    }
    function detailAppearance() { return `${header('Appearance')}${quickAppearance()}<p class="notice">Theme family changes branding. Avatar remains your independent choice. “System” brightness follows the device setting.</p>`; }
    function detailUnits() { return `${header('Units')}<section class="card"><h2>Measurement system</h2><p class="muted">Stored workout values stay canonical. This changes weight and distance display and entry.</p><div class="seg"><button data-set="units" data-value="metric" aria-pressed="${state.units==='metric'}">Metric<br><small>kg · km</small></button><button data-set="units" data-value="imperial" aria-pressed="${state.units==='imperial'}">Imperial<br><small>lb · mi</small></button></div><p class="notice">Nutrition calculation inputs remain labelled in kilograms and centimetres in today’s data model.</p></section>`; }
    function detailAudio() { return `${header('Audio')}<section class="card"><label class="switch"><span><strong>Sound Effects</strong><br><small class="muted">Selections, progress, and achievements</small></span><input type="checkbox" data-toggle="sfx" ${state.sfx?'checked':''}></label><div><p class="eyebrow">Battle Music</p><div class="radio-list">${[['warrior','Warrior','BGM 1'],['hardened','Hardened','BGM 2'],['villain','Villain','BGM 3'],['none','None','No background music']].map(x=>`<label><span><strong>${x[1]}</strong><small>${x[2]}</small></span><input type="radio" name="bgm" value="${x[0]}" ${state.bgm===x[0]?'checked':''}></label>`).join('')}</div></div></section>`; }
    function detailNutrition() {
      const t=state.targets, rec=recommendation();
      const invalid=!Number.isInteger(+t.age)||+t.age<18||+t.age>120||!(+t.height>0)||!(+t.weight>0)||!(+t.calories>0)||!(+t.protein>=0);
      return `${header('Nutrition Targets')}<section class="card">
        <label class="switch"><span><strong>Use daily targets</strong><br><small class="muted">Shows targets in Food and enables eligible target XP</small></span><input type="checkbox" data-target="enabled" ${t.enabled?'checked':''}></label>
        ${!t.enabled?'<p class="notice">Targets are off. Re-enabling begins a new eligibility boundary; prior XP remains.</p>':''}
        <div><p class="eyebrow">Goal</p><div class="seg three">${['lose','maintain','gain'].map(g=>`<button data-target="goal" data-value="${g}" aria-pressed="${t.goal===g}">${g[0].toUpperCase()+g.slice(1)}</button>`).join('')}</div></div>
        <fieldset class="field-grid" style="border:0;padding:0;margin:0"><legend class="eyebrow">Calculation profile</legend>
          <label class="field">Age<input type="number" min="18" max="120" step="1" data-target="age" value="${esc(t.age)}"></label>
          <label class="field">Sex<select data-target="sex"><option value="female" ${t.sex==='female'?'selected':''}>Female</option><option value="male" ${t.sex==='male'?'selected':''}>Male</option></select></label>
          <label class="field">Height · cm<input type="number" min="1" data-target="height" value="${esc(t.height)}"></label>
          <label class="field">Weight · kg<input type="number" min="1" data-target="weight" value="${esc(t.weight)}"></label>
          <label class="field full">Activity<select data-target="activity">${[['sedentary','Sedentary · 1.2'],['light','Light · 1.375'],['moderate','Moderate · 1.55'],['very','Very active · 1.725'],['extreme','Extreme · 1.9']].map(x=>`<option value="${x[0]}" ${t.activity===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label>
        </fieldset>
        ${rec?`<div class="recommendation"><p class="eyebrow">Recommendation</p><strong>${rec.primary} kcal / day</strong><small>Estimated maintenance ${rec.maintenance} kcal · Mifflin–St Jeor</small><div class="actions"><button class="secondary" data-recommend="${rec.primary}">Use ${rec.primary}</button>${rec.higher?`<button class="secondary" data-recommend="${rec.higher}">Higher deficit · ${rec.higher}</button>`:''}</div></div>`:'<p class="notice">Complete age, height, and weight to calculate a recommendation.</p>'}
        <fieldset class="field-grid" style="border:0;padding:0;margin:0"><legend class="eyebrow">Daily targets</legend>
          <label class="field">Calories · kcal<input type="number" min="1" step="1" data-target="calories" value="${esc(t.calories)}"><small>${t.source==='manual'?'Manual':'Calculated'}</small></label>
          <label class="field">Protein · grams<input type="number" min="0" step="1" data-target="protein" value="${esc(t.protein)}"><small>${+t.protein>0?'Eligible when logged ≥ target':'0 means target unavailable and no protein XP'}</small></label>
        </fieldset>
        ${invalid?'<p class="notice error" role="alert">Check inputs: age 18–120; height, weight, and calories above 0; protein 0 or above.</p>':''}
        <p class="notice">Safety rule: intake below 1,000 kcal never earns calorie-target XP. Current production validation still permits a lower manual target; that needs a product decision.</p>
        <button class="primary wide" data-save-targets ${invalid?'disabled':''}>Save nutrition targets</button>
      </section>`;
    }
    function detailBackup() { return `${header('Backup & Restore')}<section class="card"><div><p class="eyebrow">Create backup</p><h2>Download local data</h2><p class="muted">Includes workouts, food logs, routines, progress, settings, and gamification. Exercise videos and built-in assets are excluded.</p></div><button class="secondary" data-backup-create>Create .fitdex backup</button></section><section class="card"><div><p class="eyebrow">Restore backup</p><h2>Replace local data</h2><p class="muted">Validates a .fitdex file before showing a summary. Restore replaces current user-owned data.</p></div><button class="secondary" data-restore-preview>Choose demo .fitdex file</button><p class="notice">Portable local file only. No cloud sync, account, automatic backup, or encryption.</p></section>`; }
    function detailMedia() { return `${header('Exercise Media')}<section class="card"><h2>Offline exercise media</h2><p class="muted">Downloads are available in the Android app. Browser builds do not manage device media.</p><div class="preview"><div><span>Downloaded videos</span><strong>12</strong></div><div><span>Storage used</span><strong>184 MB</strong></div></div><div class="actions"><button class="secondary" data-toast="Download manager opened">Manage downloads</button><button class="danger" data-modal="remove-media">Remove all downloads</button></div><p class="notice">Exercise media is excluded from .fitdex backups.</p></section>`; }
    function detailAbout() { return `${header('About FitDex')}<section class="card"><h2>FitDex</h2><div class="preview"><div><span>Version</span><strong>0.5.0</strong></div><div><span>Creator</span><strong>Arijit Bhaduri</strong></div><div><span>Storage</span><strong>Local-first</strong></div></div><p>Your fitness data stays on this device unless you explicitly export a backup file.</p></section>`; }
    function simpleGuide(kind) { const game=kind==='gamification'; return `${header(game?'Gamification Guide':'Field Guide')}<section class="card"><p class="eyebrow">${game?'Progress rules':'Seven-topic tour'}</p><h2>${game?'XP, streaks & achievements':'Learn FitDex again'}</h2><p class="muted">${game?'Target XP is idempotent. Already-awarded XP is not revoked when nutrition data or targets change.':'Replay the existing product tutorial without changing onboarding state.'}</p><button class="primary" data-toast="${game?'Guide opened':'Field Guide replay started'}">${game?'Open guide':'Replay Field Guide'}</button></section>`; }
    function content() {
      if (state.view==='profile'||state.view==='avatars') return detailProfile();
      if (state.view==='appearance') return detailAppearance();
      if (state.view==='units') return detailUnits();
      if (state.view==='audio') return detailAudio();
      if (state.view==='nutrition') return detailNutrition();
      if (state.view==='backup') return detailBackup();
      if (state.view==='media') return detailMedia();
      if (state.view==='about') return detailAbout();
      if (state.view==='gamification'||state.view==='tutorial') return simpleGuide(state.view);
      return current===0?hubSystem():current===1?hubProfile():hubCodex();
    }
    function modal() {
      if (!state.modal) return '';
      if (state.modal==='restore-preview'||state.modal==='restore-error') return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><p class="eyebrow">Validated local file</p><h2 id="modal-title" tabindex="-1">Restore Preview</h2>${state.modal==='restore-error'?'<p class="notice error">Restore failed — your current data was not changed.</p>':''}<div class="preview"><div><span>File</span><strong>fitdex-backup-2026-09-18.fitdex</strong></div><div><span>Created</span><strong>18 Sep 2026</strong></div><div><span>Format / schema</span><strong>1 / 7</strong></div><div><span>Workouts</span><strong>84</strong></div><div><span>Food logs</span><strong>326</strong></div><div><span>Settings</span><strong>1</strong></div></div><p>This replaces current user-owned data. Built-in exercises remain.</p><div class="actions"><button class="secondary" data-toast="Current data backup download started">Back Up Current Data First</button><button class="danger" data-modal="restore-confirm">Continue to restore</button><button class="secondary" data-modal="">Cancel</button></div></section></div>`;
      if (state.modal==='restore-confirm') return `<div class="modal-backdrop"><section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title"><p class="eyebrow">Final confirmation</p><h2 id="modal-title" tabindex="-1">Replace current data?</h2><p>This action replaces local workouts, food logs, routines, progress, settings, and gamification data.</p><div class="actions"><button class="danger" data-restore-complete>Restore and replace</button><button class="secondary" data-modal="">Cancel</button></div></section></div>`;
      if (state.modal==='remove-media') return `<div class="modal-backdrop"><section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title" tabindex="-1">Remove all downloads?</h2><p>Built-in exercise data stays available. Downloaded videos will need to be downloaded again.</p><div class="actions"><button class="danger" data-toast="All exercise media downloads removed">Remove downloads</button><button class="secondary" data-modal="">Cancel</button></div></section></div>`;
      return '';
    }
    function render() {
      document.documentElement.dataset.family=state.family;
      document.documentElement.dataset.light=String(state.light);
      stage.style.maxWidth=state.width==='760'?'none':state.width+'px'; stage.style.margin='auto';
      const d=directions[current];
      stage.innerHTML=`<div class="shell ${d.klass}">${harness()}${state.view==='hub'?`<header class="appbar"><div class="appbar-copy"><p class="eyebrow">Settings · Direction ${current+1}</p><h1>${d.name}</h1></div></header><p class="direction-note">${d.note}</p>`:''}<div class="stack">${content()}</div></div><nav class="bottom-nav" aria-label="Primary"><button><b>⌂</b>Home</button><button><b>⚔</b>Workout</button><button><b>◫</b>Food</button><button><b>↗</b>Progress</button><button class="active"><b>⚙</b>Settings</button></nav>${state.message?`<div class="toast" role="status">${esc(state.message)}</div>`:''}${modal()}`;
      bind();
      if (state.modal) requestAnimationFrame(()=>stage.querySelector('#modal-title')?.focus());
    }
    function toast(message) { state.message=message; render(); setTimeout(()=>{ if(state.message===message){state.message='';render();}},2200); }
    function bind() {
      stage.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{state.view=el.dataset.open;render();});
      stage.querySelectorAll('[data-back]').forEach(el=>el.onclick=()=>{state.view=state.view==='avatars'?'profile':'hub';render();});
      stage.querySelectorAll('[data-set]').forEach(el=>el.onclick=()=>{state[el.dataset.set]=el.dataset.value;if(el.dataset.set==='brightness')state.light=el.dataset.value==='light';render();});
      stage.querySelectorAll('[data-toggle="sfx"]').forEach(el=>el.onchange=()=>{state.sfx=el.checked;render();});
      stage.querySelectorAll('input[name="bgm"]').forEach(el=>el.onchange=()=>{state.bgm=el.value;render();});
      stage.querySelectorAll('[data-avatar]').forEach(el=>el.onclick=()=>{state.avatar=el.dataset.avatar;render();});
      const nameInput=stage.querySelector('[data-name]'); if(nameInput) nameInput.oninput=()=>{state.name=[...nameInput.value].slice(0,24).join('');};
      stage.querySelector('[data-save-name]')?.addEventListener('click',()=>{state.name=state.name.trim();if(!state.name)return toast('Display name must be 1–24 characters');toast('Display name saved');});
      stage.querySelectorAll('[data-target]').forEach(el=>{const key=el.dataset.target;const handler=()=>{if(key==='enabled')state.targets[key]=el.checked;else {state.targets[key]=el.dataset.value??el.value;if(key==='calories')state.targets.source='manual';}render();};el.addEventListener(el.tagName==='BUTTON'?'click':'change',handler);});
      stage.querySelectorAll('[data-recommend]').forEach(el=>el.onclick=()=>{state.targets.calories=el.dataset.recommend;state.targets.source='calculated';render();});
      stage.querySelector('[data-save-targets]')?.addEventListener('click',()=>toast('Nutrition targets saved. Food updates live.'));
      stage.querySelector('[data-backup-create]')?.addEventListener('click',()=>toast('Backup download started. Your FitDex data was not changed.'));
      stage.querySelector('[data-restore-preview]')?.addEventListener('click',()=>{state.modal='restore-preview';render();});
      stage.querySelectorAll('[data-modal]').forEach(el=>el.onclick=()=>{state.modal=el.dataset.modal;render();});
      stage.querySelector('[data-restore-complete]')?.addEventListener('click',()=>{state.modal='';toast('Restore complete. Reload required.');});
      stage.querySelectorAll('[data-toast]').forEach(el=>el.onclick=()=>{state.modal='';toast(el.dataset.toast);});
      stage.querySelector('[data-harness="theme"]')?.addEventListener('change',e=>{const [family,tone]=e.target.value.split('-');state.family=family;state.light=tone==='light';state.brightness=tone;render();});
      stage.querySelector('[data-harness="width"]')?.addEventListener('change',e=>{state.width=e.target.value;render();moveHighlight();});
      stage.querySelector('[data-harness="state"]')?.addEventListener('change',e=>{const value=e.target.value;state.modal='';state.view=value.startsWith('nutrition')||value==='targets-off'?'nutrition':value==='media-browser'?'media':'hub';if(value==='nutrition-invalid')state.targets.calories='';if(value==='nutrition-zero')state.targets.protein='0';if(value==='targets-off')state.targets.enabled=false;if(value==='restore-preview')state.modal='restore-preview';if(value==='restore-error')state.modal='restore-error';render();});
    }
    const stage=document.getElementById('stage');
    const picker=document.querySelector('.proto-picker');
    const highlight=picker.querySelector('.proto-picker-highlight');
    const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay=picker.querySelector('.proto-picker-replay');
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>render());}
    function setActive(i){if(i<0||i>=directions.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);state.view='hub';state.modal='';mount(i);}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
    replay?.addEventListener('click',()=>mount(current));
    window.addEventListener('resize',moveHighlight);
    document.addEventListener('keydown',e=>{
      if (state.modal && e.key==='Escape') { state.modal=''; render(); return; }
      if (state.modal && e.key==='Tab') {
        const focusable=[...stage.querySelectorAll('.modal button:not([disabled]),.modal input:not([disabled]),.modal select:not([disabled])')];
        if (!focusable.length) return;
        const first=focusable[0],last=focusable[focusable.length-1];
        if (e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
        return;
      }
      if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
      if(e.metaKey||e.ctrlKey||e.altKey)return;
      const num=parseInt(e.key,10);
      if(num>=1&&num<=directions.length)setActive(num-1);
      else if(e.key==='ArrowRight')setActive((current+1)%directions.length);
      else if(e.key==='ArrowLeft')setActive((current-1+directions.length)%directions.length);
      else if(e.key==='r'||e.key==='R')mount(current);
    });
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
    requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
