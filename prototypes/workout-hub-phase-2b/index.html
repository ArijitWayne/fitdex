<!doctype html>
<html lang="en" data-theme-family="spartans" data-brightness="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>FitDex Phase 2B — Workout Hub Prototype</title>
  <style>
    :root {
      --font-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-display: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --mobile-max-width: 480px;
      --screen-pad: clamp(8px, 2.5cqi, 12px);
      --section-gap: clamp(10px, 3cqi, 14px);
      --bg: #f0e6d6;
      --app: #f4ebdd;
      --surface: #eae2d5;
      --surface-raised: #f8efe2;
      --surface-subtle: #ddd9ce;
      --border: #979b92;
      --border-strong: #6f7771;
      --border-rpg: #535a54;
      --text: #2e3230;
      --text-muted: #656b67;
      --primary: #1f8582;
      --primary-text: #176864;
      --primary-muted: #d1ded9;
      --primary-highlight: rgba(31, 133, 130, 0.18);
      --warm: #b67e26;
      --danger: #a74343;
      --success: #2d8a57;
      --success-muted: rgba(45, 138, 87, 0.12);
      --shadow: rgba(47, 51, 48, 0.16);
      color: var(--text);
      background: var(--bg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    :root[data-theme-family="spartans"][data-brightness="dark"] {
      --bg: #121616;
      --app: #181d1d;
      --surface: #1f2524;
      --surface-raised: #282f2e;
      --surface-subtle: #303635;
      --border: #606a66;
      --border-strong: #7e8984;
      --border-rpg: #161c1b;
      --text: #e8e8e2;
      --text-muted: #a7aeaa;
      --primary: #2e9895;
      --primary-text: #58b4af;
      --primary-muted: #213331;
      --primary-highlight: rgba(46, 152, 149, 0.22);
      --warm: #d09a49;
      --danger: #d66a66;
      --success: #3db874;
      --success-muted: rgba(61, 184, 116, 0.13);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    :root[data-theme-family="amazonians"][data-brightness="light"] {
      --bg: #f0e4d4;
      --app: #f4e9db;
      --surface: #ebe1d8;
      --surface-raised: #f7ede0;
      --surface-subtle: #ddd0d1;
      --border: #9f898e;
      --border-strong: #806c73;
      --border-rpg: #57464b;
      --text: #352b31;
      --text-muted: #746a6e;
      --primary: #785178;
      --primary-text: #654061;
      --primary-muted: #e2d3dc;
      --primary-highlight: rgba(120, 81, 120, 0.18);
      --warm: #b96f49;
      --danger: #a44449;
      --success: #2d8a57;
      --success-muted: rgba(45, 138, 87, 0.12);
      --shadow: rgba(62, 45, 54, 0.16);
    }

    :root[data-theme-family="amazonians"][data-brightness="dark"] {
      --bg: #1f171e;
      --app: #281c27;
      --surface: #31232f;
      --surface-raised: #3a2937;
      --surface-subtle: #44323f;
      --border: #79616f;
      --border-strong: #967887;
      --border-rpg: #1a1219;
      --text: #eee5df;
      --text-muted: #b2a3aa;
      --primary: #906390;
      --primary-text: #bd91b7;
      --primary-muted: #493246;
      --primary-highlight: rgba(144, 99, 144, 0.22);
      --warm: #d18459;
      --danger: #d86f74;
      --success: #3db874;
      --success-muted: rgba(61, 184, 116, 0.13);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; min-height: 100dvh; background: var(--bg); color: var(--text); }
    button, select { font: inherit; color: inherit; }
    button { touch-action: manipulation; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .harness {
      min-height: 100dvh;
      padding: 68px 8px 96px;
    }
    .harness-controls {
      display: flex;
      width: min(100%, 760px);
      margin: 0 auto 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-muted);
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .harness-controls label { display: inline-flex; align-items: center; gap: 5px; }
    .harness-controls select {
      min-height: 36px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--surface-raised);
      cursor: pointer;
    }
    #stage { display: flex; justify-content: center; min-width: 0; }
    .preview-viewport {
      width: min(100%, var(--preview-width, 100%));
      max-width: var(--mobile-max-width);
      min-width: 0;
      margin-inline: auto;
      border: 1px solid var(--border-strong);
      background: var(--app);
      box-shadow: 0 12px 36px var(--shadow), 3px 3px 0 var(--border-rpg);
      container: hub-preview / inline-size;
    }
    .hub-shell { min-width: 0; background: var(--app); }
    .app-rail {
      display: flex;
      min-width: 0;
      min-height: calc(48px + env(safe-area-inset-top));
      align-items: center;
      gap: 8px;
      padding: calc(7px + env(safe-area-inset-top)) var(--screen-pad) 7px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-raised);
    }
    .brand-mark {
      display: grid;
      width: 31px;
      min-width: 31px;
      height: 31px;
      place-items: center;
      border: 2px solid var(--primary);
      background: var(--primary-muted);
      color: var(--primary-text);
      font-family: var(--font-display);
      font-size: .75rem;
      font-weight: 900;
    }
    .brand-copy { min-width: 0; line-height: 1; }
    .brand-copy strong { display: block; font-family: var(--font-display); font-size: .87rem; letter-spacing: .08em; }
    .brand-copy small { color: var(--text-muted); font-family: var(--font-mono); font-size: .55rem; text-transform: uppercase; }
    .profile-chip {
      display: inline-flex;
      min-width: 0;
      min-height: 34px;
      margin-left: auto;
      align-items: center;
      gap: 6px;
      padding: 4px 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: .62rem;
      font-weight: 800;
    }
    .profile-orb { width: 18px; height: 18px; border: 1px solid var(--primary); background: var(--primary-highlight); }

    .hub-header {
      display: flex;
      min-width: 0;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      padding: clamp(12px, 3.5cqi, 17px) var(--screen-pad) 10px;
    }
    .eyebrow {
      margin: 0 0 3px;
      color: var(--primary-text);
      font-family: var(--font-mono);
      font-size: .61rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .hub-header h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 6cqi, 1.7rem);
      line-height: .98;
      letter-spacing: .025em;
      text-transform: uppercase;
    }
    .header-date { flex: 0 0 auto; color: var(--text-muted); font-family: var(--font-mono); font-size: clamp(.58rem, 2.2cqi, .66rem); font-weight: 800; text-align: right; text-transform: uppercase; }
    .hub-content { display: grid; min-width: 0; gap: var(--section-gap); padding: 0 var(--screen-pad) clamp(16px, 5cqi, 24px); }

    .panel {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--surface-raised);
      box-shadow: 2px 2px 0 var(--border-rpg);
    }
    .section-head { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .section-title { margin: 0; font-family: var(--font-display); font-size: .92rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; }
    .text-action {
      min-width: 44px;
      min-height: 40px;
      padding: 4px 2px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: .65rem;
      font-weight: 850;
      text-decoration: underline;
      text-transform: uppercase;
      cursor: pointer;
    }
    .primary-button, .secondary-button, .row-action {
      display: inline-flex;
      min-width: 0;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px clamp(9px, 3cqi, 14px);
      border-radius: 2px;
      font-size: clamp(.66rem, 2.6cqi, .76rem);
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 140ms cubic-bezier(.23, 1, .32, 1), border-color 140ms ease, color 140ms ease, background-color 140ms ease;
    }
    .primary-button { border: 2px solid var(--primary); background: var(--primary); color: #fff; box-shadow: 2px 2px 0 var(--border-rpg); }
    .secondary-button, .row-action { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
    .primary-button:active, .secondary-button:active, .row-action:active, .icon-button:active, .nav-item:active { transform: scale(.97); }
    .button-wide { width: 100%; }

    .today-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 2px solid var(--primary);
      background: var(--surface-raised);
      box-shadow: 3px 3px 0 var(--border-rpg);
    }
    .today-card::before { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--primary); content: ''; }
    .today-card.is-active::before { background: var(--success); }
    .today-card.is-paused::before { background: var(--warm); }
    .today-inner { display: grid; min-width: 0; gap: clamp(8px, 2.5cqi, 12px); padding: clamp(11px, 3.4cqi, 16px); }
    .today-core, .today-side { display: grid; min-width: 0; align-content: start; gap: 7px; }
    .today-top { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 8px; }
    .mission-label { min-width: 0; color: var(--primary-text); font-family: var(--font-mono); font-size: .62rem; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
    .state-badge {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border: 1px solid var(--primary);
      border-radius: 2px;
      background: var(--primary-muted);
      color: var(--primary-text);
      font-family: var(--font-mono);
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .state-badge.active { border-color: var(--success); background: var(--success-muted); color: var(--success); }
    .state-badge.paused { border-color: var(--warm); background: color-mix(in srgb, var(--warm) 13%, var(--surface)); color: var(--warm); }
    .state-dot { display: block; width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: currentColor; }
    .state-badge.active .state-dot { animation: statusPulse 1.4s ease-in-out infinite; }
    @keyframes statusPulse { 50% { opacity: .35; transform: scale(.82); } }
    .today-title { min-width: 0; margin: 0; overflow-wrap: anywhere; font-family: var(--font-display); font-size: clamp(1.22rem, 5.5cqi, 1.56rem); font-weight: 900; line-height: 1.04; letter-spacing: .025em; text-transform: uppercase; }
    .today-copy { margin: -3px 0 0; color: var(--text-muted); font-size: clamp(.7rem, 2.8cqi, .8rem); line-height: 1.4; }
    .today-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); background: var(--border); gap: 1px; }
    .today-stat { min-width: 0; padding: 7px clamp(5px, 2cqi, 8px); background: var(--surface-subtle); }
    .today-stat span { display: block; overflow: hidden; color: var(--text-muted); font-size: .54rem; font-weight: 850; letter-spacing: .05em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .today-stat strong { display: block; margin-top: 2px; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: clamp(.66rem, 2.8cqi, .78rem); }
    .today-actions { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(6px, 2cqi, 9px); }
    .today-actions.single { grid-template-columns: 1fr; }

    .hub-section { min-width: 0; padding: clamp(10px, 3cqi, 14px); }
    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(48px, 1fr)); gap: 4px; }
    .day-chip {
      display: grid;
      min-width: 0;
      min-height: 56px;
      align-content: center;
      gap: 3px;
      padding: 5px 3px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
    }
    .day-chip strong { font-family: var(--font-mono); font-size: .56rem; letter-spacing: .05em; }
    .day-chip span { overflow: hidden; color: var(--text-muted); font-size: .58rem; font-weight: 850; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .day-chip.is-today { border: 2px solid var(--primary); background: var(--primary-muted); color: var(--primary-text); }
    .day-chip.is-done { border-color: var(--success); background: var(--success-muted); }
    .day-chip.is-done span { color: var(--success); }
    .day-chip.is-rest { opacity: .72; }

    .routine-list, .recent-list { display: grid; min-width: 0; }
    .routine-row, .recent-row {
      display: grid;
      width: 100%;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      padding: 7px 0;
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .routine-row:first-child, .recent-row:first-child { border-top: 0; }
    .row-copy { min-width: 0; }
    .row-copy strong { display: block; overflow: hidden; font-family: var(--font-display); font-size: .82rem; letter-spacing: .025em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .row-copy small { display: block; margin-top: 3px; overflow: hidden; color: var(--text-muted); font-size: .64rem; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .row-arrow { color: var(--primary-text); font-size: 1rem; font-weight: 900; }
    .row-action { min-height: 40px; padding-inline: 8px; font-size: .61rem; }

    .dex-gateway {
      display: grid;
      min-width: 0;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(8px, 2.5cqi, 12px);
      padding: clamp(10px, 3cqi, 14px);
      border: 1px solid var(--primary);
      background: color-mix(in srgb, var(--primary-muted) 60%, var(--surface-raised));
    }
    .dex-icon { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--primary); background: var(--surface); color: var(--primary-text); font-size: 1.05rem; }
    .dex-icon svg { width: 20px; height: 20px; display: block; }
    .dex-copy { min-width: 0; }
    .dex-copy strong { display: block; font-family: var(--font-display); font-size: .9rem; letter-spacing: .04em; text-transform: uppercase; }
    .dex-copy small { display: block; margin-top: 2px; overflow-wrap: anywhere; color: var(--text-muted); font-size: .62rem; line-height: 1.3; }
    .icon-button { display: grid; width: 42px; min-width: 42px; height: 42px; place-items: center; border: 1px solid var(--border-strong); background: var(--surface); color: var(--primary-text); cursor: pointer; transition: transform 140ms cubic-bezier(.23, 1, .32, 1); }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      min-width: 0;
      min-height: calc(64px + env(safe-area-inset-bottom));
      padding: 2px max(4px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px, env(safe-area-inset-left));
      border-top: 1px solid var(--border-strong);
      background: color-mix(in srgb, var(--app) 96%, transparent);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .nav-item {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 60px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      padding: 7px 2px 4px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: .61rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 140ms cubic-bezier(.23, 1, .32, 1), color 140ms ease;
    }
    .nav-icon { display: grid; place-items: center; line-height: 1; }
    .nav-icon svg { display: block; width: 22px; height: 22px; }
    .nav-item.is-active { color: var(--primary-text); }
    .nav-item.is-active::before { position: absolute; top: 1px; left: 50%; width: 24px; height: 3px; background: var(--primary); content: ''; transform: translateX(-50%); }

    /* Variant 1: dominant linear mission stack. */
    .variant-mission .hub-content { gap: var(--section-gap); }
    .variant-mission .weekly-panel { border-top: 3px solid var(--primary); }

    /* Variant 2: dense command modules with a tactical readout. */
    .variant-command .hub-header { align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
    .variant-command .hub-content { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-top: var(--screen-pad); }
    .variant-command .today-card, .variant-command .weekly-panel, .variant-command .recent-panel { grid-column: 1 / -1; }
    .variant-command .today-inner { grid-template-columns: minmax(0, 1fr) minmax(132px, .72fr); align-items: stretch; }
    .variant-command .today-core { display: grid; min-width: 0; align-content: start; gap: 7px; }
    .variant-command .today-side { display: grid; align-content: stretch; gap: 7px; }
    .variant-command .today-stats { grid-template-columns: 1fr; }
    .variant-command .today-actions { grid-template-columns: 1fr; }
    .variant-command .hub-section { height: 100%; }
    .variant-command .routine-row { grid-template-columns: minmax(0, 1fr); }
    .variant-command .row-action { width: 100%; }
    .variant-command .dex-gateway { grid-template-columns: minmax(0, 1fr); align-content: start; }
    .variant-command .dex-icon { width: 34px; height: 34px; }
    .variant-command .dex-icon svg { width: 18px; height: 18px; }
    .variant-command .dex-gateway .row-action { width: 100%; }

    /* Variant 3: chronological field log and route-led week. */
    .variant-field .hub-header { padding-bottom: 7px; }
    .variant-field .today-card { border-color: var(--border-strong); }
    .variant-field .today-card::before { width: 7px; }
    .field-week { display: grid; min-width: 0; gap: 0; }
    .field-day {
      position: relative;
      display: grid;
      min-width: 0;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 5px 0 5px 14px;
      border-bottom: 1px solid var(--border);
    }
    .field-day:last-child { border-bottom: 0; }
    .field-day::before { position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--border); content: ''; }
    .field-day::after { position: absolute; top: 50%; left: 1px; width: 7px; height: 7px; border: 1px solid var(--border-strong); background: var(--surface-raised); content: ''; transform: translateY(-50%); }
    .field-day.is-today { color: var(--primary-text); }
    .field-day.is-today::after { border-color: var(--primary); background: var(--primary); }
    .field-day.is-done::after { border-color: var(--success); background: var(--success); }
    .field-day strong { font-family: var(--font-mono); font-size: .59rem; }
    .field-day span { min-width: 0; overflow: hidden; font-size: .68rem; font-weight: 800; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .field-day small { color: var(--text-muted); font-size: .57rem; font-weight: 800; text-transform: uppercase; }
    .field-command-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: var(--section-gap); }
    .field-command-row > * { min-width: 0; }
    .field-queue { counter-reset: routines; }
    .field-queue .routine-row { grid-template-columns: 24px minmax(0, 1fr) auto; }
    .queue-number { display: grid; width: 22px; height: 22px; place-items: center; border: 1px solid var(--border); color: var(--primary-text); font-family: var(--font-mono); font-size: .58rem; font-weight: 900; }

    .quick-sheet-backdrop {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: none;
      place-items: end center;
      padding: 16px 8px calc(16px + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, .58);
    }
    .quick-sheet-backdrop.is-open { display: grid; }
    .quick-sheet {
      width: min(100%, 440px);
      padding: 14px;
      border: 2px solid var(--border-strong);
      background: var(--surface-raised);
      box-shadow: 3px 3px 0 var(--border-rpg);
      transform-origin: bottom center;
      animation: sheetIn 180ms cubic-bezier(.23, 1, .32, 1);
    }
    @keyframes sheetIn { from { opacity: 0; transform: translateY(12px) scale(.98); } }
    .quick-sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .quick-sheet h2 { margin: 0; font-family: var(--font-display); font-size: 1.08rem; text-transform: uppercase; }
    .quick-options { display: grid; gap: 6px; }
    .quick-option { display: grid; width: 100%; min-height: 52px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); background: var(--surface); text-align: left; cursor: pointer; }
    .quick-option strong, .quick-option small { display: block; }
    .quick-option strong { font-size: .76rem; text-transform: uppercase; }
    .quick-option small { margin-top: 2px; color: var(--text-muted); font-size: .63rem; }
    .sheet-section-label {
      margin: 8px 0 2px;
      font-family: var(--font-mono);
      font-size: .59rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .sheet-section-label:first-child { margin-top: 0; }
    .sheet-section-label.is-danger { color: var(--danger); margin-top: 10px; }
    .quick-option.is-destructive { border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
    .quick-option.is-destructive:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }
    .text-danger { color: var(--danger); }

    .proto-toast {
      position: fixed;
      z-index: 1200;
      right: 12px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      max-width: min(280px, calc(100% - 24px));
      padding: 9px 11px;
      border: 1px solid var(--primary);
      background: var(--surface-raised);
      box-shadow: 2px 2px 0 var(--border-rpg);
      color: var(--text);
      font-size: .7rem;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms cubic-bezier(.23, 1, .32, 1), transform 160ms cubic-bezier(.23, 1, .32, 1);
    }
    .proto-toast.is-visible { opacity: 1; transform: translateY(0); }

    @container hub-preview (max-width: 380px) {
      .variant-command .hub-content { grid-template-columns: 1fr; }
      .variant-command .today-card, .variant-command .weekly-panel, .variant-command .recent-panel { grid-column: auto; }
      .variant-command .today-inner { grid-template-columns: 1fr; }
      .variant-command .today-side { grid-template-columns: 1fr; }
      .variant-command .today-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .variant-command .dex-gateway { grid-template-columns: auto minmax(0, 1fr) auto; }
      .variant-command .dex-gateway .row-action { width: auto; }
      .field-command-row { grid-template-columns: 1fr; }
    }

    @container hub-preview (max-width: 350px) {
      .app-rail { gap: 6px; }
      .hub-header { gap: 6px; }
      .header-date { font-size: .55rem; }
      .today-inner, .hub-section, .dex-gateway { padding: 10px; }
      .today-actions { grid-template-columns: 1fr; }
      .today-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .day-chip { min-height: 52px; }
      .row-copy small { white-space: normal; }
      .dex-gateway { grid-template-columns: 34px minmax(0, 1fr) 42px; gap: 7px; }
      .dex-gateway .dex-icon svg { width: 18px; height: 18px; }
      .field-day { grid-template-columns: 34px minmax(0, 1fr); }
      .field-day small { grid-column: 2; }
    }

    @media (hover: hover) and (pointer: fine) {
      .primary-button:hover { filter: brightness(1.08); }
      .secondary-button:hover, .row-action:hover, .icon-button:hover { border-color: var(--primary); color: var(--primary-text); }
      .routine-row:hover, .recent-row:hover { color: var(--primary-text); }
      .nav-item:hover { color: var(--text); }
    }

    @media (prefers-reduced-motion: reduce) {
      .state-badge.active .state-dot { animation: none; }
      .quick-sheet { animation: none; }
      .primary-button, .secondary-button, .row-action, .icon-button, .nav-item, .proto-toast { transition-duration: 0s; }
    }

    /* Picker spec: copied verbatim from prototype skill. */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body>
  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Mission</button>
    <button class="proto-picker-item">Command</button>
    <button class="proto-picker-item">Field Log</button>
  </nav>

  <main class="harness">
    <div class="harness-controls" aria-label="Prototype controls">
      <label>Width
        <select id="widthControl">
          <option value="100%">Fluid</option>
          <option value="320px">320</option>
          <option value="340px">340</option>
          <option value="360px">360</option>
          <option value="375px">375</option>
          <option value="390px">390</option>
          <option value="412px">412</option>
          <option value="430px">430</option>
          <option value="480px">480</option>
        </select>
      </label>
      <label>State
        <select id="stateControl">
          <option value="planned">A · Planned today</option>
          <option value="active">B · Active</option>
          <option value="paused">C · Paused</option>
          <option value="empty">D · No plan</option>
        </select>
      </label>
      <label>Theme
        <select id="themeControl">
          <option value="spartans:dark">Spartan Dark</option>
          <option value="spartans:light">Spartan Light</option>
          <option value="amazonians:dark">Amazonian Dark</option>
          <option value="amazonians:light">Amazonian Light</option>
        </select>
      </label>
    </div>
    <div id="stage"></div>
  </main>

  <div class="quick-sheet-backdrop" id="quickSheet" role="presentation">
    <section class="quick-sheet" role="dialog" aria-modal="true" aria-labelledby="quickSheetTitle">
      <div class="quick-sheet-head">
        <div><p class="eyebrow">Quick launch</p><h2 id="quickSheetTitle">Start Workout</h2></div>
        <button class="icon-button" type="button" data-action="close-sheet" aria-label="Close quick start">×</button>
      </div>
      <div class="quick-options">
        <button class="quick-option" type="button" data-action="start-today"><span><strong>Today's Plan</strong><small>Upper Body Push &amp; Pull · 6 exercises</small></span><b>›</b></button>
        <button class="quick-option" type="button" data-action="choose-routine"><span><strong>Choose Routine</strong><small>Start from one of 4 saved routines</small></span><b>›</b></button>
        <button class="quick-option" type="button" data-action="start-open"><span><strong>Open Workout</strong><small>Build session as you train</small></span><b>›</b></button>
      </div>
    </section>
  </div>
  <div class="proto-toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const week = [
      ['MON', 'PUSH', 'done'], ['TUE', 'PULL', 'done'], ['WED', 'REST', 'rest'],
      ['THU', 'UPPER', 'today'], ['FRI', 'LEGS', ''], ['SAT', 'REST', 'rest'], ['SUN', 'OPEN', '']
    ];
    const routines = [
      ['Upper Body Power', '6 exercises · Chest / Back / Arms'],
      ['Legs & Core', '7 exercises · Quads / Glutes / Core'],
      ['Long Routine Name Built to Test Narrow Phone Safety', '9 exercises · Full Body / Conditioning']
    ];
    const recents = [
      ['Upper Body Push & Pull', 'Yesterday · 47 min · 18 sets'],
      ['Legs & Core', 'Monday · 52 min · 21 sets']
    ];
    let appState = 'planned';
    let current = 0;
    let toastTimer;

    function statusBadge(type) {
      if (type === 'active') return '<span class="state-badge active"><i class="state-dot"></i> Active</span>';
      if (type === 'paused') return '<span class="state-badge paused"><i class="state-dot"></i> Paused</span>';
      return '<span class="state-badge">Thu · Planned</span>';
    }

    function todayCard(extraClass = '') {
      if (appState === 'active' || appState === 'paused') {
        const paused = appState === 'paused';
        return `<section class="today-card ${paused ? 'is-paused' : 'is-active'} ${extraClass}">
          <div class="today-inner">
            <div class="today-core">
              <div class="today-top"><span class="mission-label">Workout in progress</span>${statusBadge(appState)}</div>
              <h2 class="today-title">Upper Body Push &amp; Pull</h2>
              <p class="today-copy">${paused ? 'Timer paused. Session data remains safe on this device.' : 'Live session · Continue where you left off.'}</p>
            </div>
            <div class="today-side">
              <div class="today-stats"><div class="today-stat"><span>Elapsed</span><strong>19:28</strong></div><div class="today-stat"><span>Sets</span><strong>2 / 18</strong></div><div class="today-stat"><span>Exercises</span><strong>2 / 6</strong></div></div>
              <div class="today-actions"><button class="primary-button" type="button" data-action="resume">Resume Workout</button><button class="secondary-button" type="button" data-action="quick-start">Other Options</button></div>
            </div>
          </div>
        </section>`;
      }
      if (appState === 'empty') {
        return `<section class="today-card ${extraClass}"><div class="today-inner">
          <div class="today-core"><div class="today-top"><span class="mission-label">Today's training</span><span class="state-badge">Open Slot</span></div>
          <h2 class="today-title">No workout planned</h2>
          <p class="today-copy">Start open training now, or choose a saved routine.</p></div>
          <div class="today-side"><div class="today-actions"><button class="primary-button" type="button" data-action="start-open">Start Open Workout</button><button class="secondary-button" type="button" data-action="quick-start">Choose Routine</button></div></div>
        </div></section>`;
      }
      return `<section class="today-card ${extraClass}"><div class="today-inner">
        <div class="today-core"><div class="today-top"><span class="mission-label">Today's mission</span>${statusBadge('planned')}</div>
        <h2 class="today-title">Upper Body Push &amp; Pull</h2>
        <p class="today-copy">Chest · Back · Arms</p></div>
        <div class="today-side"><div class="today-stats"><div class="today-stat"><span>Exercises</span><strong>6</strong></div><div class="today-stat"><span>Planned sets</span><strong>18</strong></div><div class="today-stat"><span>Last trained</span><strong>6d</strong></div></div>
        <div class="today-actions"><button class="primary-button" type="button" data-action="start-today">Start Workout</button><button class="secondary-button" type="button" data-action="quick-start">Other Options</button></div>
        </div>
      </div></section>`;
    }

    function weekGrid() {
      return `<div class="week-grid">${week.map(([day, plan, state]) => `<div class="day-chip ${state === 'today' ? 'is-today' : state === 'done' ? 'is-done' : state === 'rest' ? 'is-rest' : ''}"><strong>${day}</strong><span>${state === 'done' ? '✓ ' : ''}${plan}</span></div>`).join('')}</div>`;
    }

    function fieldWeek() {
      return `<div class="field-week">${week.map(([day, plan, state]) => `<div class="field-day ${state === 'today' ? 'is-today' : state === 'done' ? 'is-done' : ''}"><strong>${day}</strong><span>${plan}</span><small>${state === 'today' ? 'Today' : state === 'done' ? 'Complete' : state === 'rest' ? 'Recovery' : 'Planned'}</small></div>`).join('')}</div>`;
    }

    function routineRows(withActions = false, queue = false) {
      return routines.map(([name, meta], index) => `<button class="routine-row" type="button" data-action="${withActions ? 'start-routine' : 'view-routine'}" data-name="${name}">${queue ? `<span class="queue-number">0${index + 1}</span>` : ''}<span class="row-copy"><strong>${name}</strong><small>${meta}</small></span>${withActions ? '<span class="row-action">Start</span>' : '<span class="row-arrow">›</span>'}</button>`).join('');
    }

    function recentRows() {
      return recents.map(([name, meta]) => `<button class="recent-row" type="button" data-action="view-history"><span class="row-copy"><strong>${name}</strong><small>${meta}</small></span><span class="row-arrow">›</span></button>`).join('');
    }

    function appHeader() {
      return `<div class="app-rail"><span class="brand-mark">FD</span><span class="brand-copy"><strong>FITDEX</strong><small>Training System</small></span><span class="profile-chip"><i class="profile-orb"></i><span>LEVEL 18</span></span></div>
        <header class="hub-header"><div><p class="eyebrow">Training</p><h1>Workout Hub</h1></div><time class="header-date">Thu<br>17 Sep</time></header>`;
    }

    function bottomNav() {
      return `<nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item" type="button" data-action="navigate"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span><span>Home</span></button>
        <button class="nav-item is-active" type="button" data-action="navigate" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"></path><path d="m2.5 21.5 1.4-1.4"></path><path d="m20.1 3.9 1.4-1.4"></path><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"></path><path d="m9.6 14.4 4.8-4.8"></path></svg></span><span>Workout</span></button>
        <button class="nav-item" type="button" data-action="navigate"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg></span><span>Food</span></button>
        <button class="nav-item" type="button" data-action="navigate"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21v-6"></path><path d="M12 21V9"></path><path d="M19 21V3"></path></svg></span><span>Progress</span></button>
        <button class="nav-item" type="button" data-action="navigate"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4"></path><path d="M2 10h4"></path><path d="M2 14h4"></path><path d="M2 18h4"></path><rect width="16" height="20" x="4" y="2" rx="2"></rect><path d="M15 2v20"></path><path d="M15 7h5"></path><path d="M15 12h5"></path><path d="M15 17h5"></path></svg></span><span>Journal</span></button>
      </nav>`;
    }

    const dexIconSvg = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16"></path><path d="M20.001 19A2 2 0 0 0 22 17V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2z"></path></svg>';

    function missionVariant() {
      return `<div class="preview-viewport"><div class="hub-shell variant-mission">${appHeader()}<main class="hub-content">
        ${todayCard()}
        <section class="panel hub-section weekly-panel"><div class="section-head"><h2 class="section-title">Weekly Plan</h2><button class="text-action" type="button" data-action="edit-plan">Edit Plan</button></div>${weekGrid()}</section>
        <section class="panel hub-section"><div class="section-head"><h2 class="section-title">Saved Routines</h2><button class="text-action" type="button" data-action="view-routines">View All</button></div><div class="routine-list">${routineRows(false)}</div></section>
        <button class="dex-gateway" type="button" data-action="open-dex"><span class="dex-icon">${dexIconSvg}</span><span class="dex-copy"><strong>Exercise Dex</strong><small>804 moves · Browse exercises, favourites and categories</small></span><span class="row-arrow">›</span></button>
        <section class="panel hub-section recent-panel"><div class="section-head"><h2 class="section-title">Recent Workouts</h2><button class="text-action" type="button" data-action="view-history">History</button></div><div class="recent-list">${recentRows()}</div></section>
      </main>${bottomNav()}</div></div>`;
    }

    function commandVariant() {
      return `<div class="preview-viewport"><div class="hub-shell variant-command">${appHeader()}<main class="hub-content">
        ${todayCard()}
        <section class="panel hub-section weekly-panel"><div class="section-head"><h2 class="section-title">7-Day Command Map</h2><button class="text-action" type="button" data-action="edit-plan">Edit</button></div>${weekGrid()}</section>
        <section class="panel hub-section"><div class="section-head"><h2 class="section-title">Routine Loadout</h2><button class="text-action" type="button" data-action="view-routines">All</button></div><div class="routine-list">${routineRows(true)}</div></section>
        <section class="panel hub-section dex-gateway"><span class="dex-icon">${dexIconSvg}</span><span class="dex-copy"><strong>Exercise Dex</strong><small>804 moves indexed</small></span><button class="row-action" type="button" data-action="open-dex">Open Dex</button></section>
        <section class="panel hub-section recent-panel"><div class="section-head"><h2 class="section-title">Mission History</h2><button class="text-action" type="button" data-action="view-history">All</button></div><div class="recent-list">${recentRows()}</div></section>
      </main>${bottomNav()}</div></div>`;
    }

    function fieldVariant() {
      return `<div class="preview-viewport"><div class="hub-shell variant-field">${appHeader()}<main class="hub-content">
        ${todayCard()}
        <section class="panel hub-section weekly-panel"><div class="section-head"><div><p class="eyebrow">Route</p><h2 class="section-title">This Training Week</h2></div><button class="text-action" type="button" data-action="edit-plan">Edit Plan</button></div>${fieldWeek()}</section>
        <section class="panel hub-section field-queue"><div class="section-head"><div><p class="eyebrow">Loadouts</p><h2 class="section-title">Saved Routines</h2></div><button class="text-action" type="button" data-action="view-routines">View All</button></div><div class="routine-list">${routineRows(false, true)}</div></section>
        <div class="field-command-row"><button class="dex-gateway" type="button" data-action="open-dex"><span class="dex-icon">${dexIconSvg}</span><span class="dex-copy"><strong>Exercise Dex</strong><small>804 moves</small></span><span class="row-arrow">›</span></button><button class="dex-gateway" type="button" data-action="quick-start"><span class="dex-icon">＋</span><span class="dex-copy"><strong>Open Training</strong><small>Build as you go</small></span><span class="row-arrow">›</span></button></div>
        <section class="panel hub-section recent-panel"><div class="section-head"><div><p class="eyebrow">Field Log</p><h2 class="section-title">Recent Workouts</h2></div><button class="text-action" type="button" data-action="view-history">History</button></div><div class="recent-list">${recentRows()}</div></section>
      </main>${bottomNav()}</div></div>`;
    }

    const variants = [missionVariant, commandVariant, fieldVariant];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); applyPreviewWidth(); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    function applyPreviewWidth() {
      const viewport = document.querySelector('.preview-viewport');
      if (viewport) viewport.style.setProperty('--preview-width', document.getElementById('widthControl').value);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 1800);
    }

    document.getElementById('widthControl').addEventListener('change', applyPreviewWidth);
    document.getElementById('stateControl').addEventListener('change', (event) => { appState = event.target.value; mount(current); });
    document.getElementById('themeControl').addEventListener('change', (event) => {
      const [family, brightness] = event.target.value.split(':');
      document.documentElement.setAttribute('data-theme-family', family);
      document.documentElement.setAttribute('data-brightness', brightness);
    });

    function openQuickSheet() {
      const sheet = document.getElementById('quickSheet');
      const dialog = sheet.querySelector('.quick-sheet');
      const isSessionActive = appState === 'active' || appState === 'paused';
      const paused = appState === 'paused';

      if (isSessionActive) {
        dialog.innerHTML = `
          <div class="quick-sheet-head">
            <div><p class="eyebrow">Active session</p><h2 id="quickSheetTitle">Session Options</h2></div>
            <button class="icon-button" type="button" data-action="close-sheet" aria-label="Close session options">×</button>
          </div>
          <div class="quick-options">
            <div class="sheet-section-label">Current Workout</div>
            <button class="quick-option" type="button" data-action="resume">
              <span><strong>Resume Workout</strong><small>Upper Body Push &amp; Pull · In progress</small></span>
              <b>›</b>
            </button>
            <button class="quick-option" type="button" data-action="toggle-pause">
              <span><strong>${paused ? 'Resume Workout Timer' : 'Pause Workout Timer'}</strong><small>${paused ? 'Timer paused at 19:28 · Session safe' : 'Pause timer without ending session'}</small></span>
              <b>›</b>
            </button>

            <div class="sheet-section-label is-danger">Start Something Else</div>
            <button class="quick-option is-destructive" type="button" data-action="discard-and-routine">
              <span><strong class="text-danger">Discard Current &amp; Choose Routine</strong><small>Abandons active session and opens routine picker</small></span>
              <b>›</b>
            </button>
            <button class="quick-option is-destructive" type="button" data-action="discard-and-open">
              <span><strong class="text-danger">Discard Current &amp; Open Workout</strong><small>Abandons active session and starts empty workout</small></span>
              <b>›</b>
            </button>
          </div>
        `;
      } else if (appState === 'empty') {
        dialog.innerHTML = `
          <div class="quick-sheet-head">
            <div><p class="eyebrow">Quick launch</p><h2 id="quickSheetTitle">Start Workout</h2></div>
            <button class="icon-button" type="button" data-action="close-sheet" aria-label="Close quick start">×</button>
          </div>
          <div class="quick-options">
            <button class="quick-option" type="button" data-action="choose-routine"><span><strong>Choose Routine</strong><small>Start from one of 4 saved routines</small></span><b>›</b></button>
            <button class="quick-option" type="button" data-action="start-open"><span><strong>Open Workout</strong><small>Build session as you train</small></span><b>›</b></button>
          </div>
        `;
      } else {
        dialog.innerHTML = `
          <div class="quick-sheet-head">
            <div><p class="eyebrow">Quick launch</p><h2 id="quickSheetTitle">Start Workout</h2></div>
            <button class="icon-button" type="button" data-action="close-sheet" aria-label="Close quick start">×</button>
          </div>
          <div class="quick-options">
            <button class="quick-option" type="button" data-action="start-today"><span><strong>Today's Plan</strong><small>Upper Body Push &amp; Pull · 6 exercises</small></span><b>›</b></button>
            <button class="quick-option" type="button" data-action="choose-routine"><span><strong>Choose Routine</strong><small>Start from one of 4 saved routines</small></span><b>›</b></button>
            <button class="quick-option" type="button" data-action="start-open"><span><strong>Open Workout</strong><small>Build session as you train</small></span><b>›</b></button>
          </div>
        `;
      }

      sheet.classList.add('is-open');
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'quick-start') openQuickSheet();
      else if (action === 'close-sheet') document.getElementById('quickSheet').classList.remove('is-open');
      else if (action === 'discard-and-routine') {
        if (confirm('Discard current active workout "Upper Body Push & Pull"? In-progress sets and duration will be lost.')) {
          appState = 'planned';
          document.getElementById('stateControl').value = 'planned';
          document.getElementById('quickSheet').classList.remove('is-open');
          mount(current);
          showToast('Active workout discarded · Routine picker opened');
        }
      } else if (action === 'discard-and-open') {
        if (confirm('Discard current active workout "Upper Body Push & Pull"? In-progress sets and duration will be lost.')) {
          appState = 'active';
          document.getElementById('stateControl').value = 'active';
          document.getElementById('quickSheet').classList.remove('is-open');
          mount(current);
          showToast('Active workout discarded · Starting open workout');
        }
      } else if (action === 'start-today' || action === 'start-open') {
        if (appState === 'active' || appState === 'paused') {
          if (!confirm('Discard active workout? Active session data will not be saved.')) return;
        }
        appState = 'active';
        document.getElementById('stateControl').value = 'active';
        document.getElementById('quickSheet').classList.remove('is-open');
        mount(current);
        showToast(action === 'start-today' ? 'Starting today’s mission' : 'Starting open workout');
      } else if (action === 'start-routine') {
        if (appState === 'active' || appState === 'paused') {
          if (!confirm(`Discard active workout and start "${target.dataset.name || 'routine'}"? Active session data will not be saved.`)) return;
        }
        appState = 'active';
        document.getElementById('stateControl').value = 'active';
        document.getElementById('quickSheet').classList.remove('is-open');
        mount(current);
        showToast(`Starting ${target.dataset.name || 'routine'}`);
      } else if (action === 'toggle-pause') {
        appState = appState === 'paused' ? 'active' : 'paused';
        document.getElementById('stateControl').value = appState;
        document.getElementById('quickSheet').classList.remove('is-open');
        mount(current);
        showToast(appState === 'paused' ? 'Workout timer paused' : 'Workout timer resumed');
      } else if (action === 'resume') {
        document.getElementById('quickSheet').classList.remove('is-open');
        showToast('Opening locked Phase 2A Active Workout');
      } else if (action === 'choose-routine') showToast('Routine picker opened');
      else if (action === 'view-routine') showToast(`Opening ${target.dataset.name}`);
      else if (action === 'open-dex') showToast('Opening Exercise Dex');
      else if (action === 'edit-plan') showToast('Opening Weekly Plan editor');
      else if (action === 'view-history') showToast('Opening workout history');
      else if (action === 'view-routines') showToast('Opening all saved routines');
      else if (action === 'navigate') showToast(`${target.textContent.trim()} navigation`);
    });

    document.getElementById('quickSheet').addEventListener('click', (event) => {
      if (event.target.id === 'quickSheet') event.currentTarget.classList.remove('is-open');
    });

    const requestedVariant = parseInt(new URLSearchParams(location.search).get('v'), 10) || 1;
    setActive(requestedVariant >= 1 && requestedVariant <= variants.length ? requestedVariant - 1 : 0);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
