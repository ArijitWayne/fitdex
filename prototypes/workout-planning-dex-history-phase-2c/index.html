<!doctype html>
<html lang="en" data-theme-family="spartans" data-brightness="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>FitDex Phase 2C — Planning, Dex & History</title>
<style>
:root {
  --font-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-display: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --max: 480px;
  --pad: clamp(8px, 2.5cqi, 12px);
  --gap: clamp(10px, 3cqi, 14px);

  /* Spartan Light */
  --bg: #f0e6d6;
  --app: #f4ebdd;
  --surface: #eae2d5;
  --surface-raised: #f8efe2;
  --surface-subtle: #ddd9ce;
  --border: #979b92;
  --border-strong: #6f7771;
  --border-rpg: #535a54;
  --text: #2e3230;
  --text-muted: #656b67;
  --primary: #1f8582;
  --primary-text: #176864;
  --primary-muted: #d1ded9;
  --warm: #b67e26;
  --danger: #a74343;
  --danger-muted: rgba(167, 67, 67, 0.12);
  --success: #2d8a57;
  --success-muted: rgba(45, 138, 87, 0.14);
  --shadow: rgba(47, 51, 48, 0.16);

  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

:root[data-theme-family="spartans"][data-brightness="dark"] {
  --bg: #121616;
  --app: #181d1d;
  --surface: #1f2524;
  --surface-raised: #282f2e;
  --surface-subtle: #303635;
  --border: #444f4c;
  --border-strong: #697772;
  --border-rpg: #0c0f0f;
  --text: #e8e8e2;
  --text-muted: #a7aeaa;
  --primary: #2e9895;
  --primary-text: #58b4af;
  --primary-muted: #1e2c2a;
  --warm: #d09a49;
  --danger: #d66a66;
  --danger-muted: rgba(214, 106, 106, 0.15);
  --success: #3db874;
  --success-muted: rgba(61, 184, 116, 0.16);
  --shadow: rgba(0, 0, 0, 0.45);
}

:root[data-theme-family="amazonians"][data-brightness="light"] {
  --bg: #f0e4d4;
  --app: #f4e9db;
  --surface: #ebe1d8;
  --surface-raised: #f7ede0;
  --surface-subtle: #ddd0d1;
  --border: #9f898e;
  --border-strong: #806c73;
  --border-rpg: #57464b;
  --text: #352b31;
  --text-muted: #746a6e;
  --primary: #785178;
  --primary-text: #654061;
  --primary-muted: #e2d3dc;
  --warm: #b96f49;
  --danger: #a44449;
  --danger-muted: rgba(164, 68, 73, 0.12);
  --success: #2d8a57;
  --success-muted: rgba(45, 138, 87, 0.14);
  --shadow: rgba(62, 45, 54, 0.16);
}

:root[data-theme-family="amazonians"][data-brightness="dark"] {
  --bg: #1f171e;
  --app: #281c27;
  --surface: #31232f;
  --surface-raised: #3a2937;
  --surface-subtle: #44323f;
  --border: #5b4654;
  --border-strong: #7e6375;
  --border-rpg: #140d13;
  --text: #eee5df;
  --text-muted: #b2a3aa;
  --primary: #906390;
  --primary-text: #bd91b7;
  --primary-muted: #3a2436;
  --warm: #d18459;
  --danger: #d86f74;
  --danger-muted: rgba(216, 111, 116, 0.15);
  --success: #3db874;
  --success-muted: rgba(61, 184, 116, 0.16);
  --shadow: rgba(0, 0, 0, 0.45);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 0; min-height: 100dvh; background: var(--bg); color: var(--text); }
button, input, select { font: inherit; color: inherit; }
button {
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: inherit;
  touch-action: manipulation;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.harness { min-height: 100dvh; padding: 68px 8px 96px; }
.harness-controls {
  display: flex;
  width: min(100%, 760px);
  margin: 0 auto 12px;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  color: var(--text-muted);
  font-size: .7rem;
  font-weight: 800;
  text-transform: uppercase;
}
.harness-controls label { display: inline-flex; gap: 5px; align-items: center; }
.harness-controls select { min-height: 36px; padding: 5px 8px; border: 1px solid var(--border); background: var(--surface-raised); color: var(--text); }
#stage { display: flex; min-width: 0; justify-content: center; }
.viewport {
  width: min(100%, var(--preview-width, 100%));
  max-width: var(--max);
  min-width: 0;
  background: var(--app);
  border: 1px solid var(--border-strong);
  box-shadow: 0 12px 36px var(--shadow), 3px 3px 0 var(--border-rpg);
  container: phase2c / inline-size;
}

/* Header & Rail */
.rail {
  display: flex;
  min-height: calc(48px + env(safe-area-inset-top));
  align-items: center;
  gap: 8px;
  padding: calc(7px + env(safe-area-inset-top)) var(--pad) 7px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-raised);
}
.brand {
  display: grid;
  width: 31px;
  height: 31px;
  place-items: center;
  border: 2px solid var(--primary);
  background: var(--primary-muted);
  color: var(--primary-text);
  font-family: var(--font-display);
  font-size: .75rem;
  font-weight: 900;
}
.brand-copy { line-height: 1; }
.brand-copy strong, .brand-copy small { display: block; }
.brand-copy strong { font-family: var(--font-display); font-size: .87rem; letter-spacing: .08em; color: var(--text); }
.brand-copy small { color: var(--text-muted); font-family: var(--font-mono); font-size: .55rem; text-transform: uppercase; }
.level {
  margin-left: auto;
  padding: 5px 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: .62rem;
  font-weight: 900;
}
.head {
  display: flex;
  min-width: 0;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  padding: clamp(12px, 3.5cqi, 17px) var(--pad) 10px;
}
.eyebrow {
  margin: 0 0 3px;
  color: var(--primary-text);
  font-family: var(--font-mono);
  font-size: .61rem;
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.head h1 {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 6cqi, 1.7rem);
  line-height: .98;
  text-transform: uppercase;
  color: var(--text);
}
.head time {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: .6rem;
  font-weight: 800;
  text-align: right;
  text-transform: uppercase;
}

/* Main Content & Surface Hierarchy */
.content { display: grid; min-width: 0; gap: var(--gap); padding: 0 var(--pad) 22px; }

/* Level 2: Section Panel */
.panel {
  min-width: 0;
  padding: clamp(10px, 3cqi, 14px);
  border: 1px solid var(--border);
  background: var(--surface-raised);
  box-shadow: 2px 2px 0 var(--border-rpg);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.panel-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: .92rem;
  text-transform: uppercase;
  color: var(--text);
}
.text-action {
  min-width: 44px;
  min-height: 38px;
  padding: 4px 6px;
  color: var(--primary-text);
  font-size: .65rem;
  font-weight: 850;
  text-decoration: underline;
  text-transform: uppercase;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 0 6px;
  color: var(--primary-text);
  font-size: .68rem;
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
}

/* Button Hierarchy */
.primary, .secondary, .danger, .icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 7px 12px;
  border-radius: 2px;
  font-size: .7rem;
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
  transition: transform 140ms cubic-bezier(.23,1,.32,1), border-color 140ms ease, color 140ms ease, background-color 140ms ease;
}
.primary {
  border: 2px solid var(--primary);
  background: var(--primary);
  color: #fff;
  box-shadow: 2px 2px 0 var(--border-rpg);
}
.secondary {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
}
.danger {
  border: 1px solid var(--danger);
  background: var(--surface);
  color: var(--danger);
}
.icon {
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--primary-text);
}
button:active { transform: scale(.97); }

/* Level 3: Rows & Cards */
.rows { display: grid; min-width: 0; }
.row {
  display: grid;
  width: 100%;
  min-width: 0;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  min-height: 58px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  text-align: left;
}
.row:first-child { border-top: 0; }
.day {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: .6rem;
  font-weight: 900;
}
.today .day {
  border-color: var(--primary);
  background: var(--primary-muted);
  color: var(--primary-text);
}
.copy { min-width: 0; }
.copy strong, .copy small { display: block; overflow: hidden; text-overflow: ellipsis; }
.copy strong {
  font-family: var(--font-display);
  font-size: .84rem;
  letter-spacing: .025em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--text);
}
.copy small {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: .64rem;
  line-height: 1.3;
  white-space: nowrap;
}
.tag {
  display: inline-flex;
  width: max-content;
  margin-top: 3px;
  padding: 2px 5px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: .53rem;
  font-weight: 900;
  text-transform: uppercase;
}
.tag.rest { border-color: var(--warm); color: var(--warm); }
.tag.open { border-color: var(--primary); color: var(--primary-text); }
.tag.empty { border-color: var(--border); color: var(--text-muted); }
.arrow { color: var(--primary-text); font-size: 1rem; font-weight: 900; }

/* 7-Day Compact Week Grid */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin-bottom: 12px;
}
.day-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 52px;
  padding: 4px 2px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  text-align: center;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease;
}
.day-chip:hover { border-color: var(--primary); }
.day-chip strong {
  font-family: var(--font-mono);
  font-size: clamp(.5rem, 2cqi, .58rem);
  font-weight: 900;
  letter-spacing: .04em;
  color: var(--text-muted);
}
.day-chip span {
  font-family: var(--font-mono);
  font-size: clamp(.48rem, 1.8cqi, .56rem);
  font-weight: 850;
  letter-spacing: -.02em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--text);
}
.day-chip.is-today {
  border: 2px solid var(--primary);
  background: var(--primary-muted);
  color: var(--primary-text);
}
.day-chip.is-today strong, .day-chip.is-today span { color: var(--primary-text); }
.day-chip.is-rest span { color: var(--warm); }
.day-chip.is-open span { color: var(--primary-text); }
.day-chip.is-empty span { color: var(--text-muted); }

/* Saved Routines Cards */
.routine-list { display: grid; gap: 7px; }
.routine-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  box-shadow: 1px 1px 0 var(--border-rpg);
}
.routine-card:hover { border-color: var(--primary); }
.routine-card-main { min-width: 0; display: grid; gap: 3px; cursor: pointer; text-align: left; }
.routine-title {
  font-family: var(--font-display);
  font-size: .88rem;
  font-weight: 900;
  letter-spacing: .03em;
  text-transform: uppercase;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.routine-meta {
  color: var(--text-muted);
  font-size: .66rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn-start {
  min-height: 36px;
  padding: 5px 10px;
  border: 1px solid var(--border-strong);
  background: var(--surface-raised);
  color: var(--text);
  font-size: .64rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.btn-start:hover {
  border-color: var(--primary);
  color: var(--primary-text);
  background: var(--primary-muted);
}

/* Routine Editor */
.routine-name {
  width: 100%;
  min-height: 44px;
  padding: 9px 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-display);
  font-size: .95rem;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.editor-list { display: grid; gap: 6px; }
.editor-item {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
.editor-item b {
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border: 1px solid var(--border);
  background: var(--surface-subtle);
  color: var(--primary-text);
  font-family: var(--font-mono);
  font-size: .58rem;
}
.editor-item span { min-width: 0; }
.editor-item strong, .editor-item small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor-item strong { font-size: .78rem; text-transform: uppercase; color: var(--text); font-weight: 800; }
.editor-item small { margin-top: 2px; color: var(--text-muted); font-size: .61rem; }
.mini {
  display: inline-grid;
  width: 30px;
  height: 30px;
  place-items: center;
  padding: 0;
  border: 1px solid var(--border);
  background: var(--surface-raised);
  color: var(--text);
  font-size: .75rem;
  font-weight: 900;
}
.mini:hover { border-color: var(--primary); color: var(--primary-text); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.quiet-danger {
  min-height: 40px;
  padding: 4px 0;
  color: var(--danger);
  font-size: .65rem;
  font-weight: 850;
  text-decoration: underline;
  text-transform: uppercase;
  text-align: center;
}

/* Search Bar & Filters */
.search {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 7px;
  min-height: 44px;
  padding: 0 9px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
}
.search input {
  min-width: 0;
  border: 0;
  background: transparent;
  outline: 0;
  color: var(--text);
  font-size: .78rem;
}
.search input::placeholder { color: var(--text-muted); opacity: 0.85; }
.filters {
  display: flex;
  min-width: 0;
  gap: 5px;
  overflow-x: auto;
  padding: 7px 0 2px;
  scrollbar-width: thin;
}
.chip {
  min-height: 34px;
  flex: 0 0 auto;
  padding: 5px 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: .6rem;
  font-weight: 900;
  text-transform: uppercase;
  cursor: pointer;
}
.chip.active {
  border-color: var(--primary);
  background: var(--primary-muted);
  color: var(--primary-text);
}

/* Dex Scope Tabs */
.scope-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 2px;
}
.scope-tab {
  display: inline-flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  background: var(--surface);
  color: var(--text-muted);
  font-size: .7rem;
  font-weight: 900;
  letter-spacing: .05em;
  text-transform: uppercase;
  transition: background 140ms ease, color 140ms ease;
}
.scope-tab + .scope-tab { border-left: 1px solid var(--border); }
.scope-tab.active {
  background: var(--primary-muted);
  color: var(--primary-text);
  box-shadow: inset 0 -3px 0 var(--primary);
}

/* Exercise Category Cards (Anatomy Grid) */
.category-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(8px, 2.5cqi, 12px);
  padding: 4px 0;
}
.category-card {
  position: relative;
  display: grid;
  min-width: 0;
  min-height: 140px;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: 'art arrow' 'copy arrow';
  align-items: center;
  gap: 6px 8px;
  padding: clamp(10px, 3cqi, 14px);
  overflow: hidden;
  border: 1px solid var(--border);
  background: linear-gradient(145deg, var(--surface-raised), var(--surface));
  color: var(--text);
  box-shadow: 2px 2px 0 var(--border-rpg);
  text-align: left;
  transition: transform 140ms cubic-bezier(.23, 1, .32, 1), border-color 140ms ease, background 140ms ease;
}
.category-card:hover {
  border-color: var(--primary);
  background: var(--primary-muted);
  color: var(--primary-text);
  transform: translate(-1px, -1px);
}
.category-card:active { transform: scale(0.97); }
.category-sprite {
  width: min(100%, 100px);
  height: 88px;
  grid-area: art;
  align-self: center;
  justify-self: center;
  object-fit: contain;
  image-rendering: auto;
}
.category-card-copy {
  display: grid;
  min-width: 0;
  grid-area: copy;
  gap: 2px;
}
.category-card-copy strong {
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(0.78rem, 3.4cqi, 0.9rem);
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--text);
}
.category-card:hover .category-card-copy strong { color: var(--primary-text); }
.category-card-copy small {
  color: var(--text-muted);
  font-size: clamp(0.62rem, 2.4cqi, 0.7rem);
  font-weight: 800;
}
.category-card-arrow {
  grid-area: arrow;
  color: var(--primary-text);
  font-size: 1.15rem;
  font-weight: 900;
}

/* Compact Exercise Rows */
.exercise-row {
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(0, 1fr) 44px 44px;
  align-items: center;
  gap: 4px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  margin-bottom: 6px;
  transition: border-color 140ms ease, background 140ms ease;
}
.exercise-row:hover { border-color: var(--primary); }
.exercise-row.is-picker { grid-template-columns: minmax(0, 1fr) 44px 84px; }
.exercise-row-info { min-width: 0; display: grid; gap: 2px; text-align: left; }
.exercise-row-info strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-body);
  font-size: .82rem;
  font-weight: 800;
  color: var(--text);
}
.exercise-row-info small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-muted);
  font-size: .64rem;
  line-height: 1.25;
}
.btn-star {
  display: grid;
  width: 44px;
  min-width: 44px;
  height: 44px;
  place-items: center;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  font-size: 1.25rem;
  line-height: 1;
  transition: transform 140ms cubic-bezier(.23, 1, .32, 1), color 140ms ease;
}

/**
 * Deterministic Weekly Plan Compact Label Rule:
 * 1. SYSTEM-STATE LABELS — NEVER TRUNCATE:
 *    NO PLAN, REST, OPEN
 * 2. ASSIGNED PLAN / ROUTINE NAMES:
 *    Max visible characters = 9 (including spaces).
 *    If <= 9 chars: show completely.
 *    If > 9 chars: show first 9 characters + single ellipsis glyph '…'.
 */
function formatCompactDayLabel(raw) {
  if (!raw) return 'NO PLAN';
  const str = String(raw).trim();
  const upper = str.toUpperCase();
  
  // System-state labels: ALWAYS FULL
  if (upper === 'NO PLAN' || upper === 'NO ASSIGNMENT' || upper === 'NONE' || upper === 'NO WORKOUT') {
    return 'NO PLAN';
  }
  if (upper === 'REST' || upper === 'REST DAY' || upper === 'RECOVERY' || upper === 'RECOVERY DAY') {
    return 'REST';
  }
  if (upper === 'OPEN' || upper === 'OPEN DAY' || upper === 'OPEN SLOT' || upper === 'WORKOUT DAY') {
    return 'OPEN';
  }
  
  // Assigned plan / routine names: max 9 chars + '…'
  if (upper.length <= 9) {
    return upper;
  }
  return upper.slice(0, 9) + '…';
}

const screens = [
  planScreen,
  routineListScreen,
  editorScreen,
  dexScreen,
  pickerScreen,
  historyScreen,
  detailScreen
];

const stage = document.getElementById('stage');
const pickerNav = document.querySelector('.proto-picker');
const highlight = pickerNav.querySelector('.proto-picker-highlight');
const items = [].slice.call(pickerNav.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)'));
const replay = pickerNav.querySelector('.proto-picker-replay');
const overlay = document.getElementById('overlay');

function positionOverlay() {
  let e = document.querySelector('.viewport');
  if (!e) return;
  let r = e.getBoundingClientRect();
  overlay.style.left = r.left + 'px';
  overlay.style.top = r.top + 'px';
  overlay.style.width = r.width + 'px';
  overlay.style.height = r.height + 'px';
}

function move() {
  let e = items[screen];
  if (!e) return;
  highlight.style.width = e.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + e.offsetLeft + 'px)';
  positionOverlay();
}

function apply() {
  let e = document.querySelector('.viewport');
  if (e) e.style.setProperty('--preview-width', document.getElementById('width').value);
  positionOverlay();
}

function mount() {
  stage.innerHTML = '';
  requestAnimationFrame(function() {
    stage.innerHTML = screens[screen]();
    apply();
  });
}

function select(i) {
  if (i < 0 || i >= screens.length) return;
  screen = i;
  items.forEach(function(e, j) {
    e.toggleAttribute('data-active', j === i);
    if (j === i) e.setAttribute('aria-current', 'true');
    else e.removeAttribute('aria-current');
  });
  move();
  let u = new URL(location);
  u.searchParams.set('v', i + 1);
  history.replaceState(null, '', u);
  mount();
}

function notice(x) {
  let e = document.getElementById('toast');
  e.textContent = x;
  e.style.cssText = 'position:fixed;z-index:1200;right:12px;bottom:18px;max-width:280px;padding:9px 12px;border:1px solid var(--primary);background:var(--surface-raised);color:var(--text);box-shadow:2px 2px 0 var(--border-rpg);font-size:.72rem;font-weight:800;border-radius:2px;';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { e.removeAttribute('style'); }, 1800);
}

function closeOverlay() {
  overlay.innerHTML = '';
}

// Day Sheet: FULL real stored name displayed in header (NEVER truncated)

  overlay.innerHTML = '<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true">' +

items.forEach(function(e, i) {
  e.addEventListener('click', function() { select(i); });
});

replay.addEventListener('click', mount);
window.addEventListener('resize', move);

document.getElementById('width').addEventListener('change', apply);

document.getElementById('theme').addEventListener('change', function(e) {
  let p = e.target.value.split(':');
  document.documentElement.setAttribute('data-theme-family', p[0]);
  document.documentElement.setAttribute('data-brightness', p[1]);
  mount();
});

document.addEventListener('input', function(e) {
  if (e.target.id === 'search') {
    query = e.target.value;
    mount();
    requestAnimationFrame(function() {
      let el = document.getElementById('search');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  } else if (e.target.id === 'catSearch') {
    catQuery = e.target.value;
    mount();
    requestAnimationFrame(function() {
      let el = document.getElementById('catSearch');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  } else if (e.target.id === 'pickerSearch') {
    pickerQuery = e.target.value;
    mount();
    requestAnimationFrame(function() {
      let el = document.getElementById('pickerSearch');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
});

document.addEventListener('keydown', function(e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
  let n = parseInt(e.key, 10);
  if (n >= 1 && n <= screens.length) select(n - 1);
  else if (e.key === 'ArrowRight') select((screen + 1) % screens.length);
  else if (e.key === 'ArrowLeft') select((screen - 1 + screens.length) % screens.length);
  else if (e.key === 'r' || e.key === 'R') mount();
  else if (e.key === 'Escape') closeOverlay();
});

document.addEventListener('click', function(e) {
  let t = e.target.closest('[data-a]');
  if (!t) return;
  let a = t.dataset.a;

  if (a === 'day') {
    chosenDay = Number(t.dataset.i);
    daySheet();
  } else if (a === 'assign') {
    routineSheet();
  } else if (a === 'setroutine') {
    days[chosenDay][1] = routines[Number(t.dataset.i)][0];
    days[chosenDay][2] = 'planned';
    closeOverlay();
    select(0);
    notice('Plan updated');
  } else if (a === 'rest') {
    days[chosenDay][1] = 'Rest Day';
    days[chosenDay][2] = 'rest';
    closeOverlay();
    select(0);
  } else if (a === 'open') {
    days[chosenDay][1] = 'Open Day';
    days[chosenDay][2] = 'open';
    closeOverlay();
    select(0);
  } else if (a === 'clear') {
    days[chosenDay][1] = 'No Plan';
    days[chosenDay][2] = 'empty';
    closeOverlay();
    select(0);
  } else if (a === 'close') {
    closeOverlay();
  } else if (a === 'editor') {
    select(2);
  } else if (a === 'routines') {
    select(1);
  } else if (a === 'picker') {
    select(4);
  } else if (a === 'history') {
    select(5);
  } else if (a === 'detail') {
    notice(t.dataset.n || 'Exercise detail');
    if (screen === 5) select(6);
  } else if (a === 'scope') {
    dexScope = t.dataset.s;
    dexCategory = null;
    query = '';
    mount();
  } else if (a === 'opencategory') {
    dexCategory = t.dataset.c;
    catQuery = '';
    mount();
  } else if (a === 'clearcategory') {
    dexCategory = null;
    catQuery = '';
    mount();
  } else if (a === 'clearsearch') {
    query = '';
    mount();
  } else if (a === 'clearcatsearch') {
    catQuery = '';
    mount();
  } else if (a === 'clearpickersearch') {
    pickerQuery = '';
    mount();
  } else if (a === 'pickerfilter') {
    pickerFilter = t.dataset.f;
    mount();
  } else if (a === 'fav') {
    let n = t.dataset.n;
    if (fav.has(n)) {
      fav.delete(n);
      notice('Removed ' + n + ' from favorites');
    } else {
      fav.add(n);
      notice('Added ' + n + ' to favorites');
    }
    mount();
  } else if (a === 'add') {
    let n = t.dataset.n;
    if (added.has(n)) {
      added.delete(n);
      let idx = editor.indexOf(n);
      if (idx !== -1) editor.splice(idx, 1);
      notice('Removed ' + n + ' from routine');
    } else {
      added.add(n);
      if (!editor.includes(n)) editor.push(n);
      notice('Added ' + n + ' to routine');
    }
    mount();
  } else if (a === 'up' || a === 'down') {
    let i = Number(t.dataset.i);
    let j = i + (a === 'up' ? -1 : 1);
    if (j >= 0 && j < editor.length) {
      let z = editor[i];
      editor[i] = editor[j];
      editor[j] = z;
    }
    select(2);
  } else if (a === 'remove') {
    let removedName = editor[Number(t.dataset.i)];
    editor.splice(Number(t.dataset.i), 1);
    added.delete(removedName);
    select(2);
  } else if (a === 'save') {
    notice('Routine saved');
  } else if (a === 'start') {
    notice('Starting ' + t.dataset.n);
  } else if (a === 'create') {
    notice('New routine editor opened');
    select(2);
  } else if (a === 'deleteRoutine') {
    notice('Prototype routine deletion confirmed');
  } else if (a === 'deleteHistory') {
    confirmBox('confirmdelete');
  } else if (a === 'confirmdelete') {
    deleted = true;
    closeOverlay();
    select(5);
    notice('Completed workout deleted');
  } else if (a === 'emptyhistory') {
    deleted = !deleted;
    select(5);
  } else if (a === 'clearplan') {
    days.forEach(function(d) { d[1] = 'No Plan'; d[2] = 'empty'; });
    mount();
    notice('Weekly plan cleared to No Plan');
  }
});

let wanted = parseInt(new URLSearchParams(location.search).get('v'), 10) || 1;
select(wanted >= 1 && wanted <= screens.length ? wanted - 1 : 0);
requestAnimationFrame(function() {
  requestAnimationFrame(function() {
    pickerNav.setAttribute('data-ready', '');
  });
});
</script>
</body>
</html>
