  <style>

    .page-head { display:grid; min-width:0; gap:9px; padding-top:12px; }

    }

    .primary { display:inline-flex; width:100%; min-height:46px; align-items:center; justify-content:center; gap:7px; padding:8px 12px; border:2px solid var(--primary); background:var(--primary); color:white; box-shadow:2px 2px 0 var(--rpg); font-size:.69rem; font-weight:950; letter-spacing:.06em; text-transform:uppercase; }

    .food-copy { display:grid; min-width:0; gap:3px; }

    .featured-card { display:grid; gap:8px; padding:11px; border:2px solid var(--strong); border-left:4px solid var(--primary); background:var(--raised); box-shadow:3px 3px 0 var(--rpg); }

    .compact-list .food-row { grid-template-columns:minmax(0,1fr) 62px 44px; }

    .sheet-head { display:grid; min-width:0; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; gap:7px; padding:9px var(--pad); border-bottom:1px solid var(--strong); background:var(--raised); }
    .sheet-head .icon-button { border:0; }
    .sheet-head .close-spacer { width:44px; }
    .sheet-head h2 { text-align:center; }
    .sheet-scroll { min-width:0; overflow-x:hidden; overflow-y:auto; padding:12px var(--pad) calc(18px + env(safe-area-inset-bottom)); }
    .category-section { display:grid; min-width:0; gap:7px; margin-bottom:15px; }
    .category-grid { display:grid; min-width:0; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    .category-card { display:grid; min-width:0; min-height:48px; grid-template-columns:32px minmax(0,1fr); align-items:center; gap:7px; padding:6px 7px; border:1px solid var(--border); background:var(--raised); text-align:left; }
    .category-card.is-selected { border:2px solid var(--primary); background:var(--primary-muted); }
    .category-card .food-sprite { width:32px; min-width:32px; height:32px; }
    .category-card .food-custom-mask { width:24px; height:24px; }
    .category-card span { min-width:0; font-size:.59rem; font-weight:800; line-height:1.15; overflow-wrap:anywhere; }
    .custom-row { display:grid; min-width:0; grid-template-columns:minmax(0,1fr) 44px; border:1px solid var(--border); background:var(--raised); }
    .custom-row + .custom-row { border-top:0; }
    .custom-row .category-card { border:0; }
    .custom-delete { display:grid; width:44px; min-height:48px; place-items:center; padding:0; border:0; border-left:1px solid var(--border); background:var(--surface); color:var(--danger); cursor:pointer; }
    .custom-delete svg { width:16px; height:16px; }
    .create-category-form { display:grid; gap:13px; }
    .category-preview, .custom-category-preview { display:grid; min-width:0; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:11px; padding:10px; border:1px solid var(--border); background:var(--surface); }
    .category-preview > div, .custom-category-preview > div { display:grid; min-width:0; gap:2px; }
    .category-preview .food-sprite, .custom-category-preview .food-sprite { width:44px; min-width:44px; height:44px; }
    .category-preview .food-custom-mask, .custom-category-preview .food-custom-mask { width:32px; height:32px; }
    .category-preview strong, .custom-category-preview strong { overflow-wrap:anywhere; font-family:var(--font-display); font-size:.92rem; letter-spacing:.04em; text-transform:uppercase; }
    .category-preview small, .custom-category-preview small { color:var(--muted); font-size:.72rem; }
    .color-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
    .color-swatch { display:grid; min-width:44px; min-height:44px; place-items:center; padding:0; border:1px solid var(--border); background:var(--surface); cursor:pointer; }
    .color-swatch i { width:22px; height:22px; border-radius:50%; border:1px solid color-mix(in srgb, var(--strong) 50%, transparent); background:var(--swatch); }
    .color-swatch.is-selected { outline:3px solid var(--primary); outline-offset:1px; }
    .dialog-wrap { position:absolute; inset:0; z-index:2; display:grid; place-items:center; padding:12px; background:rgba(0,0,0,.68); pointer-events:auto; }
    .dialog { width:min(100%,410px); padding:14px; border:2px solid var(--strong); background:var(--raised); box-shadow:3px 3px 0 var(--rpg); animation:dialog-in 180ms var(--ease-out); transform-origin:center; }
    .dialog h2 { margin:0 0 8px; }
    .dialog p { margin:0 0 9px; color:var(--muted); font-size:.68rem; line-height:1.45; }
    .dialog strong { color:var(--text); }
    .dialog-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:13px; }
    .toast { position:absolute; z-index:90; right:10px; bottom:calc(72px + env(safe-area-inset-bottom)); left:10px; padding:10px 11px; border:1px solid var(--success); background:var(--raised); box-shadow:2px 2px 0 var(--rpg); color:var(--success); font-size:.67rem; font-weight:850; opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity 160ms ease,transform 160ms var(--ease-out); }
    .toast.is-visible { opacity:1; transform:translateY(0); }
    @keyframes sheet-in { from { opacity:0; transform:translateY(10%); } }
    @keyframes dialog-in { from { opacity:0; transform:scale(.97); } }

    @container food-proto (max-width:350px) {
      .system-state { display:none; }
      .local-chip { display:none; }
      .food-select { grid-template-columns:30px minmax(0,1fr); gap:6px; padding-left:6px; }
      .food-sprite { width:30px; min-width:30px; height:30px; }
      .food-custom-mask { width:22px; height:22px; }
      .food-actions { min-width:66px; }
      .quick-log, .edit-button { min-width:66px; padding-inline:4px; }
      .nutrition-fields { grid-template-columns:1fr; }
      .category-grid { grid-template-columns:1fr; }
      .featured-card { padding:9px; }
      .compact-list .food-row { grid-template-columns:minmax(0,1fr) 58px 44px; }
      .compact-list .quick-log { min-width:58px; padding-inline:3px; }
    }
    @media (max-width:560px) {
      .harness { padding-inline:0; }
      .harness-tools { padding-inline:4px; }
    }
    @media (hover:hover) and (pointer:fine) {
      .primary:hover { background:var(--primary-text); }
      .secondary:hover, .icon-button:hover, .quiet:hover { border-color:var(--primary); color:var(--primary-text); }
      .food-select:hover, .category-card:hover, .edit-button:hover, .search-clear:hover { background:var(--primary-muted); }
      .quick-log:hover { background:var(--primary-muted); }
      .custom-delete:hover { background:var(--danger-muted); }
    }
    @media (prefers-reduced-motion:reduce) {
      .primary, .secondary, .quiet, .quick-log, .edit-button, .food-select, .category-card, .disclosure, .danger, .search-clear, .icon-button, .bottom-nav button, .toast { transition-duration:0s; }
      .sheet, .dialog { animation:none; }
    }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body>
  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Direct</button>
    <button class="proto-picker-item">Focus</button>
    <button class="proto-picker-item">Compact</button>
  </nav>

  <main class="harness">
    <div class="harness-tools" aria-label="Prototype controls">
      <label>Width
        <select id="width">
          <option value="100%">Fluid</option>
          <option value="320px">320</option>
          <option value="340px">340</option>
          <option value="360px">360</option>
          <option value="375px">375</option>
          <option value="390px">390</option>
          <option value="412px">412</option>
          <option value="430px">430</option>
          <option value="480px">480</option>
        </select>
      </label>
      <label>Theme
        <select id="theme">
          <option value="spartans:dark">Spartan Dark</option>
          <option value="spartans:light">Spartan Light</option>
          <option value="amazonians:dark">Amazonian Dark</option>
          <option value="amazonians:light">Amazonian Light</option>
        </select>
      </label>
      <label>Meal
        <select id="meal">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="supper">Supper</option>
          <option value="dinner">Dinner</option>
        </select>
      </label>
    </div>
    <div id="stage"></div>
  </main>

  <script>
    const icons = {
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
      pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 20 4-1 11-11-3-3L5 16l-1 4Z"/><path d="m14 6 3 3"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 10v6M14 10v6"/></svg>',
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
      workout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg>',
      food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
      progress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21v-6"/><path d="M12 21V9"/><path d="M19 21V3"/></svg>',
      journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M15 2v20"/><path d="M15 7h5"/><path d="M15 12h5"/><path d="M15 17h5"/></svg>'
    };

    function categoryAssetUrl(path) {
      if (typeof window !== 'undefined' && window.location && window.location.protocol === 'file:') {
        return '../../public' + path;
      }
      return path;
    }
    const mealLabels = { breakfast:'Breakfast', lunch:'Lunch', supper:'Supper', dinner:'Dinner' };
    const mealArt = {
      breakfast: categoryAssetUrl('/food/meals/meal-breakfast.webp'),
      lunch: categoryAssetUrl('/food/meals/meal-lunch.webp'),
      supper: categoryAssetUrl('/food/meals/meal-supper.webp'),
      dinner: categoryAssetUrl('/food/meals/meal-dinner.webp')
    };
    const categories = [
      ['chicken','Chicken'],['eggs','Eggs'],['meat','Meat'],['fish-seafood','Fish & Seafood'],
      ['dairy','Dairy'],['grains-rice','Grains & Rice'],['flour-wheat','Flour & Wheat'],['fruits','Fruits'],
      ['vegetables','Vegetables'],['nuts-seeds','Nuts & Seeds'],['drinks','Drinks'],['supplements','Supplements'],
      ['desserts-snacks','Desserts / Snacks'],['processed-foods','Processed Foods'],['junk-food','Junk Food'],['other','Other']
    ];
    const colors = ['amber','coral','crimson','plum','violet','blue','teal','green','olive','slate'];
    const foods = [
      { id:'oats', name:'Homemade Overnight Oats with Blueberries and Almond Butter', category:'Grains & Rice', categoryId:'grains-rice', kcal:320, protein:14, carbs:49, fat:9, fiber:8, sugar:12, saturatedFat:2, sodium:180, recent:true, frequent:false },
      { id:'eggs', name:'Egg Whites', category:'Eggs', categoryId:'eggs', kcal:140, protein:26, carbs:2, fat:0, fiber:0, sugar:1, saturatedFat:0, sodium:410, recent:true, frequent:false },
      { id:'banana', name:'Banana', category:'Fruits', categoryId:'fruits', kcal:105, protein:1, carbs:27, fat:0, fiber:3, sugar:14, saturatedFat:0, sodium:1, recent:true, frequent:false },
      { id:'yogurt', name:'Greek Yogurt', category:'Dairy', categoryId:'dairy', kcal:160, protein:17, carbs:11, fat:4, fiber:0, sugar:8, saturatedFat:2, sodium:65, recent:false, frequent:true },
      { id:'shake', name:'Protein Shake', category:'Supplements', categoryId:'supplements', kcal:220, protein:30, carbs:18, fat:4, fiber:3, sugar:5, saturatedFat:1, sodium:190, recent:false, frequent:true },
      { id:'rice', name:'Brown Rice and Grilled Chicken', category:'Chicken', categoryId:'chicken', kcal:460, protein:38, carbs:54, fat:9, fiber:5, sugar:2, saturatedFat:2, sodium:520, recent:false, frequent:true }
    ];

    let current = 0;
    let screen = 'discovery';
    let meal = 'breakfast';
    let query = '';
    let moreOpen = false;
    let editorMode = 'create';
    let editorFood = null;
    let selectedCategory = { id:'other', name:'Other', color:'' };
    let customCategories = [{ id:'meal-prep', name:'Meal Prep', color:'teal' }, { id:'smoothies', name:'Smoothies', color:'violet' }];
    let categoryColor = 'amber';
    let categoryNameDraft = '';
    let dialogCategory = null;
    let errorState = {};
    let lastLogged = null;
    let toastTimer;

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, function(char) { return ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[char]; });
    }

    function topbar() {
      return '<header class="topbar"><span class="brand">FD</span><span class="brand-copy"><strong>FITDEX</strong><small>Nutrition System</small></span><span class="system-state">Local · Ready</span></header>';
    }

    function bottomNav() {
      const items = [['home','Home'],['workout','Workout'],['food','Food'],['progress','Progress'],['journal','Journal']];
      return '<nav class="app-nav bottom-nav" aria-label="Primary navigation">' + items.map(function(item) {
        const isActive = item[0] === 'food';
        return '<button type="button" class="nav-item' + (isActive ? ' is-active active' : '') + '" data-action="nav"' + (isActive ? ' aria-current="page"' : '') + '><span class="nav-icon" aria-hidden="true">' + icons[item[0]] + '</span><span>' + item[1] + '</span></button>';
      }).join('') + '</nav>';
    }

    function header(kicker, title, backLabel) {
      return '<header class="page-head"><div class="title-row"><button class="icon-button" type="button" data-action="back" aria-label="' + backLabel + '">' + icons.back + '</button><div class="title-copy"><p class="eyebrow">' + kicker + '</p><h1>' + title + '</h1></div></div></header>';
    }

    function mealContext(copy) {
      return '<section class="context-strip"><span class="meal-art"><img src="' + mealArt[meal] + '" alt="" /></span><span><strong>' + mealLabels[meal] + '</strong><small>' + copy + '</small></span><span class="local-chip">On device</span></section>';
    }

    function renderCategoryIcon(categoryId, label, color) {
      const isCustom = categoryId === 'other' || Boolean(color) || !categoryId;
      const safeLabel = escapeHtml(label || 'Food');
      if (isCustom) {
        const colorCss = color ? 'var(--food-custom-' + color + ')' : 'var(--color-metal, #737d79)';
        const iconPath = categoryAssetUrl('/food/categories/category-other.webp');
        const style = '--food-category-color:' + colorCss + '; --food-custom-icon:url(\'' + iconPath + '\');';
        return '<span class="food-sprite food-custom-sprite" style="' + style + '" data-color="' + escapeHtml(color || 'metal') + '" role="img" aria-label="' + safeLabel + ' category"><span class="food-custom-mask" aria-hidden="true"></span></span>';
      }
      const iconPath = categoryAssetUrl('/food/categories/category-' + categoryId + '.webp');
      return '<span class="food-sprite" role="img" aria-label="' + safeLabel + ' category"><img src="' + iconPath + '" alt="" onerror="this.style.display=\'none\'" /></span>';
    }

    function foodIcon(food) {
      return renderCategoryIcon(food.categoryId, food.category, food.color || food.categoryColor);
    }

    function foodMeta(food) {
      return escapeHtml(food.category) + ' · ' + food.kcal + ' kcal · ' + food.protein + 'g protein';
    }

    function searchBox() {
      return '<label class="search-box">' + icons.search + '<span class="sr-only">Search remembered local foods</span><input id="food-search" type="search" autocomplete="off" value="' + escapeHtml(query) + '" placeholder="Search your foods..." /><button class="search-clear" type="button" data-action="clear-search" aria-label="Clear search">' + icons.close + '</button></label><p class="local-note">Searches foods remembered on this device. No online food database.</p>';
    }

    function foodRow(food, compact) {
      if (compact) {
        return '<article class="food-row"><button class="food-select" type="button" data-action="edit-food" data-id="' + food.id + '">' + foodIcon(food) + '<span class="food-copy"><strong>' + escapeHtml(food.name) + '</strong><small>' + foodMeta(food) + '</small></span></button><button class="quick-log" type="button" data-action="quick-log" data-id="' + food.id + '">Quick Log</button><button class="edit-button" type="button" data-action="edit-food" data-id="' + food.id + '" aria-label="Edit details for ' + escapeHtml(food.name) + '">' + icons.pencil + '</button></article>';
      }
      return '<article class="food-row"><button class="food-select" type="button" data-action="edit-food" data-id="' + food.id + '">' + foodIcon(food) + '<span class="food-copy"><strong>' + escapeHtml(food.name) + '</strong><small>' + foodMeta(food) + '</small></span></button><span class="food-actions"><button class="quick-log" type="button" data-action="quick-log" data-id="' + food.id + '">Quick Log</button><button class="edit-button" type="button" data-action="edit-food" data-id="' + food.id + '">Edit</button></span></article>';
    }

    function group(title, list, compact) {
      if (!list.length) return '';
      return '<section class="food-group"><div class="section-head"><h2>' + title + '</h2><span>' + list.length + ' foods</span></div><div class="food-list ' + (compact ? 'compact-list' : '') + '">' + list.map(function(food) { return foodRow(food, compact); }).join('') + '</div></section>';
    }

    function matchingFoods() {
      const normalized = query.trim().toLowerCase();
      if (!normalized) return [];
      return foods.filter(function(food) { return food.name.toLowerCase().includes(normalized) || food.category.toLowerCase().includes(normalized); });
    }

    function searchState(compact) {
      const results = matchingFoods();
      if (results.length) return group('Matches', results, compact);
      const label = query.trim() || 'Food';
      return '<section class="empty-results"><h2>No Matches Found</h2><p>No remembered local foods match “' + escapeHtml(label) + '”.</p><button class="secondary" type="button" data-action="create-food">Create “' + escapeHtml(label) + '”</button></section>';
    }

    function directRows() {
      const recent = foods.filter(function(food) { return food.recent; });
      const frequent = foods.filter(function(food) { return food.frequent && !recent.some(function(item) { return item.id === food.id; }); });
      const body = query ? searchState(false) : '<div class="food-groups">' + group('Recent', recent, false) + group('Frequent', frequent, false) + '</div>';
      return discoveryShell(body, 'Actions stay visible. Quick Log uses saved nutrition unchanged.');
    }

    function focusCards() {
      const recent = foods.filter(function(food) { return food.recent; });
      const frequent = foods.filter(function(food) { return food.frequent && !recent.some(function(item) { return item.id === food.id; }); });
      if (query) return discoveryShell(searchState(false), 'Search results keep Quick Log and Edit visible.');
      const featured = recent[0];
      const feature = '<section class="food-group"><div class="section-head"><h2>Recent</h2><span>Last logged</span></div><article class="featured-card"><div class="featured-main">' + foodIcon(featured) + '<span class="food-copy"><strong>' + escapeHtml(featured.name) + '</strong><small>' + foodMeta(featured) + '</small></span></div><div class="featured-actions"><button class="quick-log" type="button" data-action="quick-log" data-id="' + featured.id + '">Quick Log to ' + mealLabels[meal] + '</button><button class="edit-button" type="button" data-action="edit-food" data-id="' + featured.id + '">Edit</button></div></article>' + (recent.length > 1 ? '<div class="food-list">' + recent.slice(1).map(function(food) { return foodRow(food, false); }).join('') + '</div>' : '') + '</section>';
      return discoveryShell('<div class="food-groups">' + feature + group('Frequent', frequent, false) + '</div>', 'Habitual food gets strongest action. Other foods remain compact.');
    }

    function compactIndex() {
      const recent = foods.filter(function(food) { return food.recent; });
      const frequent = foods.filter(function(food) { return food.frequent && !recent.some(function(item) { return item.id === food.id; }); });
      const body = query ? searchState(true) : '<div class="food-groups">' + group('Recent', recent, true) + group('Frequent', frequent, true) + '</div>';
      return discoveryShell(body, 'Dense index minimizes scrolling. Log stays one tap.');
    }

    function discoveryShell(body, note) {
      return '<main class="page">' + header('Add Food · Fri, 18 Sep', mealLabels[meal], 'Back to ' + mealLabels[meal]) + mealContext(note) + searchBox() + body + '<button class="primary" type="button" data-action="create-food">+ Create New Food</button></main>';
    }

    function editorValues() {
      if (editorFood) return editorFood;
      return { name:query.trim(), category:'Other', categoryId:'other', kcal:'', protein:'', carbs:'', fat:'', fiber:'', sugar:'', saturatedFat:'', sodium:'' };
    }

    function nutritionInput(key, label, unit, value) {
      const invalid = errorState.field === key;
      return '<label class="nutrition-input ' + (invalid ? 'is-invalid' : '') + '"><span>' + label + '</span><span class="nutrition-control"><input id="field-' + key + '" type="number" min="0" step="any" inputmode="decimal" value="' + escapeHtml(value ?? '') + '" data-field="' + key + '" /><i>' + unit + '</i></span>' + (invalid ? '<small class="field-error">' + escapeHtml(errorState.message) + '</small>' : '') + '</label>';
    }

    function editorPage() {
      const values = editorValues();
      const edit = editorMode === 'edit';
      const nameInvalid = errorState.field === 'name';
      const core = nutritionInput('kcal','Calories','kcal',values.kcal) + nutritionInput('protein','Protein','g',values.protein) + nutritionInput('carbs','Carbs','g',values.carbs) + nutritionInput('fat','Fat','g',values.fat);
      const secondary = nutritionInput('fiber','Fiber','g',values.fiber) + nutritionInput('sugar','Sugar','g',values.sugar) + nutritionInput('saturatedFat','Saturated Fat','g',values.saturatedFat) + nutritionInput('sodium','Sodium','mg',values.sodium);
      return '<main class="page">' + header(edit ? 'Edit current log entry' : 'Create and log food', edit ? 'Edit Food' : 'New Food', 'Back to Add Food') + mealContext(edit ? 'Changes apply only to this logged entry.' : 'New food will be added here and remembered locally.') + '<section class="form-panel"><label class="field ' + (nameInvalid ? 'is-invalid' : '') + '"><span>Food Name · Required</span><input id="field-name" value="' + escapeHtml(values.name || '') + '" data-field="name" autocomplete="off" />' + (nameInvalid ? '<small class="field-error">' + escapeHtml(errorState.message) + '</small>' : '') + '</label><div class="field"><span>Category · Required</span><button class="category-field" type="button" data-action="open-category">' + renderCategoryIcon(selectedCategory.id, selectedCategory.name, selectedCategory.color) + '<span><strong>' + escapeHtml(selectedCategory.name) + '</strong><small>Tap to select category</small></span>' + icons.chevron + '</button></div><fieldset class="nutrition-fields"><legend class="fieldset-title">Core Nutrition</legend>' + core + '</fieldset><button class="disclosure" type="button" data-action="toggle-more" aria-expanded="' + moreOpen + '"><span><strong>More Nutrition</strong><small>Fiber · Sugar · Sat Fat · Sodium</small></span><span aria-hidden="true">' + (moreOpen ? '−' : '+') + '</span></button>' + (moreOpen ? '<fieldset class="nutrition-fields"><legend class="fieldset-title">Secondary Nutrition</legend>' + secondary + '</fieldset>' : '') + (edit ? '<p class="editor-note">Saved remembered-food defaults stay unchanged. Only this ' + mealLabels[meal] + ' entry changes.</p>' : '') + (errorState.form ? '<p class="form-error" role="alert">' + escapeHtml(errorState.form) + '</p>' : '') + '<button class="primary" type="button" data-action="save-food">' + (edit ? 'Save Changes' : 'Add to ' + mealLabels[meal]) + '</button></section></main>';
    }

    function categorySheet() {
      const standard = categories.map(function(category) {
        const selected = selectedCategory.id === category[0] && !selectedCategory.color;
        return '<button class="category-card ' + (selected ? 'is-selected' : '') + '" type="button" data-action="select-category" data-id="' + category[0] + '" data-name="' + escapeHtml(category[1]) + '">' + renderCategoryIcon(category[0], category[1], '') + '<span>' + escapeHtml(category[1]) + '</span></button>';
      }).join('');
      const custom = customCategories.length ? customCategories.map(function(category) {
        return '<div class="custom-row"><button class="category-card ' + (selectedCategory.id === category.id ? 'is-selected' : '') + '" type="button" data-action="select-custom" data-id="' + category.id + '">' + renderCategoryIcon('other', category.name, category.color) + '<span>' + escapeHtml(category.name) + '</span></button><button class="custom-delete" type="button" data-action="delete-category" data-id="' + category.id + '" aria-label="Delete ' + escapeHtml(category.name) + '">' + icons.trash + '</button></div>';
      }).join('') : '<p class="local-note">No custom categories.</p>';
      return '<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="category-title"><header class="sheet-head"><button class="icon-button" type="button" data-action="back" aria-label="Back to Food Editor">' + icons.back + '</button><h2 id="category-title">Select Category</h2><span class="close-spacer"></span></header><div class="sheet-scroll"><section class="category-section"><p class="eyebrow">Standard Categories</p><div class="category-grid">' + standard + '</div></section><section class="category-section"><p class="eyebrow">Custom Categories</p><div>' + custom + '</div></section><button class="primary" type="button" data-action="create-category">+ Create Category</button></div></section></div>';
    }

    function createCategorySheet() {
      const swatches = colors.map(function(color) { return '<button class="color-swatch ' + (categoryColor === color ? 'is-selected' : '') + '" type="button" data-action="pick-color" data-color="' + color + '" aria-label="Select ' + color + ' color" aria-pressed="' + (categoryColor === color) + '"><i style="--swatch:var(--food-custom-' + color + ')"></i></button>'; }).join('');
      const previewName = categoryNameDraft.trim() || 'Custom Category';
      return '<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="create-category-title"><header class="sheet-head"><button class="icon-button" type="button" data-action="back" aria-label="Back to categories">' + icons.back + '</button><h2 id="create-category-title">Create Category</h2><span class="close-spacer"></span></header><div class="sheet-scroll"><div class="create-category-form"><label class="field ' + (errorState.field === 'categoryName' ? 'is-invalid' : '') + '"><span>Category Name · Required</span><input id="category-name" value="' + escapeHtml(categoryNameDraft) + '" autocomplete="off" />' + (errorState.field === 'categoryName' ? '<small class="field-error">Category name is required.</small>' : '') + '</label><section class="category-preview custom-category-preview" aria-live="polite">' + renderCategoryIcon('other', previewName, categoryColor) + '<div><span class="eyebrow">Live icon preview</span><strong>' + escapeHtml(previewName) + '</strong><small>' + categoryColor + ' accent</small></div></section><fieldset><legend class="fieldset-title">Color · 10 production accents</legend><div class="color-grid">' + swatches + '</div></fieldset><button class="primary" type="button" data-action="confirm-create-category">Create Category</button><button class="secondary" type="button" data-action="back">Cancel</button></div></div></section></div>';
    }

    function deleteDialog() {
      if (!dialogCategory) return '';
      return '<div class="dialog-wrap"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-category-title"><p class="eyebrow">Custom category</p><h2 id="delete-category-title">Delete Category?</h2><p><strong>“' + escapeHtml(dialogCategory.name) + '”</strong> will be removed.</p><p>Remembered foods in this category will also be removed. Historical food logs remain and become Uncategorized.</p><div class="dialog-actions"><button class="secondary" type="button" data-action="cancel-delete">Cancel</button><button class="danger" type="button" data-action="confirm-delete">Delete</button></div></section></div>';
    }

    function mealDetail() {
      const logged = lastLogged || foods[0];
      const entries = lastLogged ? [logged, foods[1], foods[2]] : [foods[1], foods[2]];
      const totalKcal = entries.reduce(function(sum, food) { return sum + Number(food.kcal || 0); }, 0);
      const totalProtein = entries.reduce(function(sum, food) { return sum + Number(food.protein || 0); }, 0);
      return '<main class="page">' + header('Fri, 18 Sep · Meal Detail', mealLabels[meal], 'Back to Food') + (lastLogged ? '<section class="success-panel" role="status"><strong>' + escapeHtml(logged.name) + ' added to ' + mealLabels[meal] + '</strong><span>Stored nutrition snapshot logged unchanged.</span></section>' : '') + '<section class="meal-total"><div><span>Calories</span><strong>' + totalKcal + ' kcal</strong></div><div><span>Protein</span><strong>' + totalProtein + ' g</strong></div></section><section class="entry-list" aria-label="' + mealLabels[meal] + ' entries">' + entries.map(function(food) { return '<article class="entry-row">' + foodIcon(food) + '<span class="food-copy"><strong>' + escapeHtml(food.name) + '</strong><small>' + foodMeta(food) + '</small></span></article>'; }).join('') + '</section><button class="primary" type="button" data-action="return-discovery">+ Add Food</button></main>';
    }

    const variants = [directRows, focusCards, compactIndex];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function appContent() {
      if (screen === 'meal') return mealDetail();
      if (screen === 'editor' || screen === 'category' || screen === 'category-create') return editorPage();
      return variants[current]();
    }

    function renderLayer() {
      if (screen === 'category') return categorySheet() + deleteDialog();
      if (screen === 'category-create') return createCategorySheet();
      return deleteDialog();
    }

    function appShell() {
      return '<section class="app-shell">' + topbar() + '<div class="screen-scroll">' + appContent() + '</div>' + bottomNav() + '<div class="layer" id="layer">' + renderLayer() + '</div><div class="toast" id="toast" aria-live="polite"></div></section>';
    }

    function applyWidth() {
      const shell = document.querySelector('.app-shell');
      if (shell) shell.style.setProperty('--preview-width', document.getElementById('width').value);
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = appShell(); applyWidth(); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      screen = 'discovery';
      query = '';
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    function render(options) {
      stage.innerHTML = appShell();
      applyWidth();
      if (options && options.focusSearch) {
        const input = document.getElementById('food-search');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
      if (options && options.focusCategoryName) {
        const input = document.getElementById('category-name');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }

    function notice(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('is-visible'); }, 1700);
    }

    function resetEditor(mode, food) {
      editorMode = mode;
      editorFood = food ? { ...food } : null;
      selectedCategory = food ? { id:food.categoryId, name:food.category, color:food.color || food.categoryColor || '' } : { id:'other', name:'Other', color:'' };
      moreOpen = Boolean(food && [food.fiber,food.sugar,food.saturatedFat,food.sodium].some(function(value) { return value !== undefined; }));
      errorState = {};
      screen = 'editor';
    }

    function syncEditorField(target) {
      if (!target.dataset.field) return;
      if (!editorFood) editorFood = editorValues();
      editorFood[target.dataset.field] = target.value;
    }

    function validateAndSave() {
      const values = editorValues();
      const name = String(values.name || '').trim();
      if (!name) { errorState = { field:'name', message:'Food name is required.', form:'Fix highlighted field before saving.' }; render(); return; }
      const numericFields = ['kcal','protein','carbs','fat','fiber','sugar','saturatedFat','sodium'];
      for (const key of numericFields) {
        const value = values[key];
        if (value !== '' && value !== undefined && Number(value) < 0) { errorState = { field:key, message:(key === 'kcal' ? 'Calories' : key.charAt(0).toUpperCase() + key.slice(1)) + ' cannot be negative.', form:'Nutrition values must be non-negative.' }; render(); return; }
      }
      errorState = {};
      lastLogged = { ...values, id:'new-log', name:name, category:selectedCategory.name, categoryId:selectedCategory.id, color:selectedCategory.color, categoryColor:selectedCategory.color, kcal:Number(values.kcal || 0), protein:Number(values.protein || 0) };
      screen = 'meal';
      render();
    }

    function handleBack() {
      if (dialogCategory) { dialogCategory = null; render(); return; }
      if (screen === 'category-create') { screen = 'category'; errorState = {}; render(); return; }
      if (screen === 'category') { screen = 'editor'; render(); return; }
      if (screen === 'editor') { screen = 'discovery'; errorState = {}; render(); return; }
      if (screen === 'discovery') { screen = 'meal'; lastLogged = null; render(); return; }
      if (screen === 'meal') { screen = 'discovery'; render(); }
    }

    document.getElementById('width').addEventListener('change', applyWidth);
    document.getElementById('theme').addEventListener('change', function(event) {
      const parts = event.target.value.split(':');
      document.documentElement.setAttribute('data-theme-family', parts[0]);
      document.documentElement.setAttribute('data-brightness', parts[1]);
    });
    document.getElementById('meal').addEventListener('change', function(event) { meal = event.target.value; screen = 'discovery'; lastLogged = null; render(); });

    document.addEventListener('input', function(event) {
      if (event.target.id === 'food-search') { query = event.target.value; render({ focusSearch:true }); return; }
      if (event.target.id === 'category-name') { categoryNameDraft = event.target.value; render({ focusCategoryName:true }); return; }
      syncEditorField(event.target);
    });

    document.addEventListener('click', function(event) {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'back') handleBack();
      else if (action === 'clear-search') { query = ''; render({ focusSearch:true }); }
      else if (action === 'quick-log') { lastLogged = foods.find(function(food) { return food.id === target.dataset.id; }); screen = 'meal'; render(); }
      else if (action === 'edit-food') { resetEditor('edit', foods.find(function(food) { return food.id === target.dataset.id; })); render(); }
      else if (action === 'create-food') { resetEditor('create', null); render(); }
      else if (action === 'toggle-more') { moreOpen = !moreOpen; render(); }
      else if (action === 'open-category') { screen = 'category'; render(); }
      else if (action === 'select-category') { selectedCategory = { id:target.dataset.id, name:target.dataset.name, color:'' }; screen = 'editor'; render(); }
      else if (action === 'select-custom') { const chosen = customCategories.find(function(category) { return category.id === target.dataset.id; }); if (chosen) selectedCategory = { ...chosen }; screen = 'editor'; render(); }
      else if (action === 'create-category') { screen = 'category-create'; categoryNameDraft = ''; categoryColor = 'amber'; errorState = {}; render(); }
      else if (action === 'pick-color') { categoryColor = target.dataset.color; render(); }
      else if (action === 'confirm-create-category') {
        const name = categoryNameDraft.trim();
        if (!name) { errorState = { field:'categoryName' }; render({ focusCategoryName:true }); return; }
        const created = { id:'custom-' + Date.now(), name:name, color:categoryColor };
        customCategories.push(created); selectedCategory = { ...created }; screen = 'editor'; errorState = {}; render(); requestAnimationFrame(function() { notice(name + ' category created'); });
      }
      else if (action === 'delete-category') { dialogCategory = customCategories.find(function(category) { return category.id === target.dataset.id; }) || null; render(); }
      else if (action === 'cancel-delete') { dialogCategory = null; render(); }
      else if (action === 'confirm-delete') {
        const removed = dialogCategory; customCategories = customCategories.filter(function(category) { return category.id !== removed.id; });
        if (selectedCategory.id === removed.id) selectedCategory = { id:'other', name:'Other', color:'' };
        dialogCategory = null; render(); requestAnimationFrame(function() { notice(removed.name + ' deleted · history kept as Uncategorized'); });
      }
      else if (action === 'save-food') validateAndSave();
      else if (action === 'return-discovery') { screen = 'discovery'; lastLogged = null; render(); }
      else if (action === 'nav') notice('Prototype navigation stays in Food');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { handleBack(); return; }
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
