<!doctype html>
<html lang="en" data-theme-family="spartans" data-brightness="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>FitDex Phase 5 — Journal Prototype</title>
  <style>
    :root {
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Arial Narrow", "Roboto Condensed", Impact, ui-sans-serif, system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --bg: #f0e6d6; --app: #f4ebdd; --surface: #eae2d5; --raised: #f8efe2; --subtle: #ddd9ce;
      --border: #979b92; --strong: #6f7771; --text: #2e3230; --muted: #656b67;
      --primary: #1f8582; --primary-strong: #176864; --primary-text: #176864; --primary-muted: #d1ded9;
      --warm: #b67e26; --xp: #bd862c; --success: #53794f; --danger: #a74343; --shadow: rgba(47,51,48,.16); --overlay: rgba(18,20,19,.76); --on-primary: #fff;
      color: var(--text); background: var(--bg); font-family: var(--font-body); -webkit-font-smoothing: antialiased;
    }
    :root[data-theme-family="spartans"][data-brightness="dark"] {
      --bg: #121616; --app: #181d1d; --surface: #1f2524; --raised: #282f2e; --subtle: #303635;
      --border: #606a66; --strong: #7e8984; --text: #e8e8e2; --muted: #a7aeaa;
      --primary: #2e9895; --primary-strong: #14706f; --primary-text: #58b4af; --primary-muted: #213331;
      --warm: #b77f2f; --xp: #cb9435; --success: #6f9565; --danger: #d66a66; --shadow: rgba(0,0,0,.24); --overlay: rgba(5,8,8,.82); --on-primary: #101716;
    }
    :root[data-theme-family="amazonians"][data-brightness="light"] {
      --bg: #f0e4d4; --app: #f4e9db; --surface: #ebe1d8; --raised: #f7ede0; --subtle: #ddd0d1;
      --border: #9f898e; --strong: #806c73; --text: #352b31; --muted: #746a6e;
      --primary: #785178; --primary-strong: #654061; --primary-text: #654061; --primary-muted: #e2d3dc;
      --warm: #b96f49; --xp: #c99032; --success: #647b58; --danger: #a44449; --shadow: rgba(62,45,54,.16); --overlay: rgba(31,22,27,.77); --on-primary: #fff;
    }
    :root[data-theme-family="amazonians"][data-brightness="dark"] {
      --bg: #1f171e; --app: #281c27; --surface: #31232f; --raised: #3a2937; --subtle: #44323f;
      --border: #79616f; --strong: #967887; --text: #eee5df; --muted: #b2a3aa;
      --primary: #906390; --primary-strong: #71446f; --primary-text: #bd91b7; --primary-muted: #493246;
      --warm: #bc7247; --xp: #d0a03f; --success: #7d936d; --danger: #d86f74; --shadow: rgba(0,0,0,.25); --overlay: rgba(12,7,11,.82); --on-primary: #21151f;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 0; min-height: 100%; margin: 0; }
    body { min-height: 100dvh; overflow-x: hidden; background: var(--bg); }
    button, select { color: inherit; font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    h1, h2, h3, p, strong, small { overflow-wrap: anywhere; }

    .harness { min-height: 100dvh; padding: 68px 8px 18px; }
    .harness-tools { display: flex; width: min(100%, 780px); min-width: 0; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 auto 10px; }
    .harness-tools label { display: inline-flex; min-height: 36px; align-items: center; gap: 5px; padding: 3px 7px; border: 1px solid var(--border); background: var(--raised); color: var(--muted); font-family: var(--font-mono); font-size: .58rem; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }
    .harness-tools select { height: 28px; border: 0; background: var(--surface); font-size: .68rem; }
    #stage { display: flex; min-width: 0; justify-content: center; }

    .app-shell { position: relative; display: grid; width: min(100%, var(--preview-width, 100%)); max-width: 480px; height: clamp(590px, calc(100dvh - 132px), 860px); min-width: 0; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; border: 1px solid var(--strong); background: var(--app); box-shadow: 0 12px 38px var(--shadow), 3px 3px 0 var(--strong); container: journal-proto / inline-size; }
    .topbar { display: flex; min-width: 0; min-height: calc(52px + env(safe-area-inset-top)); align-items: flex-end; gap: 9px; padding: calc(7px + env(safe-area-inset-top)) 12px 7px; border-bottom: 1px solid var(--strong); background: var(--raised); }
    .wordmark { display: inline-flex; min-width: 0; min-height: 38px; align-items: center; gap: 7px; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .wordmark img { display: block; width: 38px; height: 38px; object-fit: contain; }
    .wordmark strong { font-family: var(--font-display); font-size: 1rem; letter-spacing: .05em; text-transform: uppercase; }
    .settings { display: grid; width: 42px; min-width: 42px; height: 42px; place-items: center; margin-left: auto; padding: 0; border: 1px solid var(--border); background: var(--surface); color: var(--primary-text); cursor: pointer; }
    .screen-scroll { min-width: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
    .page { display: grid; min-width: 0; gap: 11px; padding: 14px clamp(9px, 3cqi, 14px) 28px; }
    .page-header { display: flex; min-width: 0; align-items: flex-start; justify-content: space-between; gap: 9px; }
    .page-header > div { min-width: 0; }
    .page-header h1, .subheader h1 { margin: 2px 0 4px; font-family: var(--font-display); font-size: clamp(1.65rem, 9cqi, 2.25rem); line-height: .98; text-transform: uppercase; }
    .page-header p:last-child, .subheader p:last-child { margin: 0; color: var(--muted); font-size: .68rem; line-height: 1.4; }
    .eyebrow { margin: 0; color: var(--primary-text); font-family: var(--font-mono); font-size: .56rem; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; }
    .icon-button, .back-button { display: grid; width: 44px; min-width: 44px; height: 44px; place-items: center; padding: 0; border: 1px solid var(--border); background: var(--surface); color: var(--primary-text); cursor: pointer; }
    .icon-button:active, .back-button:active, .action:active, .date-step:active, .row-button:active, .nav-item:active { transform: scale(.97); }

    svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .panel { position: relative; display: grid; min-width: 0; gap: 10px; padding: clamp(10px, 3cqi, 14px); border: 1px solid var(--border); background: var(--raised); box-shadow: 2px 2px 0 var(--shadow); }
    .panel::before { position: absolute; top: -1px; left: 12px; width: 30px; height: 3px; background: var(--warm); content: ""; }
    .panel h2 { margin: 0; font-family: var(--font-display); font-size: 1rem; text-transform: uppercase; }
    .panel p { margin: 0; }

    .date-header { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 6px; padding: 8px; border: 1px solid var(--strong); background: var(--raised); }
    .date-step { display: grid; width: 44px; height: 44px; place-items: center; padding: 0; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
    .date-copy { display: grid; min-width: 0; justify-items: center; gap: 2px; text-align: center; }
    .date-copy strong { font-family: var(--font-display); font-size: .86rem; text-transform: uppercase; }
    .date-copy small { color: var(--primary-text); font-size: .58rem; font-weight: 900; text-transform: uppercase; }

    .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .summary-stat { display: grid; min-width: 0; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 7px; padding: 9px; border: 1px solid var(--border); background: var(--subtle); }
    .summary-stat > svg { width: 20px; color: var(--primary-text); }
    .summary-stat span { display: grid; min-width: 0; gap: 1px; }
    .summary-stat strong { font-size: .74rem; line-height: 1.2; overflow-wrap: anywhere; }
    .summary-stat small { color: var(--muted); font-size: .56rem; overflow-wrap: anywhere; }

    .action { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--strong); background: var(--surface); font-size: .64rem; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: transform 140ms cubic-bezier(.23,1,.32,1), background-color 140ms ease; }
    .action.primary { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
    .action.danger { color: var(--danger); border-color: var(--danger); }

    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .section-title span { color: var(--muted); font-size: .58rem; font-weight: 800; }
    .activity-list { display: grid; min-width: 0; margin: 0; padding: 0; border: 1px solid var(--border); list-style: none; }
    .activity-row { display: grid; min-width: 0; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px; border-bottom: 1px solid var(--border); background: var(--subtle); }
    .activity-row:last-child { border-bottom: 0; }
    .mark { display: grid; width: 36px; height: 36px; place-items: center; overflow: hidden; border: 1px solid var(--border); background: var(--primary-muted); color: var(--primary-text); flex-shrink: 0; }
    .mark.warm { background: color-mix(in srgb, var(--warm) 16%, var(--surface)); color: var(--warm); }
    .mark svg { width: 19px; height: 19px; }
    .mark img { width: 28px; height: 28px; object-fit: contain; }
    .activity-row > span { display: grid; min-width: 0; gap: 2px; }
    .activity-row strong { font-size: .68rem; line-height: 1.2; word-break: break-word; }
    .activity-row small { color: var(--muted); font-size: .56rem; line-height: 1.25; }
    .activity-row b { font-size: .62rem; text-align: right; white-space: nowrap; color: var(--text); }
    .row-button { display: grid; width: 40px; height: 40px; place-items: center; padding: 0; border: 0; background: transparent; color: var(--primary-text); cursor: pointer; }
    .row-button svg { width: 18px; height: 18px; }

    .meal-stack { display: grid; gap: 7px; }
    .meal-card { display: grid; gap: 8px; border-left: 3px solid var(--warm); }
    .meal-head { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .meal-head img { width: 38px; height: 38px; object-fit: contain; }
    .meal-head span { display: grid; gap: 2px; min-width: 0; }
    .meal-head strong { font-family: var(--font-display); font-size: .82rem; text-transform: uppercase; word-break: break-word; }
    .meal-head small { color: var(--muted); font-size: .56rem; }
    .meal-total { color: var(--muted); font-size: .62rem; white-space: nowrap; }
    .food-list { display: grid; min-width: 0; margin: 0; padding: 0; border: 1px solid var(--border); list-style: none; }
    .food-list li { display: grid; min-width: 0; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--border); background: var(--subtle); }
    .food-list li:last-child { border-bottom: 0; }
    .food-mark { display: grid; width: 28px; height: 28px; place-items: center; overflow: hidden; border: 1px solid var(--border); background: var(--primary-muted); flex-shrink: 0; }
    .food-mark img { width: 24px; height: 24px; object-fit: contain; }
    .food-list span { display: grid; min-width: 0; gap: 2px; }
    .food-list strong { font-size: .68rem; line-height: 1.2; word-break: break-word; }
    .food-list small { color: var(--muted); font-size: .56rem; }

    .quick-hero { border-left: 4px solid var(--primary); }
    .quick-signal { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; }
    .quick-signal strong { font-family: var(--font-display); font-size: clamp(1.4rem, 8cqi, 1.9rem); line-height: 1; text-transform: uppercase; }
    .quick-signal span { color: var(--primary-text); font-family: var(--font-mono); font-size: .62rem; font-weight: 900; text-align: right; text-transform: uppercase; }
    .empty-inline { padding: 14px 10px; border: 1px dashed var(--border); background: var(--subtle); color: var(--muted); font-size: .68rem; text-align: center; }

    .daily-identity { display: grid; justify-items: center; gap: 3px; padding: 13px; border-block: 3px solid var(--primary); background: var(--raised); text-align: center; }
    .daily-identity strong { font-family: var(--font-display); font-size: 1.35rem; text-transform: uppercase; }
    .daily-identity p { margin: 0; color: var(--muted); font-size: .65rem; }
    .daily-identity .date-actions { display: grid; width: 100%; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 6px; }
    .daily-identity .date-actions span { font-size: .62rem; font-weight: 900; text-transform: uppercase; }

    /* V3 Field Notes Ledger */
    .ledger-hero { border-top: 4px solid var(--warm); background: linear-gradient(145deg, color-mix(in srgb, var(--warm) 10%, var(--raised)), var(--raised)); }
    .ledger-head { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 10px; }
    .log-mark { display: grid; width: 52px; height: 58px; place-items: center; clip-path: polygon(50% 0, 94% 20%, 86% 78%, 50% 100%, 14% 78%, 6% 20%); background: var(--primary-muted); color: var(--primary-text); }
    .ledger-head h2 { color: var(--warm); font-size: 1.2rem; }
    .ledger-head p { color: var(--muted); font-size: .62rem; }

    .ledger { display: grid; min-width: 0; margin: 0; padding: 0; border: 1px solid var(--border); list-style: none; background: var(--raised); }
    .ledger-entry { display: grid; min-width: 0; border-bottom: 1px solid var(--border); background: var(--surface); }
    .ledger-entry:last-child { border-bottom: 0; }
    .ledger-row-main { display: grid; width: 100%; min-width: 0; min-height: 58px; grid-template-columns: 36px minmax(0, 1fr) 32px; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
    .ledger-row-main:hover { background: color-mix(in srgb, var(--primary-muted) 40%, transparent); }
    .ledger-copy { display: grid; min-width: 0; gap: 3px; }
    .ledger-title { display: block; font-family: var(--font-display); font-size: .84rem; letter-spacing: .04em; text-transform: uppercase; color: var(--text); overflow-wrap: anywhere; word-break: break-word; line-height: 1.15; }
    .ledger-meta { display: block; color: var(--muted); font-size: .62rem; line-height: 1.25; overflow-wrap: anywhere; }
    .ledger-nav, .ledger-disclosure { display: grid; width: 32px; height: 32px; place-items: center; color: var(--primary-text); }
    .ledger-nav svg, .ledger-disclosure svg { width: 18px; height: 18px; }

    .ledger-detail { padding: 0 10px 10px 46px; background: var(--surface); }
    .ledger-detail .food-list { display: grid; gap: 4px; margin: 0; padding: 8px; border: 1px solid var(--border); background: var(--raised); list-style: none; }
    .ledger-detail .food-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); background: transparent; }
    .ledger-detail .food-list li:last-child { border-bottom: 0; }
    .ledger-detail .food-mark { width: 26px; height: 26px; }
    .ledger-detail .food-mark img { width: 22px; height: 22px; }

    .empty { min-height: 150px; place-items: center; align-content: center; text-align: center; }
    .empty-glyph { display: grid; width: 48px; height: 48px; place-items: center; border: 1px solid var(--border); background: var(--subtle); color: var(--primary-text); font-size: 1.25rem; }
    .empty p { color: var(--muted); font-size: .7rem; }

    .subheader { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 9px; align-items: start; }
    .detail-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .detail-summary span { display: grid; gap: 2px; padding: 8px; border: 1px solid var(--border); background: var(--subtle); }
    .detail-summary strong { font-family: var(--font-display); font-size: .82rem; }
    .detail-summary small { color: var(--muted); font-size: .52rem; text-transform: uppercase; }
    .set-list { display: grid; gap: 5px; }
    .set-row { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 6px; padding: 7px; border: 1px solid var(--border); background: var(--subtle); font-size: .61rem; }
    .set-row small { grid-column: 1 / -1; color: var(--success); font-weight: 800; }

    .app-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); min-height: calc(64px + env(safe-area-inset-bottom)); padding: 2px 4px env(safe-area-inset-bottom); border-top: 1px solid var(--strong); background: color-mix(in srgb, var(--app) 96%, transparent); }
    .nav-item { position: relative; display: grid; min-width: 0; min-height: 60px; place-items: center; align-content: center; gap: 2px; padding: 6px 2px; border: 0; background: transparent; color: var(--muted); font-size: .55rem; cursor: pointer; }
    .nav-item svg { width: 21px; height: 21px; }
    .nav-item.is-active { color: var(--primary-text); }
    .nav-item.is-active::before { position: absolute; top: 1px; left: 50%; width: 24px; height: 3px; background: var(--primary); content: ""; transform: translateX(-50%); }

    .backdrop { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 14px; background: var(--overlay); }
    .dialog { display: grid; width: min(100%, 390px); max-height: calc(100% - 16px); gap: 11px; padding: 15px; overflow: auto; border: 2px solid var(--strong); background: var(--raised); box-shadow: 4px 4px 0 var(--shadow); }
    .dialog h2 { margin: 0; font-family: var(--font-display); font-size: 1.35rem; text-transform: uppercase; }
    .dialog p { margin: 0; font-size: .78rem; line-height: 1.5; }
    .dialog-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .toast { position: absolute; right: 10px; bottom: 76px; left: 10px; z-index: 30; padding: 10px; border: 1px solid var(--success); background: var(--raised); color: var(--success); font-size: .7rem; font-weight: 800; animation: toast-in 180ms cubic-bezier(.23,1,.32,1); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { .toast { animation: none; } .action, .icon-button, .row-button { transition: none; } }

    @container journal-proto (max-width: 350px) {
      .summary-grid { grid-template-columns: 1fr; }
      .detail-summary { grid-template-columns: 1fr; }
      .activity-row { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 6px; }
      .date-copy strong { font-size: .75rem; }
      .quick-signal { grid-template-columns: 1fr; }
      .quick-signal span { text-align: left; }
      .ledger-row-main { grid-template-columns: 32px minmax(0, 1fr) 28px; gap: 7px; padding: 8px 6px; }
      .ledger-detail { padding-left: 20px; }
    }

    .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10,10,10,.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.24), 0 2px 6px rgba(0,0,0,.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255,255,255,.12); will-change: transform; }
    .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(.23,1,.32,1), width 250ms cubic-bezier(.23,1,.32,1); }
    @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
    .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
    .proto-picker-item:hover { color: rgba(255,255,255,.85); }
    .proto-picker-item:active { transform: scale(.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255,255,255,.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  </style>
</head>
<body>
  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quick Capture</button>
    <button class="proto-picker-item">Daily Log</button>
    <button class="proto-picker-item">Field Notes</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <main class="harness">
    <div class="harness-tools" aria-label="Prototype controls">
      <label>Theme <select id="theme"><option value="spartans-dark">Spartan Dark</option><option value="spartans-light">Spartan Light</option><option value="amazonians-dark">Amazonian Dark</option><option value="amazonians-light">Amazonian Light</option></select></label>
      <label>Width <select id="width"><option value="100%">Fluid</option><option value="320px">320</option><option value="340px">340</option><option value="360px">360</option><option value="375px">375</option><option value="390px">390</option><option value="412px">412</option><option value="430px">430</option><option value="480px">480</option></select></label>
      <label>State <select id="data-state"><option value="history">Mixed history</option><option value="workout">Workout only</option><option value="food">Food only</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error</option></select></label>
    </div>
    <div id="stage"></div>
  </main>
  <script>
    const svg = (body) => `<svg viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
    const icon = {
      settings: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l-2.8 2.8a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6h-4a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-2.8-2.8a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2v-4h1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l2.8-2.8a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2h4v1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l2.8 2.8a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h1v4h-1a1.7 1.7 0 0 0-1.6 1Z"/>'),
      help: svg('<circle cx="12" cy="12" r="10"/><path d="M9.2 9a3 3 0 1 1 5.7 1c0 2-3 2-3 4M12 18h.01"/>'),
      left: svg('<path d="m15 18-6-6 6-6"/>'),
      right: svg('<path d="m9 18 6-6-6-6"/>'),
      chevronDown: svg('<path d="m6 9 6 6 6-6"/>'),
      chevronUp: svg('<path d="m18 15-6-6-6 6"/>'),
      chevronRight: svg('<path d="m9 18 6-6-6-6"/>'),
      calendar: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'),
      workout: svg('<path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/>'),
      food: svg('<path d="M7 3v8M4 3v5c0 2 3 2 3 4v9M10 3v5c0 2-3 2-3 4M17 3v18M17 3c3 2 4 5 4 8h-4"/>'),
      book: svg('<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M15 2v20M7 7h4M7 12h4M7 17h4"/>'),
      trash: svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/>'),
      home: svg('<path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/>'),
      chart: svg('<path d="M3 3v18h18M7 16l4-5 3 3 5-7"/>')
    };

    function getMealIconSrc(meal) {
      const prefix = location.protocol === 'file:' ? '../../public' : '';
      return `${prefix}/food/meals/meal-${meal}.webp`;
    }

    function getCategoryIconSrc(cat) {
      const prefix = location.protocol === 'file:' ? '../../public' : '';
      return `${prefix}/food/categories/category-${cat}.webp`;
    }

    // Coherent demo fixture models
    const demoWorkout = {
      id: 'workout-1',
      name: 'Upper Body Strength',
      completedAt: '18 Sep 2026, 7:42 pm',
      durationSeconds: 3120, // 52 min session duration
      notes: 'Controlled tempo. Left shoulder felt stable.',
      exercises: [
        {
          id: 'ex-1',
          name: 'Barbell Bench Press',
          sets: [
            { id: 's1', setNumber: 1, weight: 80, reps: 8, logged: true },
            { id: 's2', setNumber: 2, weight: 80, reps: 8, logged: true },
            { id: 's3', setNumber: 3, weight: 80, reps: 7, logged: true }
          ]
        },
        {
          id: 'ex-2',
          name: 'Incline Dumbbell Press',
          sets: [
            { id: 's4', setNumber: 1, weight: 28, reps: 10, logged: true },
            { id: 's5', setNumber: 2, weight: 28, reps: 10, logged: true },
            { id: 's6', setNumber: 3, weight: 28, reps: 9, logged: true }
          ]
        },
        {
          id: 'ex-3',
          name: 'Bent Over Barbell Row',
          sets: [
            { id: 's7', setNumber: 1, weight: 70, reps: 10, logged: true },
            { id: 's8', setNumber: 2, weight: 70, reps: 10, logged: true },
            { id: 's9', setNumber: 3, weight: 70, reps: 8, logged: true }
          ]
        },
        {
          id: 'ex-4',
          name: 'Overhead Press',
          sets: [
            { id: 's10', setNumber: 1, weight: 45, reps: 8, logged: true },
            { id: 's11', setNumber: 2, weight: 45, reps: 8, logged: true },
            { id: 's12', setNumber: 3, weight: 45, reps: 7, logged: true }
          ]
        },
        {
          id: 'ex-5',
          name: 'Barbell Bicep Curl',
          sets: [
            { id: 's13', setNumber: 1, weight: 30, reps: 12, logged: true },
            { id: 's14', setNumber: 2, weight: 30, reps: 11, logged: true },
            { id: 's15', setNumber: 3, weight: 30, reps: 10, logged: true }
          ]
        },
        {
          id: 'ex-6',
          name: 'Tricep Rope Pushdown',
          sets: [
            { id: 's16', setNumber: 1, weight: 25, reps: 12, logged: true },
            { id: 's17', setNumber: 2, weight: 25, reps: 12, logged: true },
            { id: 's18', setNumber: 3, weight: 25, reps: 10, logged: true }
          ]
        }
      ]
    };

    const demoFoodEntries = [
      // Breakfast (2 items: 420 kcal, 28g protein)
      { id: 'f1', meal: 'breakfast', name: 'Eggs', categoryId: 'eggs', categoryName: 'Eggs', kcal: 315, protein: 27 },
      { id: 'f2', meal: 'breakfast', name: 'Banana', categoryId: 'fruits', categoryName: 'Fruits', kcal: 105, protein: 1 },
      // Lunch (2 items: 710 kcal, 52g protein)
      { id: 'f3', meal: 'lunch', name: 'Chicken rice bowl', categoryId: 'chicken', categoryName: 'Chicken', kcal: 560, protein: 44 },
      { id: 'f4', meal: 'lunch', name: 'Mixed vegetables', categoryId: 'vegetables', categoryName: 'Vegetables', kcal: 150, protein: 8 },
      // Supper (1 item: 180 kcal, 24g protein)
      { id: 'f5', meal: 'supper', name: 'Homemade shake', categoryId: 'other', categoryName: 'Uncategorized', isUncategorized: true, kcal: 180, protein: 24 },
      // Dinner (2 items: 630 kcal, 39g protein)
      { id: 'f6', meal: 'dinner', name: 'Grilled salmon', categoryId: 'fish-seafood', categoryName: 'Fish & Seafood', kcal: 430, protein: 34 },
      { id: 'f7', meal: 'dinner', name: 'Brown rice', categoryId: 'grains-rice', categoryName: 'Grains & Rice', kcal: 200, protein: 5 }
    ];

    let current = 0, dateOffset = 0, screen = 'journal', overlay = '', dataState = 'history', deleted = false, openMeal = 'lunch', toast = '';
    const stage = document.getElementById('stage'), picker = document.querySelector('.proto-picker'), highlight = picker.querySelector('.proto-picker-highlight'), items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')], replay = picker.querySelector('.proto-picker-replay');

    function brand() {
      const amazonian = document.documentElement.dataset.themeFamily === 'amazonians';
      return `<button class="wordmark" type="button"><img src="/branding/fitdex-icon-${amazonian ? 'amazonian' : 'spartan'}.png" alt="FitDex"/><strong>FitDex</strong></button>`;
    }

    function nav() {
      return `<nav class="app-nav" aria-label="Primary navigation">${[
        ['home', 'Home', icon.home],
        ['workout', 'Workout', icon.workout],
        ['food', 'Food', icon.food],
        ['progress', 'Progress', icon.chart],
        ['journal', 'Journal', icon.book]
      ].map(([id, label, i]) => `<button class="nav-item ${id === 'journal' ? 'is-active' : ''}" type="button" ${id === 'journal' ? 'aria-current="page"' : ''}>${i}<span>${label}</span></button>`).join('')}</nav>`;
    }

    function shell(content) {
      return `<section class="app-shell"><header class="topbar">${brand()}<button class="settings" type="button" aria-label="Open settings">${icon.settings}</button></header><div class="screen-scroll">${content}</div>${nav()}<div id="layer">${overlayHtml()}${toast ? `<div class="toast" role="status">${toast}</div>` : ''}</div></section>`;
    }

    function header() {
      return `<header class="page-header"><div><p class="eyebrow">Daily record</p><h1>Journal</h1><p>Your daily fitness history</p></div><button class="icon-button" type="button" data-action="help" aria-label="How Journal Works">${icon.help}</button></header>`;
    }

    function dateText() {
      if (dateOffset === 0) return ['Thu, 18 Sep 2026', 'Today'];
      if (dateOffset === -1) return ['Wed, 17 Sep 2026', 'Yesterday'];
      if (dateOffset === -2) return ['Tue, 16 Sep 2026', '2 days ago'];
      return ['Fri, 19 Sep 2026', 'Future day'];
    }

    function dateHeader() {
      const [date, label] = dateText();
      return `<header class="date-header"><button class="date-step" data-action="date" data-delta="-1" aria-label="Previous day">${icon.left}</button><div class="date-copy"><strong>${date}</strong><small>${label}</small></div><button class="date-step" data-action="date" data-delta="1" aria-label="Next day">${icon.right}</button></header>`;
    }

    function effectiveState() {
      return dateOffset > 0 ? 'empty' : dataState;
    }

    // Derived day facts from fixture arrays
    function getDayData(state) {
      let workouts = [];
      let foodEntries = [];

      if (state === 'history') {
        if (!deleted) workouts = [demoWorkout];
        foodEntries = demoFoodEntries;
      } else if (state === 'workout') {
        if (!deleted) workouts = [demoWorkout];
        foodEntries = [];
      } else if (state === 'food') {
        workouts = [];
        foodEntries = demoFoodEntries;
      } else if (state === 'empty') {
        workouts = [];
        foodEntries = [];
      }

      const sessionCount = workouts.length;
      const durationSeconds = workouts.reduce((sum, w) => sum + (w.durationSeconds || 0), 0);
      const totalMinutes = Math.round(durationSeconds / 60);
      const totalExerciseCount = workouts.reduce((sum, w) => sum + w.exercises.length, 0);
      const totalLoggedSets = workouts.reduce((sum, w) => sum + w.exercises.reduce((sSum, e) => sSum + e.sets.length, 0), 0);

      const totalFoodItems = foodEntries.length;
      const totalKcal = foodEntries.reduce((sum, f) => sum + f.kcal, 0);
      const totalProtein = foodEntries.reduce((sum, f) => sum + f.protein, 0);

      const mealGroups = ['breakfast', 'lunch', 'supper', 'dinner'].map(mealId => {
        const items = foodEntries.filter(f => f.meal === mealId);
        const kcal = items.reduce((sum, f) => sum + f.kcal, 0);
        const protein = items.reduce((sum, f) => sum + f.protein, 0);
        return {
          id: mealId,
          label: mealId.charAt(0).toUpperCase() + mealId.slice(1),
          items: items,
          count: items.length,
          kcal: kcal,
          protein: protein,
          hasEntries: items.length > 0
        };
      });

      return {
        workouts,
        foodEntries,
        sessionCount,
        durationSeconds,
        totalMinutes,
        totalExerciseCount,
        totalLoggedSets,
        totalFoodItems,
        totalKcal,
        totalProtein,
        mealGroups,
        workoutStatus: sessionCount === 0 ? 'No workout logged' : `${sessionCount} ${sessionCount === 1 ? 'workout' : 'workouts'} logged`,
        foodStatus: totalFoodItems === 0 ? 'No food logged' : `${totalFoodItems} ${totalFoodItems === 1 ? 'food item' : 'food items'} logged`
      };
    }

    function summary(day) {
      return `<div class="summary-grid">
        <div class="summary-stat">${icon.workout}<span><strong>${day.workoutStatus}</strong><small>${day.sessionCount > 0 ? `${day.totalMinutes} min trained` : '0 min trained'}</small></span></div>
        <div class="summary-stat">${icon.food}<span><strong>${day.foodStatus}</strong><small>${day.totalFoodItems > 0 ? `${day.totalKcal.toLocaleString()} kcal · ${day.totalProtein} g protein` : '0 kcal · 0 g protein'}</small></span></div>
      </div>`;
    }

    function stateSurface() {
      const s = effectiveState();
      if (s === 'loading') return `<section class="panel empty" role="status"><span class="empty-glyph">…</span><h2>Loading daily history</h2><p>Reading completed workouts and logged foods.</p></section>`;
      if (s === 'error') return `<section class="panel empty" role="alert"><span class="empty-glyph">!</span><h2>Journal unavailable</h2><p>Daily history could not be loaded. Change day to retry.</p></section>`;
      return '';
    }

    function workoutRow(w) {
      const mins = Math.round(w.durationSeconds / 60);
      return `<div class="activity-row"><span class="mark">${icon.workout}</span><span><strong>${w.name}</strong><small>${mins} min · ${w.exercises.length} exercises</small></span><button class="row-button" data-action="workout" aria-label="View ${w.name}">${icon.right}</button></div>`;
    }

    function foodRow(m) {
      return `<div class="activity-row"><span class="mark warm"><img src="${getMealIconSrc(m.id)}" alt="" width="28" height="28" onerror="this.style.display='none'"/></span><span><strong>${m.label}</strong><small>${m.items.map(x => x.name).join(', ')}</small></span><b>${m.kcal} kcal</b></div>`;
    }

    function mealCard(m) {
      return `<article class="panel meal-card">
        <div class="meal-head">
          <img src="${getMealIconSrc(m.id)}" alt="" width="38" height="38" onerror="this.style.display='none'"/>
          <span><strong>${m.label}</strong><small>${m.count} ${m.count === 1 ? 'logged item' : 'logged items'}</small></span>
          <b class="meal-total">${m.kcal} kcal · ${m.protein} g protein</b>
        </div>
        <ul class="food-list">
          ${m.items.map(item => `<li><span class="food-mark"><img src="${getCategoryIconSrc(item.categoryId)}" alt="" width="24" height="24" onerror="this.style.display='none'"/></span><span><strong>${item.name}</strong>${item.isUncategorized ? '<small>Uncategorized</small>' : `<small>${item.categoryName}</small>`}</span></li>`).join('')}
        </ul>
      </article>`;
    }

    // Variant 1: Quick Capture
    function quick() {
      const state = effectiveState();
      const stateHtml = stateSurface();
      const day = getDayData(state);
      const nonEmptyMeals = day.mealGroups.filter(m => m.hasEntries);

      return shell(`<main class="page">
        ${header()}
        ${dateHeader()}
        ${stateHtml || `
          <section class="panel quick-hero">
            <p class="eyebrow">Captured automatically</p>
            <div class="quick-signal">
              <strong>${day.workoutStatus}</strong>
              <span>${day.foodStatus}</span>
            </div>
            ${summary(day)}
          </section>
          <section class="panel">
            <div class="section-title">
              <h2>Latest activity</h2>
              <span>${dateText()[1]}</span>
            </div>
            ${day.sessionCount === 0 && nonEmptyMeals.length === 0 ? `
              <div class="empty-inline">
                <p>Completed workouts and logged foods appear here automatically.</p>
              </div>
            ` : `
              <div class="activity-list">
                ${day.workouts.map(w => workoutRow(w)).join('')}
                ${nonEmptyMeals.map(m => foodRow(m)).join('')}
              </div>
            `}
          </section>
        `}
      </main>`);
    }

    // Variant 2: Daily Log
    function daily() {
      const state = effectiveState();
      const stateHtml = stateSurface();
      const day = getDayData(state);
      const nonEmptyMeals = day.mealGroups.filter(m => m.hasEntries);

      return shell(`<main class="page">
        ${header()}
        <section class="daily-identity">
          <p class="eyebrow">Daily log</p>
          <strong>${dateText()[0]}</strong>
          <p>${dateText()[1]}</p>
          <div class="date-actions">
            <button class="date-step" data-action="date" data-delta="-1" aria-label="Previous day">${icon.left}</button>
            <span>Browse daily history</span>
            <button class="date-step" data-action="date" data-delta="1" aria-label="Next day">${icon.right}</button>
          </div>
        </section>
        ${stateHtml || `
          <section class="panel">
            <p class="eyebrow">Daily summary</p>
            ${summary(day)}
          </section>
          ${day.sessionCount === 0 && nonEmptyMeals.length === 0 ? `
            <section class="panel empty">
              <span class="empty-glyph" aria-hidden="true">▤</span>
              <h2>No activity logged</h2>
              <p>Completed workouts and logged foods appear here automatically.</p>
            </section>
          ` : `
            <section class="meal-stack">
              ${day.sessionCount > 0 ? `
                <p class="eyebrow">Workout</p>
                ${day.workouts.map(w => `
                  <article class="panel">
                    <div class="section-title">
                      <h2>${w.name}</h2>
                      <span>${Math.round(w.durationSeconds / 60)} min · ${w.exercises.length} exercises</span>
                    </div>
                    <button class="action" data-action="workout">View Workout ${icon.right}</button>
                  </article>
                `).join('')}
              ` : ''}
              ${nonEmptyMeals.length > 0 ? `
                <p class="eyebrow">Meals</p>
                ${nonEmptyMeals.map(mealCard).join('')}
              ` : ''}
            </section>
          `}
        `}
      </main>`);
    }

    // Variant 3: Field Notes
    function ledgerRow(m) {
      const open = openMeal === m.id;
      return `<li class="ledger-entry is-meal ${open ? 'is-open' : ''}">
        <button class="ledger-row-main" type="button" data-action="meal" data-meal="${m.id}" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} ${m.label}">
          <span class="mark warm" aria-hidden="true"><img src="${getMealIconSrc(m.id)}" alt="" width="28" height="28" onerror="this.style.display='none'"/></span>
          <span class="ledger-copy">
            <strong class="ledger-title">${m.label}</strong>
            <small class="ledger-meta">${m.count} ${m.count === 1 ? 'item' : 'items'} · ${m.kcal} kcal · ${m.protein} g protein</small>
          </span>
          <span class="ledger-disclosure" aria-hidden="true">${open ? icon.chevronUp : icon.chevronDown}</span>
        </button>
        ${open ? `
          <div class="ledger-detail">
            <ul class="food-list">
              ${m.items.map(item => `<li>
                <span class="food-mark" aria-hidden="true"><img src="${getCategoryIconSrc(item.categoryId)}" alt="" width="22" height="22" onerror="this.style.display='none'"/></span>
                <span class="food-copy">
                  <strong>${item.name}</strong>
                  <small>${item.isUncategorized ? 'Uncategorized' : item.categoryName} · ${item.kcal} kcal · ${item.protein} g protein</small>
                </span>
              </li>`).join('')}
            </ul>
          </div>
        ` : ''}
      </li>`;
    }

    function field() {
      const state = effectiveState();
      const stateHtml = stateSurface();
      const day = getDayData(state);
      const nonEmptyMeals = day.mealGroups.filter(m => m.hasEntries);

      return shell(`<main class="page">
        ${header()}
        ${dateHeader()}
        ${stateHtml || `
          <section class="panel ledger-hero">
            <div class="ledger-head">
              <span class="log-mark">${icon.book}</span>
              <div>
                <p class="eyebrow">Field log</p>
                <h2>${dateText()[1]}</h2>
                <p>Activity captured from Workout and Food.</p>
              </div>
            </div>
            ${summary(day)}
          </section>
          <section>
            <div class="section-title">
              <p class="eyebrow">Log entries</p>
              <span>Read-only record</span>
            </div>
            ${day.sessionCount === 0 && nonEmptyMeals.length === 0 ? `
              <section class="panel empty">
                <span class="empty-glyph" aria-hidden="true">▤</span>
                <h2>No activity logged</h2>
                <p>Completed workouts and logged foods appear here automatically.</p>
              </section>
            ` : `
              <ol class="ledger">
                ${day.workouts.map(w => `
                  <li class="ledger-entry">
                    <button class="ledger-row-main" type="button" data-action="workout" aria-label="View ${w.name}">
                      <span class="mark" aria-hidden="true">${icon.workout}</span>
                      <span class="ledger-copy">
                        <strong class="ledger-title">${w.name}</strong>
                        <small class="ledger-meta">${Math.round(w.durationSeconds / 60)} min · ${w.exercises.length} exercises · ${day.totalLoggedSets} logged sets</small>
                      </span>
                      <span class="ledger-nav" aria-hidden="true">${icon.chevronRight}</span>
                    </button>
                  </li>
                `).join('')}
                ${nonEmptyMeals.map(ledgerRow).join('')}
              </ol>
            `}
          </section>
        `}
      </main>`);
    }

    function detail() {
      const w = demoWorkout;
      const loggedSets = w.exercises.reduce((sum, e) => sum + e.sets.length, 0);
      return shell(`<main class="page">
        <header class="subheader">
          <button class="back-button" data-action="back" aria-label="Back to Journal">${icon.left}</button>
          <div>
            <p class="eyebrow">Completed workout</p>
            <h1>${w.name}</h1>
            <p>${w.completedAt}</p>
          </div>
        </header>
        <div class="detail-summary">
          <span><strong>${Math.round(w.durationSeconds / 60)} min</strong><small>Duration</small></span>
          <span><strong>${w.exercises.length}</strong><small>Exercises</small></span>
          <span><strong>${loggedSets}</strong><small>Logged sets</small></span>
        </div>
        ${w.exercises.map((ex, idx) => `
          <section class="panel">
            <p class="eyebrow">Exercise ${idx + 1}</p>
            <h2>${ex.name}</h2>
            <div class="set-list">
              ${ex.sets.map(s => `
                <div class="set-row">
                  <strong>Set ${s.setNumber}</strong>
                  <span>${s.weight} kg</span>
                  <span>${s.reps} reps</span>
                  <small>Logged</small>
                </div>
              `).join('')}
            </div>
          </section>
        `).join('')}
        ${w.notes ? `
          <section class="panel">
            <p class="eyebrow">Session notes</p>
            <p>${w.notes}</p>
          </section>
        ` : ''}
        <button class="action danger" data-action="confirm-delete">${icon.trash} Delete workout</button>
      </main>`);
    }

    function overlayHtml() {
      if (overlay === 'help') {
        return `<div class="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
          <p class="eyebrow">Connected history</p>
          <h2 id="help-title">How Journal Works</h2>
          <p>Journal is your read-only daily history. Completed workouts and logged foods appear automatically.</p>
          <p>Use date controls to review previous days. Journal derives this view without owning duplicate records.</p>
          <div class="dialog-actions"><button class="action primary" data-action="close-overlay">Done</button></div>
        </section></div>`;
      }
      if (overlay === 'delete') {
        return `<div class="backdrop"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-title">
          <p class="eyebrow">Completed history</p>
          <h2 id="delete-title">Delete workout?</h2>
          <p><strong>Upper Body Strength</strong></p>
          <p>This will permanently delete this completed workout and its logged exercises and sets. It will also be removed from Journal and recalculated out of Home, Progress, Personal Records, and previous performance.</p>
          <div class="dialog-actions">
            <button class="action" data-action="close-overlay">Cancel</button>
            <button class="action danger" data-action="delete">Delete</button>
          </div>
        </section></div>`;
      }
      return '';
    }

    // Fixture integrity assertion validation
    function validateFixtures() {
      const assertions = [];
      const day = getDayData('history');

      assertions.push({ name: 'Workout exercise count matches array', pass: day.totalExerciseCount === demoWorkout.exercises.length });
      assertions.push({ name: 'Workout logged sets count matches sets array', pass: day.totalLoggedSets === demoWorkout.exercises.reduce((sum, e) => sum + e.sets.length, 0) });
      assertions.push({ name: 'Workout duration minutes derived accurately', pass: day.totalMinutes === Math.round(demoWorkout.durationSeconds / 60) });
      assertions.push({ name: 'Daily food item count matches entries array', pass: day.totalFoodItems === demoFoodEntries.length });
      assertions.push({ name: 'Daily kcal matches sum of entry kcal', pass: day.totalKcal === demoFoodEntries.reduce((sum, f) => sum + f.kcal, 0) });
      assertions.push({ name: 'Daily protein matches sum of entry protein', pass: day.totalProtein === demoFoodEntries.reduce((sum, f) => sum + f.protein, 0) });

      day.mealGroups.forEach(m => {
        const expectedKcal = m.items.reduce((s, i) => s + i.kcal, 0);
        const expectedProtein = m.items.reduce((s, i) => s + i.protein, 0);
        assertions.push({ name: `Meal ${m.label} item count matches entries`, pass: m.count === m.items.length });
        assertions.push({ name: `Meal ${m.label} kcal (${m.kcal}) matches items sum (${expectedKcal})`, pass: m.kcal === expectedKcal });
        assertions.push({ name: `Meal ${m.label} protein (${m.protein}) matches items sum (${expectedProtein})`, pass: m.protein === expectedProtein });
      });

      const failed = assertions.filter(a => !a.pass);
      if (failed.length === 0) {
        console.log(`[FitDex Fixture Validation] All ${assertions.length} integrity assertions passed.`);
      } else {
        console.error(`[FitDex Fixture Validation] ${failed.length} assertions failed:`, failed);
      }
    }
    validateFixtures();

    const variants = [quick, daily, field];
    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i, { preserveScroll = false } = {}) {
      const old = stage.querySelector('.screen-scroll');
      const scroll = preserveScroll && old ? old.scrollTop : 0;
      stage.innerHTML = '';
      requestAnimationFrame(() => {
        stage.innerHTML = screen === 'detail' ? detail() : variants[i]();
        const next = stage.querySelector('.screen-scroll');
        if (next) next.scrollTop = scroll;
      });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      screen = 'journal';
      overlay = '';
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', e => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
      else if (e.key === 'Escape' && overlay) { overlay = ''; mount(current, { preserveScroll: true }); }
      else if (e.key === 'Escape' && screen === 'detail') { screen = 'journal'; mount(current); }
    });

    stage.addEventListener('click', e => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'help') { overlay = 'help'; mount(current, { preserveScroll: true }); }
      if (action === 'close-overlay') { overlay = ''; mount(current, { preserveScroll: true }); }
      if (action === 'date') { dateOffset = Math.max(-2, Math.min(1, dateOffset + Number(target.dataset.delta))); mount(current, { preserveScroll: true }); }
      if (action === 'workout') { screen = 'detail'; mount(current); }
      if (action === 'back') { screen = 'journal'; mount(current); }
      if (action === 'confirm-delete') { overlay = 'delete'; mount(current, { preserveScroll: true }); }
      if (action === 'delete') {
        deleted = true;
        overlay = '';
        screen = 'journal';
        toast = 'Workout deleted from connected history.';
        mount(current);
        setTimeout(() => { toast = ''; mount(current, { preserveScroll: true }); }, 1800);
      }
      if (action === 'meal') {
        openMeal = openMeal === target.dataset.meal ? '' : target.dataset.meal;
        mount(current, { preserveScroll: true });
      }
    });

    document.getElementById('theme').addEventListener('change', e => {
      const [family, brightness] = e.target.value.split('-');
      document.documentElement.dataset.themeFamily = family;
      document.documentElement.dataset.brightness = brightness;
      mount(current, { preserveScroll: true });
    });

    document.getElementById('width').addEventListener('change', e => {
      document.documentElement.style.setProperty('--preview-width', e.target.value);
      moveHighlight();
    });

    document.getElementById('data-state').addEventListener('change', e => {
      dataState = e.target.value;
      deleted = false;
      mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
