<!doctype html>
<html lang="en" data-theme-family="spartans" data-brightness="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>FitDex Phase 4 — Progress Prototype</title>
  <style>
    :root {
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Arial Narrow", "Roboto Condensed", Impact, ui-sans-serif, system-ui, sans-serif;

      --shadow: rgba(47,51,48,.16); --overlay: rgba(18,20,19,.76); --on-primary: #fff;

    :root[data-theme-family="spartans"][data-brightness="dark"] {
      --bg:#121616; --app:#181d1d; --surface:#1f2524; --raised:#282f2e; --subtle:#303635;
      --border:#606a66; --strong:#7e8984; --text:#e8e8e2; --muted:#a7aeaa;
      --primary:#2e9895; --primary-strong:#14706f; --primary-text:#58b4af; --primary-muted:#213331;
      --warm:#b77f2f; --xp:#cb9435; --success:#6f9565; --warning:#c28a47; --danger:#d66a66;
      --shadow:rgba(0,0,0,.24); --overlay:rgba(5,8,8,.82); --on-primary:#101716;
    }
    :root[data-theme-family="amazonians"][data-brightness="light"] {
      --bg:#f0e4d4; --app:#f4e9db; --surface:#ebe1d8; --raised:#f7ede0; --subtle:#ddd0d1;
      --border:#9f898e; --strong:#806c73; --text:#352b31; --muted:#746a6e;
      --primary:#785178; --primary-strong:#654061; --primary-text:#654061; --primary-muted:#e2d3dc;
      --warm:#b96f49; --xp:#c99032; --success:#647b58; --warning:#ad672d; --danger:#a44449;
      --shadow:rgba(62,45,54,.16); --overlay:rgba(31,22,27,.77); --on-primary:#fff;
    }
    :root[data-theme-family="amazonians"][data-brightness="dark"] {
      --bg:#1f171e; --app:#281c27; --surface:#31232f; --raised:#3a2937; --subtle:#44323f;
      --border:#79616f; --strong:#967887; --text:#eee5df; --muted:#b2a3aa;
      --primary:#906390; --primary-strong:#71446f; --primary-text:#bd91b7; --primary-muted:#493246;
      --warm:#bc7247; --xp:#d0a03f; --success:#7d936d; --warning:#c58d4f; --danger:#d86f74;
      --shadow:rgba(0,0,0,.25); --overlay:rgba(12,7,11,.82); --on-primary:#21151f;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 0; min-height: 100%; margin: 0; }
    body { min-height: 100dvh; overflow-x: hidden; background: var(--bg); }
    button, input, select { color: inherit; font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    h1, h2, h3, p { overflow-wrap: anywhere; }

    .harness { min-height: 100dvh; padding: 68px 8px 18px; }
    .harness-tools { display:flex; width:min(100%,780px); min-width:0; flex-wrap:wrap; justify-content:center; gap:6px; margin:0 auto 10px; }
    .harness-tools label { display:inline-flex; min-width:0; min-height:36px; align-items:center; gap:5px; padding:3px 7px; border:1px solid var(--border); background:var(--raised); color:var(--muted); font-family:var(--font-mono); font-size:.58rem; font-weight:900; letter-spacing:.05em; text-transform:uppercase; }
    .harness-tools select { min-width:0; height:28px; border:0; background:var(--surface); color:var(--text); font-size:.68rem; }
    #stage { display:flex; min-width:0; justify-content:center; }
    .app-shell { position:relative; display:grid; width:min(100%,var(--preview-width,100%)); max-width:480px; height:clamp(570px,calc(100dvh - 132px),860px); min-width:0; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; border:1px solid var(--strong); background:var(--app); box-shadow:0 12px 38px var(--shadow),3px 3px 0 var(--strong); container:progress-proto / inline-size; }
    .topbar { display:flex; min-width:0; min-height:calc(52px + env(safe-area-inset-top)); align-items:flex-end; gap:9px; padding:calc(7px + env(safe-area-inset-top)) 12px 7px; border-bottom:1px solid var(--strong); background:var(--raised); }
    .wordmark { display:inline-flex; min-width:0; min-height:38px; align-items:center; gap:7px; padding:0; border:0; background:transparent; }
    .wordmark img { display:block; width:38px; height:38px; object-fit:contain; }
    .wordmark strong { font-family:var(--font-display); font-size:1rem; letter-spacing:.05em; text-transform:uppercase; }
    .settings-button { display:grid; width:42px; min-width:42px; height:42px; place-items:center; margin-left:auto; padding:0; border:1px solid var(--border); background:var(--surface); color:var(--primary-text); }
    .settings-button svg { width:22px; height:22px; }
    .screen-scroll { min-width:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; }
    .page { display:grid; min-width:0; gap:11px; padding:14px clamp(9px,3cqi,14px) 28px; }
    .page-header { display:flex; min-width:0; align-items:flex-start; justify-content:space-between; gap:9px; }
    .page-header > div { min-width:0; }
    .page-header h1, .subheader h1 { margin:2px 0 4px; font-family:var(--font-display); font-size:clamp(1.65rem,9cqi,2.25rem); line-height:.98; letter-spacing:.015em; text-transform:uppercase; }
    .page-header p:last-child, .subheader p:last-child { margin:0; color:var(--muted); font-size:.68rem; line-height:1.4; }
    .eyebrow { margin:0; color:var(--primary-text); font-family:var(--font-mono); font-size:.56rem; font-weight:900; letter-spacing:.11em; text-transform:uppercase; }
    .help-button, .icon-button, .back-button { display:grid; width:44px; min-width:44px; height:44px; place-items:center; padding:0; border:1px solid var(--border); background:var(--surface); color:var(--primary-text); cursor:pointer; }
    .help-button svg, .back-button svg { width:22px; height:22px; }
    .help-button:active, .icon-button:active, .back-button:active, .action:active, .pr-cta:active, .tabs button:active, .period button:active, .metric-switch button:active, .nav-item:active { transform:scale(.97); }
    .tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
    .tabs button, .period button, .metric-switch button { min-width:0; min-height:44px; padding:7px 4px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:.61rem; font-weight:900; text-transform:uppercase; cursor:pointer; }
    .tabs button.is-active, .period button.is-active, .metric-switch button.is-active { border-color:var(--primary); background:var(--primary-muted); color:var(--primary-text); box-shadow:2px 2px 0 var(--primary); }
    .panel { position:relative; display:grid; min-width:0; gap:10px; padding:clamp(10px,3cqi,14px); border:1px solid var(--border); background:var(--raised); box-shadow:2px 2px 0 var(--shadow); }
    .panel::before { position:absolute; top:-1px; left:12px; width:30px; height:3px; background:var(--warm); content:""; }
    .panel-head { display:flex; min-width:0; align-items:flex-start; justify-content:space-between; gap:8px; }
    .panel-head > div { min-width:0; }
    .panel-head h2 { margin:3px 0 0; font-family:var(--font-display); font-size:.95rem; letter-spacing:.03em; text-transform:uppercase; }
    .panel-head > span { color:var(--muted); font-size:.58rem; font-weight:800; text-align:right; }
    .panel-head svg { width:22px; height:22px; color:var(--warm); flex-shrink:0; }
    .action { display:inline-flex; min-height:44px; align-items:center; justify-content:center; gap:6px; padding:7px 10px; border:1px solid var(--strong); background:var(--surface); color:var(--text); font-size:.62rem; font-weight:900; text-transform:uppercase; cursor:pointer; transition:transform 140ms cubic-bezier(.23,1,.32,1),background-color 140ms ease,border-color 140ms ease; }
    .action svg { width:18px; height:18px; flex-shrink:0; }
    .action.primary { border:2px solid var(--primary); background:var(--primary); color:var(--on-primary); box-shadow:2px 2px 0 var(--strong); }
    .pr-cta { display:flex; width:100%; min-height:48px; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--strong); background:var(--surface); color:var(--text); font-size:.64rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; box-shadow:2px 2px 0 var(--shadow); transition:transform 140ms cubic-bezier(.23,1,.32,1),background-color 140ms ease,border-color 140ms ease; }
    .pr-cta-lead { display:inline-flex; min-width:0; align-items:center; gap:9px; }
    .pr-cta-lead svg { width:22px; height:22px; color:var(--warm); flex-shrink:0; }
    .pr-cta-lead span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pr-cta > svg { width:18px; height:18px; color:var(--muted); flex-shrink:0; transition:transform 140ms ease; }
    .period { display:grid; gap:6px; }
    .period > div { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; }
    .metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    .metric { display:grid; min-width:0; gap:3px; padding:9px; border:1px solid var(--border); background:var(--subtle); }
    .metric strong { overflow-wrap:anywhere; font-family:var(--font-display); font-size:clamp(.9rem,4.5cqi,1.18rem); line-height:1.05; }
    .metric small { color:var(--muted); font-family:var(--font-mono); font-size:.52rem; font-weight:900; letter-spacing:.05em; text-transform:uppercase; }
    .metric em { color:var(--success); font-size:.56rem; font-style:normal; font-weight:800; }
    .level-card { display:grid; min-width:0; grid-template-columns:58px minmax(0,1fr); align-items:center; gap:10px; border-left:4px solid var(--xp); }
    .rank-badge { display:grid; width:58px; height:64px; place-items:center; overflow:hidden; clip-path:polygon(50% 0,94% 20%,86% 78%,50% 100%,14% 78%,6% 20%); background:linear-gradient(145deg,var(--primary-muted),var(--subtle)); }
    .rank-badge img { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
    .level-copy { display:grid; min-width:0; gap:4px; }
    .level-copy h2 { margin:0; color:var(--xp); font-family:var(--font-display); font-size:1.22rem; text-transform:uppercase; }
    .level-copy p, .level-copy small { margin:0; color:var(--muted); font-size:.6rem; }
    .meter { height:9px; overflow:hidden; border:1px solid var(--strong); background:var(--subtle); }
    .meter i { display:block; width:var(--value); height:100%; background:var(--xp); transform-origin:left; animation:meter-in 220ms cubic-bezier(.23,1,.32,1) both; }
    .level-actions { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .signal-card { border-left:4px solid var(--primary); }
    .signal { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:8px; }
    .signal strong { font-family:var(--font-display); font-size:clamp(1.7rem,10cqi,2.6rem); line-height:.9; }
    .signal span { color:var(--success); font-size:.7rem; font-weight:900; text-align:right; }
    .signal-copy { margin:0; color:var(--muted); font-size:.65rem; line-height:1.45; }
    .metric-switch { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
    .chart { display:grid; min-width:0; height:150px; grid-auto-columns:minmax(34px,1fr); grid-auto-flow:column; gap:5px; padding:5px 3px 0; overflow-x:auto; border-bottom:2px solid var(--strong); background:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,color-mix(in srgb,var(--border) 45%,transparent) 36px); }
    .bar { display:grid; min-width:34px; height:100%; grid-template-rows:18px minmax(0,1fr) 24px; align-items:end; gap:2px; text-align:center; }
    .bar b { overflow:hidden; color:var(--muted); font-size:.49rem; text-overflow:ellipsis; white-space:nowrap; }
    .bar i { display:block; width:min(24px,72%); height:var(--height); justify-self:center; border:1px solid var(--strong); border-bottom:0; background:var(--primary); transform-origin:bottom; animation:bar-in 220ms cubic-bezier(.23,1,.32,1) both; }
    .bar small { align-self:start; overflow:hidden; color:var(--muted); font-size:.5rem; text-overflow:ellipsis; white-space:nowrap; }
    .chart-summary { display:flex; min-width:0; flex-wrap:wrap; justify-content:space-between; gap:6px; margin:0; color:var(--muted); font-size:.61rem; }
    .comparison { color:var(--success); font-weight:900; }
    .progress-list { display:grid; min-width:0; margin:0; padding:0; border:1px solid var(--border); list-style:none; }
    .progress-list li { display:grid; min-width:0; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:9px; border-bottom:1px solid var(--border); background:var(--subtle); }
    .progress-list li:last-child { border-bottom:0; }
    .progress-list span { display:grid; min-width:0; gap:2px; }
    .progress-list strong { overflow-wrap:anywhere; font-size:.67rem; }
    .progress-list small { color:var(--muted); font-size:.55rem; }
    .progress-list b { align-self:center; color:var(--primary-text); font-size:.65rem; text-align:right; }
    .nutrition-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    .nutrition-pair div { display:grid; gap:3px; padding:9px; border:1px solid var(--border); background:var(--subtle); }
    .nutrition-pair strong { font-family:var(--font-display); font-size:1.05rem; }
    .nutrition-pair small { color:var(--muted); font-size:.53rem; font-weight:900; text-transform:uppercase; }
    .timeline-hero { display:grid; gap:9px; border-top:4px solid var(--primary); }
    .timeline-legend { display:flex; flex-wrap:wrap; gap:10px; color:var(--muted); font-size:.55rem; }
    .timeline-legend span::before { display:inline-block; width:8px; height:8px; margin-right:4px; background:var(--dot); content:""; }
    .timeline-stack { display:grid; gap:10px; }
    .track { display:grid; min-width:0; grid-template-columns:62px minmax(0,1fr); gap:7px; align-items:center; }
    .track > span { display:grid; gap:2px; }
    .track strong { font-size:.62rem; }
    .track small { color:var(--muted); font-size:.49rem; }
    .spark { display:grid; min-width:0; height:50px; grid-template-columns:repeat(6,minmax(0,1fr)); align-items:end; gap:3px; border-bottom:1px solid var(--border); }
    .spark i { display:block; min-width:0; height:var(--height); background:var(--tone,var(--primary)); transform-origin:bottom; animation:bar-in 220ms cubic-bezier(.23,1,.32,1) both; }
    .delta-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border:1px solid var(--border); }
    .delta-grid div { display:grid; gap:3px; padding:9px; background:var(--subtle); }
    .delta-grid div + div { border-left:1px solid var(--border); }
    .delta-grid span { color:var(--muted); font-size:.51rem; font-weight:900; text-transform:uppercase; }
    .delta-grid strong { font-family:var(--font-display); font-size:1rem; }
    .delta-grid small { color:var(--success); font-size:.56rem; }
    .character-hero { display:grid; min-width:0; grid-template-columns:78px minmax(0,1fr); gap:11px; align-items:center; border:2px solid var(--xp); background:linear-gradient(145deg,color-mix(in srgb,var(--xp) 12%,var(--raised)),var(--raised)); }
    .character-hero .rank-badge { width:76px; height:84px; }
    .character-copy { display:grid; min-width:0; gap:4px; }
    .character-copy h2 { margin:0; color:var(--xp); font-family:var(--font-display); font-size:1.35rem; text-transform:uppercase; }
    .character-copy p, .character-copy small { margin:0; color:var(--muted); font-size:.58rem; }

    .attribute-list { display:grid; border:1px solid var(--border); }

    .attribute:last-child { border-bottom:0; }

    .attribute span { display:grid; min-width:0; gap:2px; }

    .quest-list { display:grid; gap:6px; }
    .quest { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px; border:1px solid var(--border); background:var(--subtle); }
    .quest > b { color:var(--primary-text); font-family:var(--font-mono); font-size:.55rem; }
    .quest span { display:grid; gap:2px; }
    .quest strong { font-size:.64rem; }
    .quest small { color:var(--muted); font-size:.53rem; }
    .quest em { color:var(--success); font-size:.56rem; font-style:normal; font-weight:900; }
    .subheader { display:grid; min-width:0; grid-template-columns:44px minmax(0,1fr); gap:10px; align-items:start; }
    .search { display:grid; grid-template-columns:26px minmax(0,1fr); min-height:48px; align-items:center; gap:5px; padding:0 10px; border:2px solid var(--border); background:var(--subtle); color:var(--muted); }
    .search input { width:100%; min-width:0; height:44px; border:0; outline:0; background:transparent; color:var(--text); }
    .record-card { border-left:4px solid var(--warm); }

    .record-card dt { color:var(--muted); font-size:.51rem; font-weight:900; text-transform:uppercase; }

    .app-nav { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); min-height:calc(64px + env(safe-area-inset-bottom)); padding:2px max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left)); border-top:1px solid var(--strong); background:var(--app); }

    @container progress-proto (max-width:350px) {

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;

  <main class="harness">

  <script>
    const svg = (body, viewBox='0 0 24 24') => `<svg viewBox="${viewBox}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
    const icons = {
      settings: svg('<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 3.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2V9.6h.1A1.7 1.7 0 0 0 3.6 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8 3.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2h4v.1A1.7 1.7 0 0 0 15 3.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4h-.1A1.7 1.7 0 0 0 19.4 15Z"/>'),
      help: svg('<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4"/><path d="M12 18h.01"/>'),
      back: svg('<path d="m15 18-6-6 6-6"/>'),
      chevron: svg('<path d="m9 18 6-6-6-6"/>'),
      award: svg('<circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/>'),
      search: svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
      home: svg('<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>'),
      workout: svg('<path d="M6.5 6.5h11v11h-11z"/><path d="M3 9v6M21 9v6M6.5 12H3M21 12h-3.5"/>'),
      food: svg('<path d="M7 3v8M4 3v5c0 2 3 2 3 4v9M10 3v5c0 2-3 2-3 4"/><path d="M17 3v18M17 3c3 2 4 5 4 8h-4"/>'),
      progress: svg('<path d="M3 3v18h18"/><path d="m7 16 4-5 3 3 5-7"/>'),
      journal: svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>'),
    };

    const periodData = {
      '7d': { workouts:2, time:'1h 30m', volume:'2,094 lb', delta:'+90%', days:4, kcal:'2,180 kcal', protein:'128 g', frequency:[0,1,0,0,1,0,0], volumeBars:[0,600,0,0,950,0,0], nutrition:[2050,2210,0,2320,2140,0,0], labels:['Fri','Sat','Sun','Mon','Tue','Wed','Thu'] },
      '30d': { workouts:9, time:'8h 40m', volume:'16,050 lb', delta:'+18.6%', days:22, kcal:'2,240 kcal', protein:'132 g', frequency:[1,2,1,2,1,2], volumeBars:[900,1240,1080,1390,1260,1410], nutrition:[2180,2260,2310,2190,2250,2240], labels:['23 Aug','28 Aug','2 Sep','7 Sep','12 Sep','18 Sep'] },
      '90d': { workouts:28, time:'26h 10m', volume:'51,699 lb', delta:'+12.4%', days:61, kcal:'2,210 kcal', protein:'129 g', frequency:[2,3,2,2,3,2,3,2,2,3,2,2,2], volumeBars:[1150,1380,1290,1420,1550,1490,1650,1710,1580,1800,1760,1880,1910], nutrition:[2150,2200,2240,2180,2300,2260,2190,2230,2280,2160,2210,2250,2290], labels:['25 Jun','2 Jul','9 Jul','16 Jul','23 Jul','30 Jul','6 Aug','13 Aug','20 Aug','27 Aug','3 Sep','10 Sep','18 Sep'] },
      all: { workouts:63, time:'64h 25m', volume:'135,584 lb', delta:'All time', days:146, kcal:'2,225 kcal', protein:'130 g', frequency:[4,6,7,8,9,10,9,10], volumeBars:[4100,6200,7700,8900,10400,11600,12800,14000], nutrition:[2180,2200,2190,2240,2270,2210,2250,2260], labels:["Feb '26","Mar '26","Apr '26","May '26","Jun '26","Jul '26","Aug '26","Sep '26"] },
    };
    const records = [
      { name:'Barbell Bench Press', type:'weight reps', metric:'Heaviest Weight', value:'176.4 lb', date:'14 Sep 2026', extra:['Best Reps at Heaviest|176.4 lb × 5 reps','Best Set Volume|165.3 lb × 8 = 1,322.8 lb'] },
      { name:'Assisted Pull-Up', type:'assisted bodyweight', metric:'Highest Reps', value:'12 reps', date:'10 Sep 2026', extra:['Lowest Assistance at Best Reps|12 reps · 44.1 lb assistance'] },
      { name:'Outdoor Run', type:'distance duration', metric:'Longest Distance', value:'3.1 mi', date:'8 Sep 2026', extra:['Longest Duration|35m'] },
      { name:'Plank', type:'duration', metric:'Longest Duration', value:'2m 10s', date:'4 Sep 2026', extra:[] },
      { name:'Push-Up', type:'bodyweight reps', metric:'Highest Reps', value:'35 reps', date:'29 Aug 2026', extra:[] },
      { name:'Farmer Carry', type:'weight distance', metric:'Heaviest Weight', value:'132.3 lb', date:'22 Aug 2026', extra:['Longest Distance|0.1 mi'] },
    ];
    const achievements = [
      { category:'Workout', name:'50 Workouts', description:'Complete 50 workouts.', asset:'workouts-50.webp', unlocked:true },
      { category:'Personal Records', name:'10 PRs', description:'Set 10 personal records.', asset:'prs-10.webp', unlocked:true },
      { category:'Nutrition', name:'30 Nutrition Days', description:'Log all four meals on 30 days.', asset:'nutrition-days-30.webp', unlocked:false },
      { category:'Level', name:'Level 25', description:'Reach Level 25.', asset:'level-25.webp', unlocked:false },
      { category:'Workout', name:'100 Hours Trained', description:'Complete 100 training hours.', asset:'hours-100.webp', unlocked:false },
      { category:'Personal Records', name:'PRs Across 20 Exercises', description:'Set records for 20 exercises.', asset:'pr-exercises-20.webp', unlocked:false },
    ];
    let period = '30d';
    let screen = 'overview';
    let metricMode = 'volume';
    let achievementFilter = 'All';
    let recordQuery = '';
    let dataState = 'history';

    function brand() {
      const amazonian = document.documentElement.dataset.themeFamily === 'amazonians';
      const src = amazonian ? '/branding/fitdex-icon-amazonian.png' : '/branding/fitdex-icon-spartan.png';
      return `<button class="wordmark" type="button"><img src="${src}" alt="FitDex"/><strong>FitDex</strong></button>`;
    }
    function shell(content) {
      const nav = [
        ['home','Home',icons.home],['workout','Workout',icons.workout],['food','Food',icons.food],['progress','Progress',icons.progress],['journal','Journal',icons.journal]
      ].map(([id,label,icon]) => `<button class="nav-item ${id==='progress'?'is-active':''}" type="button" ${id==='progress'?'aria-current="page"':''}>${icon}<span>${label}</span></button>`).join('');
      return `<section class="app-shell"><header class="topbar">${brand()}<button class="settings-button" type="button" aria-label="Open settings">${icons.settings}</button></header><div class="screen-scroll">${content}</div><nav class="app-nav" aria-label="Primary navigation">${nav}</nav><div id="layer"></div></section>`;
    }
    function header() { return `<header class="page-header"><div><p class="eyebrow">Character stats</p><h1>Progress</h1><p>See how your training is changing</p></div><button class="help-button" type="button" data-action="help" aria-label="How Progress Works">${icons.help}</button></header>`; }
    function tabs() { return `<nav class="tabs" role="tablist" aria-label="Progress sections"><button class="${screen==='overview'?'is-active':''}" data-action="screen" data-screen="overview">Overview</button><button class="${screen==='records'?'is-active':''}" data-action="screen" data-screen="records">Records</button><button class="${screen==='achievements'?'is-active':''}" data-action="screen" data-screen="achievements">Achievements</button></nav>`; }
    function periodControl() { return `<section class="period"><p class="eyebrow">Period</p><div>${[['7d','7D'],['30d','30D'],['90d','90D'],['all','All']].map(([key,label]) => `<button class="${period===key?'is-active':''}" type="button" data-action="period" data-period="${key}" aria-pressed="${period===key}">${label}</button>`).join('')}</div></section>`; }
    function levelCard(character=false) {
      if (character) return `<section class="panel character-hero"><span class="rank-badge"><img src="/gamification/ranks/hardened.webp" alt="Hardened rank emblem"/></span><div class="character-copy"><p class="eyebrow">Level 19</p><h2>Hardened</h2><p>8,420 Lifetime XP</p><div class="meter" role="progressbar" aria-label="Level 19 XP progress" aria-valuemin="0" aria-valuemax="700" aria-valuenow="420"><i style="--value:60%"></i></div><small>420 / 700 XP to Level 20</small></div><div class="character-actions"><button class="action" data-action="rank">Rank Journey</button><button class="action" data-action="screen" data-screen="achievements">Achievements</button></div></section>`;
      return `<section class="panel level-card"><span class="rank-badge"><img src="/gamification/ranks/hardened.webp" alt="Hardened rank emblem"/></span><div class="level-copy"><p class="eyebrow">Level 19</p><h2>Hardened</h2><p>8,420 Lifetime XP</p><div class="meter" role="progressbar" aria-label="Level 19 XP progress" aria-valuemin="0" aria-valuemax="700" aria-valuenow="420"><i style="--value:60%"></i></div><small>420 / 700 XP to Level 20</small></div><div class="level-actions"><button class="action" data-action="rank">Rank Journey</button><button class="action" data-action="gamification-help">XP Help</button></div></section>`;
    }
    function metrics() { const d=periodData[period]; return `<div class="metric-grid"><div class="metric"><strong>${d.workouts}</strong><small>Workouts</small></div><div class="metric"><strong>${d.time}</strong><small>Training Time</small></div><div class="metric"><strong>${d.volume}</strong><small>Resistance Volume</small><em>${d.delta==='All time'?'':d.delta+' vs previous'}</em></div><div class="metric"><strong>${records.length}</strong><small>PR Exercises</small></div></div>`; }
    function bars(values,labels,tone='var(--primary)') { const max=Math.max(...values,1); return `<div class="chart" role="img" aria-label="Trend chart">${values.map((value,index) => `<div class="bar"><b>${value?formatCompact(value):'—'}</b><i style="--height:${value?Math.max(4,value/max*100):0}%;background:${tone}"></i><small>${labels[index]}</small></div>`).join('')}</div>`; }
    function chartPanel(mode=metricMode) { const d=periodData[period]; const values=mode==='workouts'?d.frequency:mode==='nutrition'?d.nutrition:d.volumeBars; const title=mode==='workouts'?'Workout consistency':mode==='nutrition'?'Average calories':'Resistance volume'; const summary=mode==='workouts'?`${d.workouts} completed workouts`:mode==='nutrition'?`${d.days} logged days · ${d.kcal} average`:`${d.volume} total`; const tone=mode==='nutrition'?'var(--warm)':'var(--primary)'; return `<section class="panel"><div class="panel-head"><div><p class="eyebrow">${title}</p><h2>${summary}</h2></div><span>${period.toUpperCase()}</span></div><div class="metric-switch">${['workouts','volume','nutrition'].map(item => `<button class="${mode===item?'is-active':''}" data-action="metric" data-metric="${item}">${item}</button>`).join('')}</div>${bars(values,d.labels,tone)}<p class="chart-summary"><span>${mode==='volume'?'Weight × reps across completed resistance sets.':mode==='nutrition'?'Average uses days with at least one food entry.':'Completed training sessions in this period.'}</span>${mode==='volume'?`<b class="comparison">${d.delta}${d.delta==='All time'?'':' vs previous'}</b>`:''}</p></section>`; }
    function prPanel() { return `<section class="panel"><div class="panel-head"><div><p class="eyebrow">Personal records</p><h2>${records.length} exercises with records</h2></div><span>All time</span></div><ul class="progress-list">${records.slice(0,3).map(r=>`<li><span><strong>${r.name}</strong><small>${r.metric} · ${r.date}</small></span><b>${r.value}</b></li>`).join('')}</ul><button class="pr-cta" data-action="screen" data-screen="records"><span class="pr-cta-lead">${icons.award}<span>VIEW ALL PRs</span></span>${icons.chevron}</button></section>`; }
    function nutritionPanel() { const d=periodData[period]; return `<section class="panel"><div class="panel-head"><div><p class="eyebrow">Nutrition</p><h2>${d.days} logged days</h2></div><span>Logged-day averages</span></div><div class="nutrition-pair"><div><strong>${d.kcal}</strong><small>Average Calories</small></div><div><strong>${d.protein}</strong><small>Average Protein</small></div></div></section>`; }
    function stateSurface() {
      if (dataState==='loading') return `<section class="panel empty" role="status"><h2>Loading progress…</h2><p>Reading completed workouts and Food history.</p></section>`;
      if (dataState==='error') return `<section class="panel empty" role="alert"><h2>Progress unavailable</h2><p>Progress history could not be loaded. Change period to retry.</p></section>`;
      if (dataState==='empty') return `<section class="panel empty"><h2>Start building your history</h2><p>Complete workouts and log meals to see progress here.</p></section>`;
      return '';
    }
    function commonStart() { return `${header()}${tabs()}`; }
    function summaryFirst() {
      if (screen!=='overview') return subview();
      const d=periodData[period], state=stateSurface();
      return shell(`<main class="page">${commonStart()}${levelCard()}${periodControl()}${state || `<section class="panel signal-card"><div class="panel-head"><div><p class="eyebrow">Current read</p><h2>Training load is up</h2></div><span>${period.toUpperCase()}</span></div><div class="signal"><strong>${d.delta}</strong><span>${d.volume}</span></div><p class="signal-copy">Resistance volume versus previous equal period. Workout count: ${d.workouts}. Training time: ${d.time}.</p>${metrics()}</section>${chartPanel()}${prPanel()}${nutritionPanel()}`}</main>`);
    }
    function timelineTracks() { const d=periodData[period]; const rows=[['Workouts',d.workouts+' total',d.frequency,'var(--primary)'],['Volume',d.volume,d.volumeBars,'var(--xp)'],['Calories',d.kcal,d.nutrition,'var(--warm)']]; return `<div class="timeline-stack">${rows.map(([name,value,values,tone])=>{const max=Math.max(...values,1);return `<div class="track"><span><strong>${name}</strong><small>${value}</small></span><div class="spark">${values.slice(-6).map(v=>`<i style="--height:${v?Math.max(5,v/max*100):0}%;--tone:${tone}"></i>`).join('')}</div></div>`}).join('')}</div>`; }
    function timelineFirst() {
      if (screen!=='overview') return subview();
      const d=periodData[period], state=stateSurface();
      return shell(`<main class="page">${commonStart()}${periodControl()}${state || `<section class="panel timeline-hero"><div class="panel-head"><div><p class="eyebrow">Progress timeline</p><h2>How you changed</h2></div><span>${period.toUpperCase()}</span></div>${timelineTracks()}<div class="timeline-legend"><span style="--dot:var(--primary)">Workouts</span><span style="--dot:var(--xp)">Volume</span><span style="--dot:var(--warm)">Calories</span></div></section><section class="delta-grid"><div><span>Current Volume</span><strong>${d.volume}</strong><small>${d.delta}${d.delta==='All time'?'':' vs previous'}</small></div><div><span>Current Pace</span><strong>${d.workouts} workouts</strong><small>${d.time} trained</small></div></section>${levelCard()}${prPanel()}${nutritionPanel()}`}</main>`);
    }
    function characterSheet() {
      if (screen!=='overview') return subview();
      const d=periodData[period], state=stateSurface();
      return shell(`<main class="page">${commonStart()}${levelCard(true)}${periodControl()}${state || `<section class="panel"><div class="panel-head"><div><p class="eyebrow">Training attributes</p><h2>Real progress stats</h2></div><span>${period.toUpperCase()}</span></div><div class="attribute-list"><div class="attribute"><b>01</b><span><strong>Consistency</strong><small>Completed workouts</small></span><em>${d.workouts}</em></div><div class="attribute"><b>02</b><span><strong>Training Time</strong><small>Completed session duration</small></span><em>${d.time}</em></div><div class="attribute"><b>03</b><span><strong>Resistance Volume</strong><small>${d.delta==='All time'?'All time total':d.delta+' vs previous '+period.toUpperCase()}</small></span><em>${d.volume}</em></div><div class="attribute"><b>04</b><span><strong>Record Book</strong><small>Exercises with records</small></span><em>${records.length}</em></div></div></section>${chartPanel()}${prPanel()}${nutritionPanel()}`}</main>`);
    }
    function subview() { if(screen==='records') return recordsView(); if(screen==='achievements') return achievementsView(); if(screen==='rank') return rankView(); return summaryFirst(); }
    function recordsView() { const filtered=records.filter(r=>r.name.toLowerCase().includes(recordQuery.toLowerCase())); return shell(`<main class="page"><header class="subheader"><button class="back-button" data-action="screen" data-screen="overview" aria-label="Back to Progress">${icons.back}</button><div><p class="eyebrow">Progress archive</p><h1>Personal Records</h1><p>Your best logged performances</p></div></header><label class="search">${icons.search}<input id="record-search" type="search" value="${escapeHtml(recordQuery)}" placeholder="Search exercises…" aria-label="Search personal records by exercise name"/></label><p class="eyebrow" aria-live="polite">${filtered.length} ${filtered.length===1?'exercise':'exercises'}</p>${filtered.length?filtered.map(recordCard).join(''):`<section class="panel empty"><h2>No matching records</h2><p>Try another exercise name.</p></section>`}</main>`); }
    function recordCard(r) { const metrics=[[r.metric,r.value],...r.extra.map(x=>x.split('|'))]; return `<article class="panel record-card"><div class="panel-head"><div><p class="eyebrow">${r.type}</p><h2>${r.name}</h2></div>${icons.award}</div><dl>${metrics.map(([label,value])=>`<div><dt>${label}</dt><dd><strong>${value}</strong><small>${r.date}</small></dd></div>`).join('')}</dl><p class="chart-summary">Last PR · ${r.date}</p></article>`; }
    function achievementsView() { const shown=achievements.filter(a=>achievementFilter==='All'||a.category===achievementFilter); return shell(`<main class="page"><header class="subheader"><button class="back-button" data-action="screen" data-screen="overview" aria-label="Back to Progress">${icons.back}</button><div><p class="eyebrow">Gamification</p><h1>Achievements</h1><p>18 / 52 unlocked · 35% complete</p></div></header><section class="panel"><p class="eyebrow">Achievement completion</p><div class="meter"><i style="--value:35%"></i></div></section><div class="filter-row">${['All','Workout','Personal Records','Nutrition','Level'].map(f=>`<button class="${achievementFilter===f?'is-active':''}" data-action="achievement-filter" data-filter="${f}">${f}</button>`).join('')}</div><section class="achievement-grid">${shown.map(a=>`<article class="panel achievement ${a.unlocked?'':'is-locked'}"><img src="/gamification/achievements/${a.asset}" alt="${a.name} badge"/><div><p class="eyebrow">${a.category}</p><h2>${a.name}</h2><p>${a.description}</p><small>${a.unlocked?'Unlocked':'Locked'}</small></div></article>`).join('')}</section></main>`); }
    function rankView() { const ranks=[['recruit','Recruit','Levels 1–6'],['regular','Regular','Levels 7–15'],['hardened','Hardened','Levels 16–27'],['veteran','Veteran','Levels 28–42'],['warrior','Warrior','Levels 43–57']]; return shell(`<main class="page"><header class="subheader"><button class="back-button" data-action="screen" data-screen="overview" aria-label="Back to Progress">${icons.back}</button><div><p class="eyebrow">Gamification</p><h1>Level & Rank</h1></div></header>${levelCard()}<section class="panel"><div class="panel-head"><div><p class="eyebrow">Rank journey</p><h2>Nine ranks · No divisions</h2></div></div><ol class="rank-list">${ranks.map(([id,name,levels])=>`<li class="${id==='hardened'?'is-current':''}"><img src="/gamification/ranks/${id}.webp" alt="${name} emblem"/><span><strong>${name}</strong><small>${levels}</small></span>${id==='hardened'?'<em>Current</em>':''}</li>`).join('')}</ol></section><section class="panel"><p class="eyebrow">How you earn XP</p><ul class="xp-list"><li><span>Planned Routine</span><b>+30</b></li><li><span>Workout Day</span><b>+30</b></li><li><span>Unplanned Workout</span><b>+20</b></li><li><span>New Personal Record</span><b>+15</b></li><li><span>Full Food Log</span><b>+5</b></li></ul></section></main>`); }
    function helpDialog(gamification=false) { return `<div class="dialog-wrap"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="help-title"><p class="eyebrow">${gamification?'Fitness consistency':'Connected insights'}</p><h2 id="help-title">${gamification?'How Gamification Works':'How Progress Works'}</h2>${gamification?'<p>XP, ranks, streaks, and achievements use existing FitDex activity.</p>':'<p>Progress is calculated automatically from completed workouts and Food history. There is nothing extra to log here.</p><ul><li>Workout count and training time</li><li>Weight × reps resistance volume</li><li>Personal records by tracking type</li><li>Average calories and protein across logged days</li></ul>'}<button class="action primary" data-action="close-dialog">Continue</button></section></div>`; }
    function formatCompact(value) { return new Intl.NumberFormat(undefined,{notation:value>=10000?'compact':'standard',maximumFractionDigits:1}).format(value); }
    function escapeHtml(value) { return value.replace(/[&<>"]/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char])); }

    const variants = [summaryFirst, timelineFirst, characterSheet];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i, preserveScroll = false) {
      const oldScroll = stage.querySelector('.screen-scroll');
      const scrollTop = oldScroll ? oldScroll.scrollTop : 0;
      const scrollY = window.scrollY;

      if (preserveScroll) {
        stage.innerHTML = variants[i]();
        const newScroll = stage.querySelector('.screen-scroll');
        if (newScroll) newScroll.scrollTop = scrollTop;
        window.scrollTo(0, scrollY);
      } else {
        stage.innerHTML = '';
        // Clear first, render next frame, so entrance animations re-run.
        requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
      }
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      screen = 'overview';
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i, false);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current, false));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current, false);
    });

    document.addEventListener('click', event => {
      const target=event.target.closest('[data-action]'); if(!target) return;
      const action=target.dataset.action;
      if(action==='period'){period=target.dataset.period;mount(current, true);}
      else if(action==='metric'){metricMode=target.dataset.metric;mount(current, true);}
      else if(action==='screen'){screen=target.dataset.screen;mount(current, false);}
      else if(action==='rank'){screen='rank';mount(current, false);}
      else if(action==='help'){document.getElementById('layer').innerHTML=helpDialog(false);}
      else if(action==='gamification-help'){document.getElementById('layer').innerHTML=helpDialog(true);}
      else if(action==='close-dialog'){document.getElementById('layer').innerHTML='';}
      else if(action==='achievement-filter'){achievementFilter=target.dataset.filter;mount(current, true);}
    });
    document.addEventListener('input', event => {
      if(event.target.id!=='record-search') return;
      const selection=event.target.selectionStart; recordQuery=event.target.value; mount(current, true);
      requestAnimationFrame(()=>{const input=document.getElementById('record-search'); input?.focus({preventScroll:true}); input?.setSelectionRange(selection,selection);});
    });
    document.getElementById('theme').addEventListener('change', event => { const [family,brightness]=event.target.value.split('-'); document.documentElement.dataset.themeFamily=family; document.documentElement.dataset.brightness=brightness; mount(current, true); });
    document.getElementById('width').addEventListener('change', event => { document.documentElement.style.setProperty('--preview-width',event.target.value); });
    document.getElementById('data-state').addEventListener('change', event => { dataState=event.target.value; mount(current, true); });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 3) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
