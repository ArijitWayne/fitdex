<!doctype html>
<html lang="en" data-family="spartans" data-brightness="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>FitDex Home Concepts</title>
  <style>
    :root {
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Arial Narrow", "Roboto Condensed", Impact, ui-sans-serif, system-ui, sans-serif;
      --bg: #121616;
      --app: #181d1d;
      --surface: #1f2524;
      --raised: #282f2e;
      --subtle: #303635;
      --border: #606a66;
      --border-strong: #7e8984;
      --text: #e8e8e2;
      --muted: #a7aeaa;
      --primary: #2e9895;
      --primary-strong: #14706f;
      --primary-text: #58b4af;
      --primary-muted: #213331;
      --warm: #b77f2f;
      --xp: #cb9435;
      --success: #6f9565;
      --danger: #d66a66;
      --shadow: rgba(0, 0, 0, .32);
      --ease-out: cubic-bezier(.23, 1, .32, 1);
    }

    :root[data-family="amazonians"] {
      --bg: #1f171e;
      --app: #281c27;
      --surface: #31232f;
      --raised: #3a2937;
      --subtle: #44323f;
      --border: #79616f;
      --border-strong: #967887;
      --text: #eee5df;
      --muted: #b2a3aa;
      --primary: #906390;
      --primary-strong: #71446f;
      --primary-text: #bd91b7;
      --primary-muted: #493246;
      --warm: #bc7247;
      --xp: #d0a03f;
      --success: #7d936d;
      --danger: #d86f74;
    }

    :root[data-brightness="light"] {
      --bg: #f0e6d6;
      --app: #f4ebdd;
      --surface: #eae2d5;
      --raised: #f8efe2;
      --subtle: #ddd9ce;
      --border: #979b92;
      --border-strong: #6f7771;
      --text: #2e3230;
      --muted: #656b67;
      --primary: #1f8582;
      --primary-strong: #176864;
      --primary-text: #176864;
      --primary-muted: #d1ded9;
      --warm: #b67e26;
      --xp: #bd862c;
      --success: #53794f;
      --danger: #a74343;
      --shadow: rgba(47, 51, 48, .18);
    }

    :root[data-family="amazonians"][data-brightness="light"] {
      --bg: #f0e4d4;
      --app: #f4e9db;
      --surface: #ebe1d8;
      --raised: #f7ede0;
      --subtle: #ddd0d1;
      --border: #9f898e;
      --border-strong: #806c73;
      --text: #352b31;
      --muted: #746a6e;
      --primary: #785178;
      --primary-strong: #654061;
      --primary-text: #654061;
      --primary-muted: #e2d3dc;
      --warm: #b96f49;
      --xp: #c99032;
      --success: #647b58;
      --danger: #a44449;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { min-width: 320px; min-height: 100vh; margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    button { font: inherit; }
    #stage { min-height: 100vh; }
    .fitdex-prototype { min-height: 100vh; background: var(--bg); }
    .phone-shell { width: min(100%, 460px); min-height: 100vh; margin: 0 auto; background: var(--surface); box-shadow: 0 0 0 1px var(--border), 0 24px 80px var(--shadow); }
    .app-topbar { position: sticky; top: 0; z-index: 5; display: flex; min-height: 62px; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 2px solid var(--border-strong); background: color-mix(in srgb, var(--app) 94%, transparent); backdrop-filter: blur(14px); }
    .brand { display: flex; min-width: 0; align-items: center; gap: 8px; margin-right: auto; }
    .brand img { width: 36px; height: 36px; image-rendering: pixelated; }
    .brand strong { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .05em; text-transform: uppercase; }
    .theme-controls { display: flex; gap: 4px; }
    .theme-controls button, .brightness-button { display: grid; min-width: 42px; min-height: 42px; place-items: center; padding: 0 8px; border: 1px solid var(--border); background: var(--raised); color: var(--muted); cursor: pointer; transition: color 150ms ease-out, border-color 150ms ease-out, transform 140ms var(--ease-out); }
    .theme-controls button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary-text); box-shadow: inset 0 -3px 0 var(--primary); }
    .theme-controls button:active, .brightness-button:active, .fitdex-prototype .pressable:active { transform: scale(.97); }
    .fitdex-prototype button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .prototype-main { padding: 18px 16px 110px; }
    .bottom-nav { position: sticky; z-index: 4; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); min-height: 72px; border-top: 2px solid var(--border-strong); background: color-mix(in srgb, var(--app) 96%, transparent); backdrop-filter: blur(14px); }
    .bottom-nav button { display: grid; min-width: 0; min-height: 70px; place-items: center; gap: 2px; padding: 8px 2px; border: 0; border-top: 3px solid transparent; background: transparent; color: var(--muted); font-size: .63rem; font-weight: 850; text-transform: uppercase; cursor: pointer; }
    .bottom-nav button span { font-size: 1.05rem; line-height: 1; }
    .bottom-nav button[aria-current="page"] { border-top-color: var(--primary); background: var(--primary-muted); color: var(--primary-text); }
    .eyebrow { margin: 0; color: var(--primary-text); font-size: .66rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .display { margin: 0; font-family: var(--font-display); text-transform: uppercase; }
    .muted { color: var(--muted); }
    .meter { height: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--app); }
    .meter > i { display: block; width: var(--value, 50%); height: 100%; background: var(--xp); }
    .avatar { width: 62px; height: 62px; flex: 0 0 auto; object-fit: cover; border: 2px solid var(--border-strong); background: var(--subtle); image-rendering: pixelated; box-shadow: 3px 3px 0 var(--shadow); }
    .primary-action { display: inline-flex; min-height: 50px; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border: 2px solid var(--border-strong); background: var(--primary); color: white; font-weight: 900; cursor: pointer; box-shadow: 3px 3px 0 var(--border-strong); transition: transform 140ms var(--ease-out), filter 160ms ease; }
    .primary-action:hover { filter: brightness(1.08); }
    .secondary-action { min-height: 46px; padding: 9px 13px; border: 1px solid var(--border); background: var(--raised); color: var(--text); font-weight: 800; cursor: pointer; transition: border-color 150ms ease, transform 140ms var(--ease-out); }
    .secondary-action:hover { border-color: var(--primary); }
    .prototype-toast { position: fixed; z-index: 20; right: 16px; bottom: 92px; left: 16px; width: min(calc(100% - 32px), 420px); min-height: 46px; margin-inline: auto; padding: 13px 15px; border: 1px solid var(--primary); background: var(--raised); box-shadow: 4px 4px 0 var(--shadow); font-size: .8rem; font-weight: 800; animation: toast-in 180ms var(--ease-out); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    /* Daily Quest: open hierarchy, one dominant mission. */
    .daily { display: grid; gap: 20px; }
    .daily-player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .daily-player-copy { min-width: 0; }
    .daily-player h1 { margin: 3px 0 4px; overflow-wrap: anywhere; font-size: clamp(1.7rem, 9vw, 2.55rem); line-height: .95; }
    .daily-level { align-self: stretch; display: grid; min-width: 58px; place-content: center; border-left: 1px solid var(--border); text-align: center; }
    .daily-level strong { color: var(--xp); font-family: var(--font-display); font-size: 1.35rem; }
    .daily-level small { color: var(--muted); font-size: .58rem; font-weight: 900; text-transform: uppercase; }
    .daily-quest { position: relative; display: grid; gap: 14px; padding: 20px; overflow: hidden; border: 2px solid var(--primary); background: linear-gradient(145deg, var(--primary-muted), var(--raised)); box-shadow: 5px 5px 0 color-mix(in srgb, var(--primary) 45%, var(--shadow)); }
    .daily-quest::before { position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--primary); content: ""; }
    .quest-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .quest-title h2 { margin: 4px 0 3px; font-size: clamp(1.65rem, 9vw, 2.55rem); line-height: 1; }
    .quest-title p { margin: 0; color: var(--muted); font-size: .78rem; }
    .quest-glyph { display: grid; width: 46px; height: 46px; flex: 0 0 auto; place-items: center; border: 1px solid var(--primary); background: var(--surface); color: var(--primary-text); font-family: var(--font-display); font-size: 1.15rem; }
    .daily-quest .primary-action { width: 100%; }
    .daily-status { display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--border); }
    .daily-status button, .daily-status div { display: grid; min-width: 0; min-height: 70px; align-content: center; gap: 3px; padding: 10px 7px; border: 0; border-right: 1px solid var(--border); background: transparent; color: var(--text); text-align: left; }
    .daily-status > :last-child { border-right: 0; }
    .daily-status strong { overflow-wrap: anywhere; color: var(--xp); font-family: var(--font-display); font-size: 1.05rem; }
    .daily-status small { color: var(--muted); font-size: .58rem; font-weight: 850; text-transform: uppercase; }
    .daily-support { display: grid; gap: 12px; }
    .daily-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 11px; min-height: 58px; padding-block: 8px; border-bottom: 1px solid var(--border); }
    .daily-row-icon { display: grid; width: 34px; height: 34px; place-items: center; background: var(--primary-muted); color: var(--primary-text); font-size: 1rem; }
    .daily-row span { display: grid; min-width: 0; gap: 2px; }
    .daily-row strong { font-family: var(--font-display); font-size: .9rem; text-transform: uppercase; }
    .daily-row small { color: var(--muted); font-size: .7rem; }
    .daily-row button { min-width: 46px; min-height: 46px; border: 0; background: transparent; color: var(--primary-text); cursor: pointer; }
    .detail-reveal { display: grid; gap: 8px; padding: 12px; border-left: 3px solid var(--warm); background: var(--subtle); font-size: .76rem; }

    /* Handheld Command: screen, cursor, contextual detail. */
    .handheld-body { padding: 13px; border: 3px solid var(--border-strong); border-radius: 18px 18px 28px 28px; background: var(--app); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--border) 45%, transparent), 6px 7px 0 var(--shadow); }
    .handheld-screen { min-height: 620px; padding: 15px; border: 3px solid var(--border-strong); border-radius: 8px; background: color-mix(in srgb, var(--primary-muted) 62%, var(--surface)); box-shadow: inset 0 0 22px var(--shadow); }
    .handheld-status { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 2px dashed var(--border); }
    .handheld-status .avatar { width: 50px; height: 50px; box-shadow: none; }
    .handheld-status h1 { margin: 0; font-size: 1.5rem; }
    .handheld-level { color: var(--xp); font-family: var(--font-display); font-size: .82rem; text-align: right; }
    .command-mission { display: grid; gap: 9px; margin: 14px 0; padding: 13px; border: 2px solid var(--primary); background: var(--raised); }
    .command-mission h2 { font-size: 1.5rem; }
    .command-mission-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .72rem; }
    .command-menu { display: grid; gap: 4px; }
    .command-row { display: grid; min-height: 51px; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid transparent; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
    .command-row .cursor { color: transparent; font-family: var(--font-display); }
    .command-row strong { font-family: var(--font-display); font-size: .83rem; letter-spacing: .04em; text-transform: uppercase; }
    .command-row small { color: var(--muted); font-size: .67rem; }
    .command-row[aria-selected="true"] { border-color: var(--primary); background: var(--primary-muted); color: var(--primary-text); }
    .command-row[aria-selected="true"] .cursor { color: var(--primary-text); }
    .command-detail { display: grid; gap: 10px; min-height: 128px; margin-top: 12px; padding: 13px; border-top: 2px solid var(--border-strong); background: var(--surface); }
    .command-detail strong { font-family: var(--font-display); text-transform: uppercase; }
    .command-detail p { margin: 0; color: var(--muted); font-size: .76rem; line-height: 1.45; }
    .handheld-controls { display: flex; align-items: center; justify-content: space-between; padding: 18px 11px 6px; }
    .dpad { display: grid; width: 78px; height: 78px; grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
    .dpad i { background: var(--border-strong); }
    .dpad i:nth-child(1) { grid-area: 1 / 2; }
    .dpad i:nth-child(2) { grid-area: 2 / 1 / 3 / 4; }
    .dpad i:nth-child(3) { grid-area: 3 / 2; }
    .ab { display: flex; gap: 12px; transform: rotate(-18deg); }
    .ab i { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 50%; background: var(--primary-strong); color: white; font-family: var(--font-display); font-style: normal; box-shadow: 2px 3px 0 var(--shadow); }

    /* Adventurer Camp: central quest board plus expandable stations. */
    .camp { display: grid; gap: 18px; }
    .camp-sky { position: relative; min-height: 185px; overflow: hidden; border: 2px solid var(--border-strong); background: linear-gradient(180deg, color-mix(in srgb, var(--primary-muted) 65%, var(--raised)), var(--surface)); }
    .camp-sky::before { position: absolute; right: -26px; bottom: 35px; width: 160px; height: 85px; border: 2px solid var(--border); background: var(--subtle); content: ""; transform: rotate(-10deg); }
    .camp-sky::after { position: absolute; right: 24px; bottom: 20px; width: 74px; height: 58px; border: 2px solid var(--warm); background: color-mix(in srgb, var(--warm) 18%, var(--raised)); content: ""; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .camp-player { position: absolute; z-index: 1; top: 18px; left: 17px; display: flex; align-items: center; gap: 12px; }
    .camp-player .avatar { width: 76px; height: 76px; }
    .camp-player h1 { margin: 3px 0; font-size: 1.85rem; }
    .camp-player p:last-child { margin: 0; color: var(--muted); font-size: .72rem; }
    .camp-stats { position: absolute; z-index: 1; right: 14px; bottom: 12px; left: 14px; display: flex; gap: 7px; }
    .camp-stats span { flex: 1; padding: 8px; border: 1px solid var(--border); background: color-mix(in srgb, var(--app) 88%, transparent); }
    .camp-stats strong, .camp-stats small { display: block; }
    .camp-stats strong { color: var(--xp); font-family: var(--font-display); }
    .camp-stats small { color: var(--muted); font-size: .55rem; font-weight: 900; text-transform: uppercase; }
    .quest-board { display: grid; gap: 13px; padding: 20px 18px; border: 3px solid var(--warm); background: linear-gradient(135deg, color-mix(in srgb, var(--warm) 16%, var(--raised)), var(--raised)); box-shadow: 5px 5px 0 var(--shadow); transform: rotate(-.35deg); }
    .quest-board h2 { margin: 3px 0 0; font-size: 2rem; line-height: 1; }
    .quest-board p { margin: 0; color: var(--muted); font-size: .78rem; }
    .quest-board .primary-action { width: 100%; transform: rotate(.35deg); }
    .camp-map-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
    .camp-map-title h2 { font-size: 1.15rem; }
    .camp-map-title small { color: var(--muted); font-size: .65rem; }
    .camp-stations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .camp-station { display: grid; min-height: 112px; align-content: space-between; gap: 10px; padding: 13px; border: 1px solid var(--border); background: var(--raised); color: var(--text); text-align: left; cursor: pointer; transition: border-color 150ms ease, transform 140ms var(--ease-out); }
    .camp-station:hover, .camp-station[aria-expanded="true"] { border-color: var(--primary); }
    .camp-station span:first-child { color: var(--primary-text); font-size: 1.15rem; }
    .camp-station strong { font-family: var(--font-display); font-size: .84rem; text-transform: uppercase; }
    .camp-station small { color: var(--muted); font-size: .66rem; line-height: 1.35; }
    .camp-station-detail { grid-column: 1 / -1; display: grid; gap: 8px; padding: 14px; border-left: 4px solid var(--primary); background: var(--subtle); font-size: .76rem; }
    .camp-station-detail p { margin: 0; }

    .variant-enter > * { animation: rise-in 220ms var(--ease-out) both; }
    .variant-enter > *:nth-child(2) { animation-delay: 35ms; }
    .variant-enter > *:nth-child(3) { animation-delay: 70ms; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(7px); } }

    @media (min-width: 700px) {
      body { padding: 32px 0; }
      .phone-shell { min-height: calc(100vh - 64px); border: 1px solid var(--border); }
    }

    @media (prefers-reduced-motion: reduce) {
      .variant-enter > *, .prototype-toast { animation: none; }
      .fitdex-prototype button { transition-duration: 0ms; }
    }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body>
  <main id="stage" aria-live="polite"></main>

  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Daily Quest</button>
    <button class="proto-picker-item">Handheld Command</button>
    <button class="proto-picker-item">Adventurer Camp</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const avatar = '/avatars/spartans/aster.png';

    function appHeader() {
      return `<header class="app-topbar">
        <div class="brand"><img src="${document.documentElement.dataset.family === 'amazonians' ? '/branding/fitdex-icon-amazonian.png' : '/branding/fitdex-icon-spartan.png'}" alt=""><strong>FitDex</strong></div>
        <div class="theme-controls" role="group" aria-label="Theme preview">
          <button class="pressable" type="button" data-theme="spartans" aria-label="Preview Spartan theme" aria-pressed="${document.documentElement.dataset.family === 'spartans'}">S</button>
          <button class="pressable" type="button" data-theme="amazonians" aria-label="Preview Amazonian theme" aria-pressed="${document.documentElement.dataset.family === 'amazonians'}">A</button>
        </div>
        <button class="brightness-button pressable" type="button" data-brightness aria-label="Toggle light and dark preview">${document.documentElement.dataset.brightness === 'dark' ? '☾' : '☀'}</button>
      </header>`;
    }

    function bottomNav() {
      return `<nav class="bottom-nav" aria-label="Prototype primary navigation">
        <button type="button" aria-current="page"><span>⌂</span>Home</button>
        <button type="button" data-demo="Workout"><span>◆</span>Workout</button>
        <button type="button" data-demo="Food"><span>◒</span>Food</button>
        <button type="button" data-demo="Progress"><span>▥</span>Progress</button>
        <button type="button" data-demo="Journal"><span>▤</span>Journal</button>
      </nav>`;
    }

    function dailyQuest() {
      return `<article class="fitdex-prototype"><div class="phone-shell">${appHeader()}
        <div class="prototype-main daily variant-enter">
          <section class="daily-player">
            <img class="avatar" src="${avatar}" alt="Aster, Spartan avatar">
            <div class="daily-player-copy"><p class="eyebrow">Good morning</p><h1 class="display">Aster</h1><div class="meter" style="--value:68%"><i></i></div></div>
            <div class="daily-level"><strong>18</strong><small>Level</small></div>
          </section>
          <section class="daily-quest">
            <div class="quest-title"><div><p class="eyebrow">Today's Quest · Ready</p><h2 class="display">Push Day</h2><p>6 exercises · about 52 min</p></div><span class="quest-glyph" aria-hidden="true">01</span></div>
            <div><p class="eyebrow">Quest reward</p><strong>+120 workout XP</strong></div>
            <button class="primary-action pressable" type="button" data-start>Start Push Day</button>
          </section>
          <section class="daily-status" aria-label="Player status">
            <button class="pressable" type="button" data-detail="daily-xp"><strong>6,840</strong><small>Lifetime XP</small></button>
            <button class="pressable" type="button" data-detail="daily-streak"><strong>7 days</strong><small>Plan streak</small></button>
            <div><strong>1,920</strong><small>kcal today</small></div>
          </section>
          <div id="daily-detail" hidden></div>
          <section class="daily-support" aria-label="Today at a glance">
            <div class="daily-row"><span class="daily-row-icon" aria-hidden="true">P</span><span><strong>Nutrition</strong><small>1,920 / 2,450 kcal · 132 / 170g protein</small></span><button class="pressable" type="button" data-demo="Nutrition details" aria-label="Open nutrition details">›</button></div>
            <div class="daily-row"><span class="daily-row-icon" aria-hidden="true">W</span><span><strong>Weekly plan</strong><small>3 of 5 sessions · Legs tomorrow</small></span><button class="pressable" type="button" data-detail="daily-week" aria-label="Show weekly plan">›</button></div>
            <div class="daily-row"><span class="daily-row-icon" aria-hidden="true">♫</span><span><strong>Battle Music</strong><small data-music-copy>Warrior · ready</small></span><button class="pressable" type="button" data-music aria-label="Toggle Battle Music" aria-pressed="false">▶</button></div>
            <button class="secondary-action pressable" type="button" data-detail="daily-more" aria-expanded="false">More from today</button>
          </section>
        </div>${bottomNav()}</div></article>`;
    }

    const commandDetails = {
      nutrition: ['Provisions', '1,920 / 2,450 kcal. Protein 132 / 170g. Two meals logged.'],
      progress: ['Training Log', '3 workouts this week. Bench Press PR: 92.5 kg.'],
      achievements: ['Trophy Case', 'Latest unlock: Iron Discipline. 14 of 32 achievements earned.'],
      music: ['Battle Music', 'Warrior is selected. Music stays independent from navigation.'],
      plan: ['Quest Map', 'Push today. Legs tomorrow. Rest Thursday. Pull Friday.']
    };

    function handheldCommand() {
      return `<article class="fitdex-prototype"><div class="phone-shell">${appHeader()}
        <div class="prototype-main variant-enter">
          <section class="handheld-body">
            <div class="handheld-screen">
              <header class="handheld-status"><img class="avatar" src="${avatar}" alt="Aster, Spartan avatar"><div><p class="eyebrow">Player 01</p><h1 class="display">Aster</h1><div class="meter" style="--value:68%"><i></i></div></div><div class="handheld-level">LV 18<br>XP 6,840<br>STK 07</div></header>
              <section class="command-mission"><p class="eyebrow">Selected mission</p><h2 class="display">Push Day</h2><div class="command-mission-line"><span>6 exercises</span><span>Ready</span></div><button class="primary-action pressable" type="button" data-start>Start mission</button></section>
              <div class="command-menu" role="listbox" aria-label="Home commands">
                <button class="command-row pressable" type="button" role="option" data-command="nutrition" aria-selected="true"><span class="cursor">▶</span><strong>Provisions</strong><small>1,920 kcal</small></button>
                <button class="command-row pressable" type="button" role="option" data-command="progress" aria-selected="false"><span class="cursor">▶</span><strong>Training Log</strong><small>3 sessions</small></button>
                <button class="command-row pressable" type="button" role="option" data-command="achievements" aria-selected="false"><span class="cursor">▶</span><strong>Trophy Case</strong><small>14 / 32</small></button>
                <button class="command-row pressable" type="button" role="option" data-command="music" aria-selected="false"><span class="cursor">▶</span><strong>Battle Music</strong><small>Warrior</small></button>
                <button class="command-row pressable" type="button" role="option" data-command="plan" aria-selected="false"><span class="cursor">▶</span><strong>Quest Map</strong><small>5 days</small></button>
              </div>
              <section class="command-detail" aria-live="polite"><strong>${commandDetails.nutrition[0]}</strong><p>${commandDetails.nutrition[1]}</p><button class="secondary-action pressable" type="button" data-demo="Open Provisions">Open</button></section>
            </div>
            <div class="handheld-controls" aria-hidden="true"><span class="dpad"><i></i><i></i><i></i></span><span class="ab"><i>B</i><i>A</i></span></div>
          </section>
        </div>${bottomNav()}</div></article>`;
    }

    const campDetails = {
      provisions: ['Provisions ready', '1,920 of 2,450 kcal · 132 of 170g protein. Two meals logged.'],
      training: ['Training status', '3 workouts this week · 12,840 kg volume · Bench Press PR 92.5 kg.'],
      music: ['Camp ambience', 'Warrior selected. Start or pause Battle Music without changing theme.'],
      map: ['Upcoming quests', 'Wed Legs · Thu Rest · Fri Pull · Sat Conditioning.']
    };

    function adventurerCamp() {
      return `<article class="fitdex-prototype"><div class="phone-shell">${appHeader()}
        <div class="prototype-main camp variant-enter">
          <section class="camp-sky">
            <div class="camp-player"><img class="avatar" src="${avatar}" alt="Aster, Spartan avatar"><div><p class="eyebrow">Training camp</p><h1 class="display">Aster</h1><p>Level 18 · Iron Vanguard</p></div></div>
            <div class="camp-stats"><span><strong>6,840</strong><small>XP</small></span><span><strong>7 days</strong><small>Streak</small></span><span><strong>14</strong><small>Badges</small></span></div>
          </section>
          <section class="quest-board">
            <div><p class="eyebrow">Today's central quest</p><h2 class="display">Push Day</h2></div><p>Six movements prepared. Estimated training time: 52 minutes.</p><div class="meter" style="--value:0%"><i></i></div><button class="primary-action pressable" type="button" data-start>Begin training</button>
          </section>
          <div class="camp-map-title"><div><p class="eyebrow">Around camp</p><h2 class="display">Prepare your run</h2></div><small>Tap a station</small></div>
          <section class="camp-stations">
            <button class="camp-station pressable" type="button" data-station="provisions" aria-expanded="false"><span aria-hidden="true">◒</span><strong>Provisions</strong><small>Calories and protein ready for review</small></button>
            <button class="camp-station pressable" type="button" data-station="training" aria-expanded="false"><span aria-hidden="true">▥</span><strong>Training Tent</strong><small>Progress, records, and achievements</small></button>
            <button class="camp-station pressable" type="button" data-station="music" aria-expanded="false"><span aria-hidden="true">♫</span><strong>War Drum</strong><small>Battle Music · Warrior</small></button>
            <button class="camp-station pressable" type="button" data-station="map" aria-expanded="false"><span aria-hidden="true">◇</span><strong>Quest Map</strong><small>Weekly plan and upcoming sessions</small></button>
            <div id="camp-detail" class="camp-station-detail" hidden></div>
          </section>
        </div>${bottomNav()}</div></article>`;
    }

    const variants = [dailyQuest, handheldCommand, adventurerCamp];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

    stage.addEventListener('click', (event) => {
      const target = event.target.closest('button');
      if (!target) return;
      if (target.dataset.theme) {
        document.documentElement.dataset.family = target.dataset.theme;
        mount(current);
        return;
      }
      if (target.hasAttribute('data-brightness')) {
        document.documentElement.dataset.brightness = document.documentElement.dataset.brightness === 'dark' ? 'light' : 'dark';
        mount(current);
        return;
      }
      if (target.hasAttribute('data-start')) {
        target.textContent = target.textContent.toLowerCase().includes('resume') ? 'Workout resumed' : 'Resume Push Day';
        target.setAttribute('aria-pressed', 'true');
        showToast('Prototype only · Push Day is now shown as active.');
        return;
      }
      if (target.hasAttribute('data-music')) {
        const playing = target.getAttribute('aria-pressed') !== 'true';
        target.setAttribute('aria-pressed', String(playing));
        target.textContent = playing ? 'Ⅱ' : '▶';
        const copy = stage.querySelector('[data-music-copy]');
        if (copy) copy.textContent = playing ? 'Warrior · playing' : 'Warrior · paused';
        return;
      }
      if (target.dataset.detail) {
        const detail = stage.querySelector('#daily-detail');
        if (!detail) return;
        const content = {
          'daily-xp': '<div class="detail-reveal"><strong>Level 18 · Iron Vanguard</strong><span>660 XP until Level 19.</span></div>',
          'daily-streak': '<div class="detail-reveal"><strong>7-day Plan Streak</strong><span>Best: 12 days · 2 freezes available.</span></div>',
          'daily-week': '<div class="detail-reveal"><strong>Weekly quest line</strong><span>Mon Push ✓ · Tue Pull ✓ · Wed Push today · Thu Legs · Fri Rest</span></div>',
          'daily-more': '<div class="detail-reveal"><strong>Recent progress</strong><span>Bench Press PR 92.5 kg · Iron Discipline unlocked · 3 workouts this week.</span></div>'
        }[target.dataset.detail];
        const opening = detail.hidden || detail.dataset.key !== target.dataset.detail;
        detail.hidden = !opening;
        detail.dataset.key = opening ? target.dataset.detail : '';
        detail.innerHTML = opening ? content : '';
        target.setAttribute('aria-expanded', String(opening));
        return;
      }
      if (target.dataset.command) {
        stage.querySelectorAll('[data-command]').forEach((row) => row.setAttribute('aria-selected', String(row === target)));
        const [title, copy] = commandDetails[target.dataset.command];
        stage.querySelector('.command-detail').innerHTML = `<strong>${title}</strong><p>${copy}</p><button class="secondary-action pressable" type="button" data-demo="Open ${title}">Open</button>`;
        return;
      }
      if (target.dataset.station) {
        const detail = stage.querySelector('#camp-detail');
        const opening = detail.hidden || detail.dataset.key !== target.dataset.station;
        stage.querySelectorAll('[data-station]').forEach((station) => station.setAttribute('aria-expanded', String(opening && station === target)));
        detail.hidden = !opening;
        detail.dataset.key = opening ? target.dataset.station : '';
        if (opening) {
          const [title, copy] = campDetails[target.dataset.station];
          detail.innerHTML = `<strong>${title}</strong><p>${copy}</p><button class="secondary-action pressable" type="button" data-demo="Open ${title}">Open</button>`;
        }
        return;
      }
      if (target.dataset.demo) showToast(`${target.dataset.demo} · prototype interaction only.`);
    });

    function showToast(message) {
      stage.querySelector('.prototype-toast')?.remove();
      const toast = document.createElement('div');
      toast.className = 'prototype-toast';
      toast.setAttribute('role', 'status');
      toast.textContent = message;
      stage.append(toast);
      window.setTimeout(() => toast.remove(), 2200);
    }
  </script>
</body>
</html>
